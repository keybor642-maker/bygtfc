name: Build Wisps plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Create pom.xml
        run: |
            mkdir -p $(dirname pom.xml)
            cat > pom.xml <<'EOF_POM'
            <?xml version="1.0" encoding="UTF-8"?>
            <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                     xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>me.lofi</groupId>
              <artifactId>Wisps</artifactId>
              <version>1.5.0</version>
              <packaging>jar</packaging>

              <properties>
                <maven.compiler.release>25</maven.compiler.release>
                <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                <repository>
                  <id>papermc</id>
                  <url>https://repo.papermc.io/repository/maven-public/</url>
                </repository>
              </repositories>

              <dependencies>
                <dependency>
                  <groupId>io.papermc.paper</groupId>
                  <artifactId>paper-api</artifactId>
                  <version>[26.2.build,)</version>
                  <scope>provided</scope>
                </dependency>
              </dependencies>
            </project>
            EOF_POM

      - name: Create plugin.yml
        run: |
            mkdir -p $(dirname src/main/resources/plugin.yml)
            cat > src/main/resources/plugin.yml <<'EOF_PLUGIN'
            name: Wisps
            version: 1.5.0
            main: me.lofi.wisps.WispsPlugin
            api-version: '26.2'
            description: Wisps offer Binding Vows, and mythic gems can awaken.
            softdepend: [BlissGems, BlissMythics, BlissPlus]
            commands:
              vow:
                description: View or manage binding vows
                usage: /vow list|info|give|revoke|clear
              wisp:
                description: Summon a wisp, trigger an awakening, or toggle tracking
                usage: /wisp (offer|prophet|hourglass|awaken|endawaken|skip|cancel|lock|shake|tracking|list|reload)
                permission: wisps.admin
              track:
                description: Show where a tracked awakened player is
                usage: /track
                permission: wisps.track
              controlroom:
                description: The Control Room (Honored One only), and the server rules
                usage: /controlroom enter|leave|rules
                aliases: [cr]
              honored:
                description: The Honored One title and event
                usage: /honored status
            permissions:
              wisps.admin:
                description: Manage vows, trigger wisp offers and awakenings, toggle tracking
                default: op
              wisps.track:
                description: Use /track
                default: true
            EOF_PLUGIN

      - name: Create config.yml
        run: |
            mkdir -p $(dirname src/main/resources/config.yml)
            cat > src/main/resources/config.yml <<'EOF_CONFIG'
            # How many vows a wisp offers per visit. A mythic holder's awakening takes one of these slots.
            options: 3

            # How long the wisp waits for your answer in chat before it leaves.
            reply-timeout-seconds: 90

            # How long each line stays on the hotbar (ticks, 20 = 1 second).
            line-ticks: 52

            # The wisp hangs in the sky and pulls your camera up to it. If you look away it tugs you back and shakes your view.
            # Toggle live with "/wisp lock on|off".
            look-lock: true

            # The Prophet speaks slower and then introduces one random "variable" (a vow you may accept or refuse).
            prophet-line-ticks: 44
            prophet-offer-variable: true

            # The Last Heartbeat's drawback. The holder is randomly tracked: they glow and /track shows where they are.
            # Switch it with "/wisp tracking on|off".
            tracking:
              enabled: true
              min-interval-seconds: 45    # shortest wait between tracking windows
              max-interval-seconds: 120   # longest wait
              duration-seconds: 30        # how long each window lasts
            EOF_CONFIG

      - name: Create AwakeningManager.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/AwakeningManager.java)
            cat > src/main/java/me/lofi/wisps/AwakeningManager.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import net.kyori.adventure.text.minimessage.MiniMessage;
            import net.kyori.adventure.text.minimessage.tag.resolver.Placeholder;
            import net.kyori.adventure.text.minimessage.tag.resolver.TagResolver;
            import net.kyori.adventure.title.Title;
            import org.bukkit.Bukkit;
            import org.bukkit.Color;
            import org.bukkit.GameMode;
            import org.bukkit.Location;
            import org.bukkit.Particle;
            import org.bukkit.Sound;
            import org.bukkit.WeatherType;
            import org.bukkit.World;
            import org.bukkit.attribute.Attribute;
            import org.bukkit.attribute.AttributeInstance;
            import org.bukkit.entity.Entity;
            import org.bukkit.entity.LivingEntity;
            import org.bukkit.entity.Player;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.Listener;
            import org.bukkit.event.entity.PlayerDeathEvent;
            import org.bukkit.event.player.PlayerMoveEvent;
            import org.bukkit.event.player.PlayerQuitEvent;
            import org.bukkit.event.player.PlayerToggleFlightEvent;
            import org.bukkit.potion.PotionEffect;
            import org.bukkit.potion.PotionEffectType;
            import org.bukkit.util.Vector;

            import java.time.Duration;
            import java.util.*;
            import java.util.concurrent.ThreadLocalRandom;

            /**
             * Mythic awakenings. A Manifestation offer for a mythic gem holder ends in one of these cinematics,
             * and when it lands the whole server is told "<name> has awakened".
             * Adrenaline is the showpiece: a racing heart, an EKG over your head, a flatline, then the boom.
             */
            public final class AwakeningManager implements Listener, VowManager.Hooks {

                private static final Color RED = Color.fromRGB(255, 35, 50), DARKRED = Color.fromRGB(120, 0, 15),
                        BLACK = Color.fromRGB(10, 5, 8), PALE = Color.fromRGB(235, 225, 225), WHITE = Color.fromRGB(255, 255, 255),
                        BLOOD = Color.fromRGB(170, 8, 28), DRIP = Color.fromRGB(150, 10, 25), BRIGHT_RED = Color.fromRGB(255, 70, 80),
                        GOLD = Color.fromRGB(255, 200, 50), GOLD_LIGHT = Color.fromRGB(255, 232, 140), GOLD_DARK = Color.fromRGB(200, 140, 20);

                private static final class Scene {
                    final Player p;
                    final Vow v;
                    int t;
                    boolean granted;
                    final Location origin;
                    final Vector facing;
                    final boolean prevAllow, prevInv;
                    int nextBeat = 6, interval = 20;
                    double scroll, spin;
                    final List<Integer> pulses = new ArrayList<>(), shocks = new ArrayList<>();
                    final Set<UUID> atmos = new HashSet<>();

                    Scene(Player p, Vow v) {
                        this.p = p; this.v = v;
                        this.origin = p.getLocation().clone();
                        Vector f = p.getLocation().getDirection().setY(0);
                        if (f.lengthSquared() < 1e-6) f = new Vector(0, 0, 1);
                        this.facing = f.normalize();
                        this.prevAllow = p.getAllowFlight();
                        this.prevInv = p.isInvulnerable();
                    }
                }

                private final WispsPlugin plugin;
                private final VowManager vows;
                private final GemBridge bridge;
                private final Map<UUID, Scene> scenes = new HashMap<>();
                private long tick;

                public AwakeningManager(WispsPlugin plugin, VowManager vows, GemBridge bridge) {
                    this.plugin = plugin; this.vows = vows; this.bridge = bridge;
                }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    Bukkit.getScheduler().runTaskTimer(plugin, this::tickAll, 1L, 1L);
                }

                public void shutdown() {
                    for (Scene s : new ArrayList<>(scenes.values())) finish(s, false);
                }

                // ================= API =================

                public boolean isBusy(Player p) { return scenes.containsKey(p.getUniqueId()); }

                /** Holds the right mythic gem, and isn't already awakened. */
                public boolean eligible(Player p, Vow v) {
                    if (!v.awakening || vows.has(p, v.id)) return false;
                    for (Vow x : vows.vows(p)) if (x.awakening) return false;
                    return bridge.holds(p, v.gem, v.minTier);
                }

                /** Starts the cinematic. The vow is granted at the moment of the boom. */
                public boolean begin(Player p, Vow v) {
                    if (!v.awakening || scenes.containsKey(p.getUniqueId())) return false;
                    Scene s = new Scene(p, v);
                    p.setInvulnerable(true);
                    if (v.gem.equals("adrenaline")) { p.setAllowFlight(true); p.setFlying(false); p.setGravity(false); }
                    scenes.put(p.getUniqueId(), s);
                    atmosphereOn(s);
                    return true;
                }

                // ================= LOOP =================

                private void tickAll() {
                    tick++;
                    for (Scene s : new ArrayList<>(scenes.values())) {
                        Player p = s.p;
                        if (!p.isOnline() || p.isDead()) { finish(s, false); continue; }
                        s.t++;
                        boolean done;
                        if (s.v.gem.equals("adrenaline")) done = adrenaline(s);
                        else if (s.v.gem.equals("heretic")) done = heretic(s);
                        else if (s.v.gem.equals("auratus")) done = auratus(s);
                        else done = s.t > 60;
                        if (!done) sky(s);
                        if (done) finish(s, true);
                    }
                    if (tick % 4 == 0) auras();
                }

                private void finish(Scene s, boolean ok) {
                    scenes.remove(s.p.getUniqueId());
                    atmosphereOff(s);
                    Player p = s.p;
                    if (!p.isOnline()) return;
                    if (p.getLocation().getY() - s.origin.getY() > 0.3) {
                        Location l = p.getLocation();
                        l.setY(s.origin.getY());
                        p.teleport(l);
                    }
                    p.setGravity(true);
                    p.setInvulnerable(s.prevInv);
                    p.setAllowFlight(s.prevAllow);
                    p.setFallDistance(0);
                    p.setVelocity(new Vector(0, 0, 0));
                    p.removePotionEffect(PotionEffectType.DARKNESS);
                    if (ok && s.granted) {
                        p.playSound(p.getLocation(), Sound.ENTITY_PLAYER_LEVELUP, 1.0f, 0.6f);
                        p.sendActionBar(Component.text("you have awakened.", NamedTextColor.GOLD));
                        if (s.v.gem.equals("adrenaline")) {
                            p.sendMessage(Component.text("Echoes unlocked: ", NamedTextColor.BLUE, TextDecoration.BOLD)
                                    .append(Component.text("Echo Rush, Echo Chains, Echo Curse, Echo Slam, Echo Surge.", NamedTextColor.GRAY)));
                            p.sendMessage(Component.text("Sneak + scroll to choose one, sneak + left-click to cast it.", NamedTextColor.GRAY));
                        }
                    }
                }

                // ================= ADRENALINE: the heartbeat =================

                private boolean adrenaline(Scene s) {
                    Player p = s.p;
                    World w = p.getWorld();
                    int t = s.t;
                    Location base = p.getLocation();
                    double bx = base.getX(), by = base.getY(), bz = base.getZ();

                    if (t == 1) {
                        w.playSound(base, Sound.BLOCK_BEACON_ACTIVATE, 1.5f, 0.5f);
                        p.sendActionBar(Component.text("your heart is racing...", NamedTextColor.RED));
                    }
                    boolean landed = hover(s, 50, 140);

                    if (t < 100) {
                        if (t >= s.nextBeat) {
                            s.interval = Math.max(4, 20 - (int) (t * 0.17));
                            s.nextBeat = t + s.interval;
                            s.pulses.add(t);
                            w.playSound(base, Sound.ENTITY_WARDEN_HEARTBEAT, 2.5f, 0.7f + t / 160f);
                            CameraFx.shakeArea(base, 28, 0.4 + t / 110.0, 5);
                            p.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 20, 0, false, false, false));
                        }
                    } else if (t < 120) {
                        if (t == 100) {
                            s.pulses.clear();
                            p.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 40, 0, false, false, false));
                            p.sendActionBar(Component.text("...", NamedTextColor.DARK_GRAY));
                        }
                        if (t % 2 == 0) w.playSound(base, Sound.BLOCK_NOTE_BLOCK_PLING, 1.6f, 2.0f); // flatline tone
                    } else if (t == 120) {
                        p.removePotionEffect(PotionEffectType.DARKNESS);
                        grant(s, "#ff2a3a", "#7a0010", "Every heart in the world just skipped a beat.");
                        s.shocks.add(t);
                        s.interval = 16;
                        s.nextBeat = 999;
                        w.strikeLightningEffect(base);
                        w.playSound(base, Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 4f, 0.6f);
                        w.playSound(base, Sound.ENTITY_ENDER_DRAGON_GROWL, 3f, 0.7f);
                        w.playSound(base, Sound.ENTITY_WARDEN_SONIC_BOOM, 3f, 0.8f);
                        CameraFx.shakeArea(base, 45, 4.0, 40);
                        w.spawnParticle(Particle.END_ROD, base.clone().add(0, 1, 0), 220, 2.0, 2.0, 2.0, 0.5);
                        w.spawnParticle(Particle.EXPLOSION_EMITTER, base.clone().add(0, 1, 0), 2);
                        w.spawnParticle(Particle.ELECTRIC_SPARK, base.clone().add(0, 1, 0), 120, 1.5, 1.5, 1.5, 0.6);
                        knock(p, base, 9, 1.4, 0.6);
                    } else if (t < 160 && (t - 120) % 14 == 0) {
                        s.pulses.add(t);
                        w.playSound(base, Sound.ENTITY_WARDEN_HEARTBEAT, 1.5f, 0.9f);
                    }

                    // a red spine of light climbing into the storm, and cracks in the ground after the boom
                    if (t >= 40 && t < 135) column(w, bx, by, bz, 0.3 + Math.min(1.2, (t - 40) * 0.02), 34, RED, BRIGHT_RED, 8);
                    if (t > 120 && t < 160 && t % 2 == 0) cracks(w, bx, by, bz, t - 120);

                    // EKG floating over the head
                    if (t >= 8 && t < 160) {
                        int mode = t < 100 ? 0 : t < 120 ? 1 : t < 134 ? 2 : 0;
                        if (mode == 0) s.scroll += 1.0 / Math.max(4, s.interval);
                        ekg(s, mode);
                    }

                    for (Iterator<Integer> it = s.pulses.iterator(); it.hasNext(); ) {
                        int age = t - it.next();
                        if (age > 14) { it.remove(); continue; }
                        double r = 0.5 + age * 0.55;
                        ring(w, bx, by + 0.15, bz, r, Math.max(20, (int) (r * 12)), RED, 1.3f, 0);
                        ring(w, bx, by + 0.15, bz, r * 0.82, Math.max(16, (int) (r * 9)), BLACK, 1.1f, 0);
                    }
                    shocks(s, w, bx, by, bz, RED, BLACK, WHITE);

                    return landed && t >= 140;
                }

                private void ekg(Scene s, int mode) {
                    Player p = s.p;
                    World w = p.getWorld();
                    Location b = p.getLocation();
                    Vector f = s.facing;
                    Vector right = new Vector(-f.getZ(), 0, f.getX());
                    double cy = b.getY() + 3.6;
                    for (int i = 0; i <= 44; i++) {
                        double x = -3.3 + i * 0.15, y;
                        if (mode == 1) y = 0;
                        else if (mode == 2) { double ax = Math.abs(x); y = ax < 0.9 ? 4.2 * (1 - ax / 0.9) : 0; }
                        else { double ph = (x + 3.3) / 3.0 + s.scroll; y = ecg(ph - Math.floor(ph)) * 0.9; }
                        dust(w, b.getX() + right.getX() * x, cy + y, b.getZ() + right.getZ() * x, mode == 1 ? PALE : RED, mode == 2 ? 1.6f : 1.0f);
                    }
                }

                /** One heartbeat cycle, u in [0,1). */
                private static double ecg(double u) {
                    if (u < 0.10) return 0;
                    if (u < 0.18) return 0.18 * Math.sin((u - 0.10) / 0.08 * Math.PI);
                    if (u < 0.30) return 0;
                    if (u < 0.33) return -0.25 * (u - 0.30) / 0.03;
                    if (u < 0.36) return -0.25 + 1.25 * (u - 0.33) / 0.03;
                    if (u < 0.40) return 1.0 - 1.45 * (u - 0.36) / 0.04;
                    if (u < 0.43) return -0.45 + 0.45 * (u - 0.40) / 0.03;
                    if (u < 0.55) return 0;
                    if (u < 0.70) return 0.3 * Math.sin((u - 0.55) / 0.15 * Math.PI);
                    return 0;
                }

                /** Rise, hold, then settle back down. Returns true once landed. */
                private boolean hover(Scene s, int riseEnd, int descendAt) {
                    Player p = s.p;
                    p.setFallDistance(0);
                    if (s.t < riseEnd) {
                        double k = 1.0 - s.t / (double) riseEnd;
                        p.setVelocity(new Vector(0, 0.03 + 0.08 * k, 0));
                    } else if (s.t < descendAt) {
                        p.setVelocity(new Vector(0, Math.sin(s.t * 0.15) * 0.01, 0));
                    } else {
                        double h = p.getLocation().getY() - s.origin.getY();
                        if (h <= 0.15 || s.t > descendAt + 160) return true;
                        p.setVelocity(new Vector(0, -Math.min(0.12, 0.03 + h * 0.03), 0));
                    }
                    return false;
                }

                // ================= HERETIC: the blood rite =================

                private boolean heretic(Scene s) {
                    Player p = s.p;
                    Location c = s.origin;
                    World w = c.getWorld();
                    int t = s.t;
                    double cx = c.getX(), cy = c.getY() + 0.1, cz = c.getZ();
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();

                    if (t == 1) {
                        w.playSound(c, Sound.BLOCK_BEACON_ACTIVATE, 1.5f, 0.5f);
                        p.sendActionBar(Component.text("the blood answers...", NamedTextColor.DARK_RED));
                    }
                    double R = Math.min(5.0, t * 0.12), rot = t * 0.03;
                    ring(w, cx, cy, cz, R, Math.max(24, (int) (R * 10)), BLOOD, 1.3f, rot);
                    ring(w, cx, cy, cz, R * 0.8, Math.max(20, (int) (R * 8)), BLOOD, 1.0f, -rot);
                    star(w, cx, cy, cz, R * 0.8, rot);
                    if (t >= 20 && t < 135) { // a blood halo turning in the sky
                        ring(w, cx, c.getY() + 16, cz, 8, 64, BLOOD, 1.8f, t * 0.05);
                        ring(w, cx, c.getY() + 16, cz, 6.4, 48, BLACK, 1.4f, -t * 0.07);
                    }
                    for (int i = 0; i < 10; i++) {
                        double a = rnd.nextDouble(6.283), r = 4.2 * Math.sqrt(rnd.nextDouble());
                        dust(w, cx + Math.cos(a) * r, cy + 0.5 + rnd.nextDouble(4), cz + Math.sin(a) * r, DRIP, 1.0f);
                    }
                    if (t % 4 == 0) w.spawnParticle(Particle.CRIMSON_SPORE, new Location(w, cx, cy + 1, cz), 8, 1.5, 1.0, 1.5, 0);
                    if (t == 30 || t == 55 || t == 75 || t == 90) {
                        w.playSound(c, Sound.ENTITY_WARDEN_HEARTBEAT, 2f, 0.5f);
                        CameraFx.shakeArea(c, 28, 0.9, 8);
                    }

                    if (t >= 50 && t < 114) {
                        double dist = t < 100 ? 2.6 : 2.6 + (t - 100) * 0.9;
                        s.spin += 0.2 * (1 + Math.max(0, t - 50) / 40.0);
                        for (int k = 0; k < 4; k++) saw(w, cx, c.getY() + 1.0, cz, s.spin + k * Math.PI / 2, dist, t);
                    }
                    if (t == 100) {
                        grant(s, "#d01030", "#4a0010", "The blood remembers. The world will bleed.");
                        s.shocks.add(t);
                        w.strikeLightningEffect(c);
                        w.playSound(c, Sound.ENTITY_WITHER_SPAWN, 3f, 0.8f);
                        w.playSound(c, Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 3f, 0.7f);
                        CameraFx.shakeArea(c, 45, 3.5, 36);
                        w.spawnParticle(Particle.CRIMSON_SPORE, new Location(w, cx, cy + 1, cz), 160, 2.0, 1.5, 2.0, 0.2);
                        knock(p, c, 9, 1.2, 0.5);
                    }
                    if (t >= 100 && t < 120) column(w, cx, c.getY(), cz, 1.0, 22, BLOOD, BRIGHT_RED, 10); // blood geyser
                    shocks(s, w, cx, c.getY(), cz, BLOOD, BLACK, BRIGHT_RED);
                    return t >= 135;
                }

                private void saw(World w, double cx, double cy, double cz, double ang, double dist, int t) {
                    double rx = Math.cos(ang), rz = Math.sin(ang);
                    double px = cx + rx * dist, pz = cz + rz * dist;
                    for (int j = 0; j < 14; j++) {
                        double a = j * (Math.PI * 2 / 14) + t * 0.5;
                        double u = Math.cos(a) * 0.55, y = Math.sin(a) * 0.55;
                        boolean tooth = j % 3 == 0;
                        dust(w, px + rx * u, cy + y, pz + rz * u, tooth ? BRIGHT_RED : BLOOD, tooth ? 0.7f : 1.1f);
                    }
                }

                private void star(World w, double cx, double cy, double cz, double R, double rot) {
                    for (int k = 0; k < 5; k++) {
                        double a1 = rot + k * 1.2566, a2 = rot + ((k + 2) % 5) * 1.2566;
                        double x1 = cx + Math.cos(a1) * R, z1 = cz + Math.sin(a1) * R;
                        double x2 = cx + Math.cos(a2) * R, z2 = cz + Math.sin(a2) * R;
                        for (int i = 0; i <= 8; i++) {
                            double f = i / 8.0;
                            dust(w, x1 + (x2 - x1) * f, cy, z1 + (z2 - z1) * f, BLOOD, 1.0f);
                        }
                    }
                }

                // ================= AURATUS: the gilded ascension =================

                private boolean auratus(Scene s) {
                    Player p = s.p;
                    Location c = s.origin;
                    World w = c.getWorld();
                    int t = s.t;
                    double cx = c.getX(), cy = c.getY(), cz = c.getZ();
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();

                    if (t == 1) {
                        w.playSound(c, Sound.BLOCK_BEACON_ACTIVATE, 1.5f, 1.0f);
                        p.sendActionBar(Component.text("gold remembers you...", NamedTextColor.GOLD));
                    }
                    for (int i = 0; i < 10; i++) {
                        double a = rnd.nextDouble(6.283), r = 0.9 * Math.sqrt(rnd.nextDouble());
                        dust(w, cx + Math.cos(a) * r, cy + rnd.nextDouble(26), cz + Math.sin(a) * r, GOLD, 1.5f);
                    }
                    if (t % 2 == 0) w.spawnParticle(Particle.END_ROD, new Location(w, cx, cy + rnd.nextDouble(20), cz), 2, 0.5, 0.2, 0.5, 0.01);

                    if (t < 100) ring(w, cx, cy + 3.2, cz, 1.2 + Math.min(t, 70) * 0.012, 36, GOLD_LIGHT, 1.1f, t * 0.1); // halo above the head
                    if (t >= 80 && t < 104 && t % 2 == 0) crown(w, cx, cy + 3.0, cz, 1.3, t * 0.08);
                    double hMax = Math.min(14.0, t * 0.22);
                    for (int k = 0; k < 3; k++) {
                        for (double h = 0, n = 0; h <= hMax; h += 0.45, n++) {
                            double a = h * 1.25 + t * 0.2 + k * 2.094;
                            boolean link = ((int) n) % 3 == 0;
                            dust(w, cx + Math.cos(a) * 1.7, cy + h, cz + Math.sin(a) * 1.7, link ? GOLD_DARK : GOLD_LIGHT, link ? 1.5f : 0.9f);
                        }
                    }
                    if (t % 15 == 0 && t < 80) s.pulses.add(t);
                    for (Iterator<Integer> it = s.pulses.iterator(); it.hasNext(); ) {
                        int age = t - it.next();
                        if (age > 20) { it.remove(); continue; }
                        double r = 0.5 + age * 0.45;
                        ring(w, cx, cy + 0.1, cz, r, Math.max(20, (int) (r * 12)), GOLD, 1.3f, 0);
                    }
                    if (t == 50 || t == 57 || t == 64) {
                        w.playSound(c, Sound.BLOCK_ANVIL_LAND, 1.5f, 0.5f + (t - 50) * 0.02f);
                        CameraFx.shakeArea(c, 28, 1.2, 8);
                    }

                    if (t == 80) {
                        grant(s, "#ffd24a", "#ff9a1e", "Gold crowns the sky. The world will bow.");
                        s.shocks.add(t);
                        w.strikeLightningEffect(c);
                        w.playSound(c, Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 3f, 1.0f);
                        w.playSound(c, Sound.ENTITY_ENDER_DRAGON_GROWL, 3f, 1.1f);
                        CameraFx.shakeArea(c, 45, 3.0, 36);
                        w.spawnParticle(Particle.EXPLOSION_EMITTER, new Location(w, cx, cy + 1, cz), 1);
                        w.spawnParticle(Particle.END_ROD, new Location(w, cx, cy + 1, cz), 80, 1.5, 1.5, 1.5, 0.4);
                        knock(p, c, 9, 0.6, 1.0);
                    }
                    shocks(s, w, cx, cy, cz, GOLD, GOLD_DARK, GOLD_LIGHT);
                    return t >= 112;
                }

                // ================= shared pieces =================

                private void grant(Scene s, String c1, String c2, String tagline) {
                    s.granted = true;
                    vows.grant(s.p, s.v, true);
                    vows.applyEffects(s.p);
                    announce(s.p, s.v, c1, c2, tagline);
                }

                private void announce(Player p, Vow v, String c1, String c2, String tagline) {
                    MiniMessage mm = MiniMessage.miniMessage();
                    TagResolver n = Placeholder.unparsed("name", p.getName());
                    TagResolver t = Placeholder.unparsed("title", v.name);
                    TagResolver line = Placeholder.unparsed("line", tagline);
                    String g = "<gradient:" + c1 + ":" + c2 + ">";
                    String bar = "<bold>" + g + "\u2726 \u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501 \u2726</gradient></bold>";
                    Bukkit.broadcast(Component.empty());
                    Bukkit.broadcast(mm.deserialize(bar));
                    Bukkit.broadcast(mm.deserialize("<bold>" + g + "\u26A1 <name> HAS AWAKENED \u26A1</gradient></bold>", n));
                    Bukkit.broadcast(mm.deserialize(g + "\u2014 <title> \u2014</gradient>", t));
                    Bukkit.broadcast(mm.deserialize("<italic><gray><line></gray></italic>", line));
                    Bukkit.broadcast(mm.deserialize("<italic><gray>The world will tremble.</gray></italic>"));
                    if (v.tracked && plugin.getConfig().getBoolean("tracking.enabled", true))
                        Bukkit.broadcast(mm.deserialize("<italic><dark_red>Its heartbeat can be hunted. Use /track.</dark_red></italic>"));
                    Bukkit.broadcast(mm.deserialize(bar));
                    Bukkit.broadcast(Component.empty());

                    Title title = Title.title(
                            mm.deserialize("<bold>" + g + "<title></gradient></bold>", Placeholder.unparsed("title", v.name.toUpperCase(Locale.ROOT))),
                            mm.deserialize("<gray>\u2726 <name> has awakened \u2726</gray>", n),
                            Title.Times.times(Duration.ofMillis(500), Duration.ofMillis(3500), Duration.ofMillis(1200)));
                    for (Player pl : Bukkit.getOnlinePlayers()) pl.showTitle(title);
                }

                private void shocks(Scene s, World w, double x, double y, double z, Color a, Color b, Color edge) {
                    for (Iterator<Integer> it = s.shocks.iterator(); it.hasNext(); ) {
                        int age = s.t - it.next();
                        if (age > 30) { it.remove(); continue; }
                        double r = 0.8 + age * 0.75;
                        ring(w, x, y + 0.2, z, r, (int) (r * 14), a, 1.8f, 0);
                        ring(w, x, y + 0.2, z, r * 0.9, (int) (r * 11), b, 1.4f, 0);
                        ring(w, x, y + 0.2, z, r * 1.04, (int) (r * 9), edge, 0.6f, 0);
                    }
                }

                private void knock(Player p, Location c, double radius, double force, double up) {
                    for (Entity e : c.getWorld().getNearbyEntities(c, radius, radius / 2, radius)) {
                        if (e == p || !(e instanceof LivingEntity)) continue;
                        if (e instanceof Player o && o.getGameMode() == GameMode.SPECTATOR) continue;
                        Vector away = e.getLocation().toVector().subtract(c.toVector());
                        away.setY(0);
                        if (away.lengthSquared() < 1e-4) away = new Vector(0, 0, 0); else away.normalize();
                        e.setVelocity(away.multiply(force).setY(up));
                    }
                }

                private static void dust(World w, double x, double y, double z, Color c, float size) {
                    w.spawnParticle(Particle.DUST, new Location(w, x, y, z), 1, 0, 0, 0, 0, new Particle.DustOptions(c, size));
                }

                private static void ring(World w, double cx, double cy, double cz, double r, int pts, Color c, float size, double rot) {
                    for (int i = 0; i < pts; i++) {
                        double a = rot + i * Math.PI * 2 / pts;
                        dust(w, cx + Math.cos(a) * r, cy, cz + Math.sin(a) * r, c, size);
                    }
                }

                // ================= atmosphere & flourishes =================

                /** Night and a storm, for the awakener and anyone close enough to watch. Only on their own screens. */
                private void atmosphereOn(Scene s) {
                    Location here = s.p.getLocation();
                    for (Player o : s.p.getWorld().getPlayers()) {
                        if (o != s.p && o.getLocation().distanceSquared(here) > 45.0 * 45.0) continue;
                        o.setPlayerTime(18000L, false);
                        o.setPlayerWeather(WeatherType.DOWNFALL);
                        s.atmos.add(o.getUniqueId());
                    }
                }

                private void atmosphereOff(Scene s) {
                    for (UUID id : s.atmos) {
                        Player o = Bukkit.getPlayer(id);
                        if (o != null) { o.resetPlayerTime(); o.resetPlayerWeather(); }
                    }
                    s.atmos.clear();
                }

                /** Lightning that only looks like lightning, striking around the scene as it builds. */
                private void sky(Scene s) {
                    if (s.t < 24 || s.t % 26 != 0) return;
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();
                    double a = rnd.nextDouble(6.283), d = 9 + rnd.nextDouble(8);
                    s.origin.getWorld().strikeLightningEffect(s.origin.clone().add(Math.cos(a) * d, 0, Math.sin(a) * d));
                }

                /** A tall, flickering column of light. */
                private void column(World w, double x, double y, double z, double width, double height, Color a, Color b, int n) {
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();
                    for (int i = 0; i < n; i++) {
                        double ang = rnd.nextDouble(6.283), r = width * Math.sqrt(rnd.nextDouble());
                        dust(w, x + Math.cos(ang) * r, y + rnd.nextDouble(height), z + Math.sin(ang) * r, i % 3 == 0 ? b : a, 1.5f);
                    }
                    w.spawnParticle(Particle.ELECTRIC_SPARK, new Location(w, x, y + rnd.nextDouble(height * 0.7), z), 2, 0.5, 0.3, 0.5, 0.05);
                }

                /** Cracks racing outward across the ground. */
                private void cracks(World w, double x, double y, double z, int age) {
                    double reach = Math.min(14.0, age * 0.7);
                    for (int k = 0; k < 10; k++) {
                        double a = k * Math.PI * 2 / 10 + Math.sin(k * 7.3) * 0.2;
                        for (double d = 1; d <= reach; d += 0.7) {
                            double wob = Math.sin(d * 1.7 + k) * 0.25;
                            dust(w, x + Math.cos(a) * d + Math.cos(a + 1.57) * wob, y + 0.15, z + Math.sin(a) * d + Math.sin(a + 1.57) * wob,
                                    d < reach - 1.5 ? BLACK : RED, 1.1f);
                        }
                    }
                }

                /** A spiked golden crown turning above the head. */
                private void crown(World w, double x, double y, double z, double r, double rot) {
                    for (int i = 0; i < 36; i++) {
                        double a = i * Math.PI * 2 / 36 + rot;
                        double h = i % 6 == 0 ? 1.4 : 0.4 + 0.3 * Math.abs(Math.sin(i * 0.52));
                        for (double yy = 0; yy <= h; yy += 0.3)
                            dust(w, x + Math.cos(a) * r, y + yy, z + Math.sin(a) * r, yy >= h - 0.3 ? GOLD_LIGHT : GOLD, 1.2f);
                    }
                }

                // ================= auras while awakened =================

                private void auras() {
                    for (Player p : Bukkit.getOnlinePlayers()) {
                        if (scenes.containsKey(p.getUniqueId()) || p.isDead() || p.isInvisible() || p.getGameMode() == GameMode.SPECTATOR) continue;
                        for (Vow v : vows.vows(p)) {
                            if (!v.awakening) continue;
                            if (v.gem.equals("adrenaline")) auraAdrenaline(p);
                            else if (v.gem.equals("heretic")) auraHeretic(p);
                            else if (v.gem.equals("auratus")) auraAuratus(p);
                        }
                    }
                }

                private void auraAdrenaline(Player p) {
                    World w = p.getWorld();
                    Location l = p.getLocation();
                    int ph = (int) (tick % 20);
                    if (ph == 0 || ph == 8) {
                        ring(w, l.getX(), l.getY() + 0.1, l.getZ(), 0.7, 16, RED, 1.0f, 0);
                        if (ph == 0) p.playSound(l, Sound.ENTITY_WARDEN_HEARTBEAT, 0.5f, 1.2f);
                    }
                    if (ph == 4 || ph == 12) ring(w, l.getX(), l.getY() + 0.1, l.getZ(), 1.1, 20, DARKRED, 0.9f, 0);
                    if (p.isSprinting()) {
                        w.spawnParticle(Particle.DUST, l.clone().add(0, 0.2, 0), 3, 0.25, 0.1, 0.25, 0, new Particle.DustOptions(RED, 1.2f));
                        w.spawnParticle(Particle.ELECTRIC_SPARK, l.clone().add(0, 0.8, 0), 2, 0.3, 0.4, 0.3, 0.02);
                    }
                }

                private void auraHeretic(Player p) {
                    World w = p.getWorld();
                    Location l = p.getLocation();
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();
                    for (int i = 0; i < 2; i++)
                        dust(w, l.getX() + rnd.nextDouble(-0.3, 0.3), l.getY() + 0.4 + rnd.nextDouble(1.4), l.getZ() + rnd.nextDouble(-0.3, 0.3), DRIP, 0.9f);
                    w.spawnParticle(Particle.CRIMSON_SPORE, l.clone().add(0, 1.0, 0), 2, 0.4, 0.6, 0.4, 0);
                    if (tick % 8 == 0) ring(w, l.getX(), l.getY() + 0.1, l.getZ(), 0.9, 14, BLOOD, 1.0f, tick * 0.05);
                }

                private void auraAuratus(Player p) {
                    World w = p.getWorld();
                    Location l = p.getLocation();
                    for (int k = 0; k < 3; k++) {
                        double a = tick * 0.12 + k * 2.094;
                        dust(w, l.getX() + Math.cos(a) * 0.95, l.getY() + 1.0 + Math.sin(tick * 0.1 + k) * 0.1, l.getZ() + Math.sin(a) * 0.95, GOLD, 1.3f);
                    }
                    if (tick % 8 == 0) w.spawnParticle(Particle.END_ROD, l.clone().add(0, 2.2, 0), 1, 0.2, 0.1, 0.2, 0.01);
                }

                /** Ends an awakening early (admin command): same as it running out, Burnout included. */
                public boolean endAwakening(Player p) {
                    for (Vow v : vows.vows(p)) {
                        if (!v.awakening) continue;
                        vows.revoke(p, v.id);
                        onExpired(p, v);
                        return true;
                    }
                    return false;
                }

                // ================= hooks from VowManager =================

                @Override
                public void onExpired(Player p, Vow v) {
                    if (!v.awakening) return;
                    burnout(p, v);
                    Bukkit.broadcast(Component.text(p.getName() + "'s awakening has faded.", NamedTextColor.GRAY, TextDecoration.ITALIC));
                }

                private void burnout(Player p, Vow v) {
                    if (v.burnoutSeconds > 0)
                        for (Vow.Eff e : v.burnoutEffects)
                            p.addPotionEffect(new PotionEffect(e.type(), v.burnoutSeconds * 20, e.amp(), false, true, true));
                    p.getWorld().spawnParticle(Particle.SMOKE, p.getLocation().add(0, 1, 0), 40, 0.4, 0.8, 0.4, 0.02);
                    p.playSound(p.getLocation(), Sound.BLOCK_BEACON_DEACTIVATE, 1.2f, 0.6f);
                    p.sendActionBar(Component.text("the awakening fades. burnout.", NamedTextColor.RED));
                }

                /** The one lethal blow the Last Heartbeat lets you shrug off. */
                @Override
                public void onFinalBeat(Player p, Vow v) {
                    AttributeInstance max = p.getAttribute(Attribute.MAX_HEALTH);
                    double cap = max == null ? 20.0 : max.getValue();
                    p.setHealth(Math.max(1.0, Math.min(6.0, cap)));
                    vows.immune(p, 80);
                    World w = p.getWorld();
                    Location l = p.getLocation();
                    w.playSound(l, Sound.ENTITY_WARDEN_HEARTBEAT, 3f, 0.6f);
                    w.playSound(l, Sound.ENTITY_WARDEN_SONIC_BOOM, 2f, 1.0f);
                    w.spawnParticle(Particle.ELECTRIC_SPARK, l.clone().add(0, 1, 0), 80, 1.0, 1.0, 1.0, 0.5);
                    for (int i = 0; i < 3; i++) ring(w, l.getX(), l.getY() + 0.2, l.getZ(), 1.0 + i * 1.6, 32 + i * 12, RED, 1.6f, 0);
                    knock(p, l, 7, 1.3, 0.5);
                    p.showTitle(Title.title(
                            Component.text("FINAL BEAT", NamedTextColor.RED, TextDecoration.BOLD),
                            Component.text("your heart refused to stop.", NamedTextColor.GRAY),
                            Title.Times.times(Duration.ofMillis(200), Duration.ofMillis(1600), Duration.ofMillis(500))));
                    Bukkit.broadcast(Component.text(p.getName() + " refused to die.", NamedTextColor.DARK_RED, TextDecoration.ITALIC));
                    vows.revoke(p, v.id);
                    burnout(p, v);
                }

                // ================= events =================

                @EventHandler
                public void onMove(PlayerMoveEvent e) {
                    if (!scenes.containsKey(e.getPlayer().getUniqueId())) return;
                    Location from = e.getFrom(), to = e.getTo();
                    if (to == null) return;
                    if (from.getX() != to.getX() || from.getZ() != to.getZ()) {
                        to.setX(from.getX());
                        to.setZ(from.getZ());
                        e.setTo(to);
                    }
                }

                @EventHandler
                public void onFlight(PlayerToggleFlightEvent e) {
                    if (scenes.containsKey(e.getPlayer().getUniqueId())) e.setCancelled(true);
                }

                @EventHandler
                public void onQuit(PlayerQuitEvent e) {
                    Scene s = scenes.get(e.getPlayer().getUniqueId());
                    if (s != null) finish(s, false);
                }

                @EventHandler
                public void onDeath(PlayerDeathEvent e) {
                    Scene s = scenes.get(e.getEntity().getUniqueId());
                    if (s != null) finish(s, false);
                }
            }
            EOF_JAVA

      - name: Create CameraFx.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/CameraFx.java)
            cat > src/main/java/me/lofi/wisps/CameraFx.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import org.bukkit.Bukkit;
            import org.bukkit.Location;
            import org.bukkit.entity.Player;

            import java.util.HashMap;
            import java.util.Iterator;
            import java.util.Map;
            import java.util.UUID;
            import java.util.concurrent.ThreadLocalRandom;

            /** Small camera effects: shake a player's view, or everyone near a point. */
            public final class CameraFx {

                private CameraFx() {}

                /** uuid -> {magnitude, ticksLeft, totalTicks} */
                private static final Map<UUID, double[]> SHAKES = new HashMap<>();

                public static void start(WispsPlugin plugin) {
                    Bukkit.getScheduler().runTaskTimer(plugin, CameraFx::tick, 1L, 1L);
                }

                /** Shake that fades out over {@code ticks}. A stronger shake replaces a weaker one. */
                public static void shake(Player p, double magnitude, int ticks) {
                    double[] cur = SHAKES.get(p.getUniqueId());
                    if (cur == null || magnitude >= cur[0] * (cur[1] / cur[2]))
                        SHAKES.put(p.getUniqueId(), new double[]{magnitude, ticks, ticks});
                }

                /** Shakes everyone within {@code radius} blocks of {@code c}, softer the further away. */
                public static void shakeArea(Location c, double radius, double magnitude, int ticks) {
                    if (c.getWorld() == null) return;
                    for (Player p : c.getWorld().getPlayers()) {
                        double d = p.getLocation().distance(c);
                        if (d > radius) continue;
                        shake(p, magnitude * (1.0 - 0.7 * d / radius), ticks);
                    }
                }

                private static void tick() {
                    for (Iterator<Map.Entry<UUID, double[]>> it = SHAKES.entrySet().iterator(); it.hasNext(); ) {
                        Map.Entry<UUID, double[]> en = it.next();
                        Player p = Bukkit.getPlayer(en.getKey());
                        double[] s = en.getValue();
                        if (p == null || --s[1] <= 0) { it.remove(); continue; }
                        jolt(p, s[0] * (s[1] / s[2]));
                    }
                }

                /** One random nudge of the view, up to {@code m} degrees. */
                public static void jolt(Player p, double m) {
                    ThreadLocalRandom r = ThreadLocalRandom.current();
                    Location l = p.getLocation();
                    float yaw = l.getYaw() + (float) r.nextDouble(-m, m);
                    float pitch = (float) Math.max(-89.0, Math.min(89.0, l.getPitch() + r.nextDouble(-m, m) * 0.7));
                    p.setRotation(yaw, pitch);
                }
            }
            EOF_JAVA

      - name: Create ControlCommands.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/ControlCommands.java)
            cat > src/main/java/me/lofi/wisps/ControlCommands.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import org.bukkit.Bukkit;
            import org.bukkit.command.*;
            import org.bukkit.entity.Player;

            import java.util.*;

            /** /controlroom (/cr) and /honored. */
            public final class ControlCommands implements TabExecutor {

                private final ControlRoom room;
                private final ControlRules rules;
                private final HonoredOneManager honored;
                private final PrismaticEdge edge;

                public ControlCommands(ControlRoom room, ControlRules rules, HonoredOneManager honored, PrismaticEdge edge) {
                    this.room = room; this.rules = rules; this.honored = honored; this.edge = edge;
                }

                private static void msg(CommandSender s, String t, NamedTextColor c) { s.sendMessage(Component.text(t, c)); }

                private static boolean admin(CommandSender s) {
                    if (s.hasPermission("wisps.admin")) return true;
                    msg(s, "No permission.", NamedTextColor.RED);
                    return false;
                }

                @Override
                public boolean onCommand(CommandSender s, Command cmd, String label, String[] a) {
                    if (cmd.getName().equalsIgnoreCase("honored")) return honored(s, a);
                    return controlRoom(s, a);
                }

                // ================= /controlroom =================

                private boolean controlRoom(CommandSender s, String[] a) {
                    String sub = a.length == 0 ? "help" : a[0].toLowerCase(Locale.ROOT);
                    switch (sub) {
                        case "enter" -> {
                            Player target = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : (s instanceof Player p ? p : null);
                            if (target == null) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            boolean self = s instanceof Player me && me == target;
                            if (!self && !admin(s)) return true;
                            if (self && !honored.canEnter(target)) { msg(s, "Only the Honored One who ascended may enter the Control Room.", NamedTextColor.RED); return true; }
                            if (!room.enter(target)) msg(s, "Couldn't send " + target.getName() + " there.", NamedTextColor.RED);
                        }
                        case "leave" -> {
                            if (!(s instanceof Player p)) { msg(s, "Players only.", NamedTextColor.RED); return true; }
                            if (room.world() == null || !p.getWorld().equals(room.world())) { msg(s, "You are not in the Control Room.", NamedTextColor.GRAY); return true; }
                            room.leave(p);
                        }
                        case "rules" -> {
                            msg(s, "\u2014 Server rules (set in the Control Room) \u2014", NamedTextColor.WHITE);
                            String group = "";
                            for (ControlRules.Setting st : rules.all()) {
                                if (!st.group.equals(group)) { group = st.group; msg(s, group, NamedTextColor.DARK_GRAY); }
                                s.sendMessage(Component.text("  " + st.label + ": ", NamedTextColor.GRAY)
                                        .append(Component.text(rules.format(st), rules.isBanned(st) ? NamedTextColor.RED : NamedTextColor.GREEN)));
                            }
                        }
                        case "set" -> {
                            if (!admin(s)) return true;
                            ControlRules.Setting st = a.length > 1 ? rules.find(a[1]) : null;
                            if (st == null || a.length < 3) { msg(s, "/controlroom set <rule> <value>   (see /controlroom ids)", NamedTextColor.GRAY); return true; }
                            try { rules.set(st.id, Double.parseDouble(a[2])); }
                            catch (NumberFormatException ex) { msg(s, "Value must be a number.", NamedTextColor.RED); return true; }
                            msg(s, st.label + " is now " + rules.format(st) + ".", NamedTextColor.GREEN);
                        }
                        case "preset" -> {
                            if (!admin(s)) return true;
                            String which = a.length > 1 ? a[1].toLowerCase(Locale.ROOT) : "";
                            if (which.equals("mugm")) {
                                // the changes the first Honored One made
                                rules.set("border.radius", 5000);
                                rules.set("ench.sharpness", 5);
                                rules.set("ench.protection", 4);
                                rules.set("armor.tier", 4);
                                rules.set("armor.netherite", 4);
                                rules.set("item.turtle_master", 0);
                                rules.set("item.slow_falling", 0);
                                rules.set("item.cobweb", 0);
                                rules.set("item.egapple", 0);
                                rules.set("ench.thorns", 0);
                                rules.set("ench.infinity", 0);
                                rules.set("ench.knockback", 1);
                                rules.set("ench.wind_burst", 0);
                                rules.set("item.pearls", 64);
                                rules.set("item.pearl_cd", 4.0);
                                rules.set("item.totems", 2);
                                rules.set("mythic.prismatic", 1);
                                msg(s, "Mugm's rules applied.", NamedTextColor.GREEN);
                            } else if (which.equals("vanilla")) {
                                rules.reset();
                                msg(s, "All rules reset to vanilla.", NamedTextColor.GREEN);
                            } else msg(s, "/controlroom preset <mugm|vanilla>", NamedTextColor.GRAY);
                        }
                        case "ids" -> {
                            if (!admin(s)) return true;
                            for (ControlRules.Setting st : rules.all())
                                msg(s, st.id + "  (" + st.min + " to " + st.max + ")  now " + rules.format(st), NamedTextColor.GRAY);
                        }
                        case "reset" -> {
                            if (!admin(s)) return true;
                            rules.reset();
                            msg(s, "All rules reset to vanilla.", NamedTextColor.GREEN);
                        }
                        case "build" -> {
                            if (!admin(s)) return true;
                            room.build(s instanceof Player p ? p : null);
                        }
                        case "wishes" -> {
                            if (!(admin(s))) return true;
                            List<String> w = room.wishes();
                            if (w.isEmpty()) { msg(s, "The Book of Wishes is empty.", NamedTextColor.GRAY); return true; }
                            msg(s, "Wishes from " + room.wishesBy() + ":", NamedTextColor.WHITE);
                            for (String line : w) msg(s, "  " + line, NamedTextColor.GRAY);
                        }
                        case "prismatic" -> {
                            if (!admin(s)) return true;
                            Player t = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : (s instanceof Player p ? p : null);
                            if (t == null) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            t.getInventory().addItem(edge.create());
                            msg(s, "Gave " + t.getName() + " the Prismatic Edge.", NamedTextColor.GREEN);
                        }
                        default -> {
                            msg(s, "/controlroom enter|leave|rules", NamedTextColor.GRAY);
                            if (s.hasPermission("wisps.admin")) msg(s, "/controlroom set <rule> <value> | preset <mugm|vanilla> | ids | reset | build | wishes | prismatic [player] | enter <player>", NamedTextColor.GRAY);
                        }
                    }
                    return true;
                }

                // ================= /honored =================

                private boolean honored(CommandSender s, String[] a) {
                    String sub = a.length == 0 ? "status" : a[0].toLowerCase(Locale.ROOT);
                    switch (sub) {
                        case "status" -> {
                            msg(s, "The Honored One: " + honored.holderName() + (honored.ascended() ? "  (ascended)" : ""), NamedTextColor.WHITE);
                            msg(s, "Event: " + honored.timeLeft(), NamedTextColor.GRAY);
                        }
                        case "set", "ascend" -> {
                            if (!admin(s)) return true;
                            Player t = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : null;
                            if (t == null) { msg(s, "/honored " + sub + " <player>", NamedTextColor.GRAY); return true; }
                            honored.setHolder(t, sub.equals("ascend"));
                            msg(s, t.getName() + " is now the Honored One" + (sub.equals("ascend") ? " and has ascended." : "."), NamedTextColor.GREEN);
                        }
                        case "clear" -> {
                            if (!admin(s)) return true;
                            honored.clear();
                            msg(s, "The title has been cleared.", NamedTextColor.GREEN);
                        }
                        case "event" -> {
                            if (!admin(s)) return true;
                            String act = a.length > 1 ? a[1].toLowerCase(Locale.ROOT) : "status";
                            if (act.equals("start")) {
                                int days = 10;
                                if (a.length > 2) try { days = Math.max(1, Math.min(60, Integer.parseInt(a[2]))); } catch (NumberFormatException ignored) {}
                                Player first = a.length > 3 ? Bukkit.getPlayerExact(a[3]) : null;
                                if (first == null) {
                                    List<Player> on = new ArrayList<>(Bukkit.getOnlinePlayers());
                                    if (on.isEmpty()) { msg(s, "No one is online.", NamedTextColor.RED); return true; }
                                    first = on.get(new Random().nextInt(on.size()));
                                }
                                honored.startEvent(days, first);
                            } else if (act.equals("end")) {
                                if (!honored.eventActive()) msg(s, "No event is running.", NamedTextColor.GRAY);
                                else honored.endEvent();
                            } else msg(s, "Event: " + honored.timeLeft(), NamedTextColor.GRAY);
                        }
                        default -> msg(s, "/honored status" + (s.hasPermission("wisps.admin") ? " | set <p> | ascend <p> | clear | event start [days] [player] | event end" : ""), NamedTextColor.GRAY);
                    }
                    return true;
                }

                @Override
                public List<String> onTabComplete(CommandSender s, Command c, String l, String[] a) {
                    List<String> out = new ArrayList<>();
                    boolean isHonored = c.getName().equalsIgnoreCase("honored");
                    String sub = a.length > 0 ? a[0].toLowerCase(Locale.ROOT) : "";
                    if (isHonored) {
                        if (a.length == 1) out.addAll(List.of("status", "set", "ascend", "clear", "event"));
                        else if (a.length == 2 && sub.equals("event")) out.addAll(List.of("start", "end", "status"));
                        else if (a.length == 2 && (sub.equals("set") || sub.equals("ascend"))) Bukkit.getOnlinePlayers().forEach(p -> out.add(p.getName()));
                        else if (a.length == 4 && sub.equals("event")) Bukkit.getOnlinePlayers().forEach(p -> out.add(p.getName()));
                    } else {
                        if (a.length == 1) out.addAll(List.of("enter", "leave", "rules", "preset", "set", "ids", "reset", "build", "wishes", "prismatic"));
                        else if (a.length == 2 && sub.equals("preset")) out.addAll(List.of("mugm", "vanilla"));
                        else if (a.length == 2 && sub.equals("set")) for (ControlRules.Setting st : rules.all()) out.add(st.id);
                        else if (a.length == 2 && (sub.equals("enter") || sub.equals("prismatic"))) Bukkit.getOnlinePlayers().forEach(p -> out.add(p.getName()));
                    }
                    String last = a[a.length - 1].toLowerCase(Locale.ROOT);
                    return out.stream().filter(x -> x.toLowerCase(Locale.ROOT).startsWith(last)).toList();
                }
            }
            EOF_JAVA

      - name: Create ControlRoom.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/ControlRoom.java)
            cat > src/main/java/me/lofi/wisps/ControlRoom.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import net.kyori.adventure.text.serializer.plain.PlainTextComponentSerializer;
            import net.kyori.adventure.title.Title;
            import org.bukkit.Bukkit;
            import org.bukkit.Color;
            import org.bukkit.Difficulty;
            import org.bukkit.Location;
            import org.bukkit.Material;
            import org.bukkit.NamespacedKey;
            import org.bukkit.Particle;
            import org.bukkit.Sound;
            import org.bukkit.World;
            import org.bukkit.WorldCreator;
            import org.bukkit.block.Block;
            import org.bukkit.block.BlockState;
            import org.bukkit.block.Sign;
            import org.bukkit.block.sign.Side;
            import org.bukkit.block.sign.SignSide;
            import org.bukkit.entity.Player;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.EventPriority;
            import org.bukkit.event.Listener;
            import org.bukkit.event.block.Action;
            import org.bukkit.event.block.BlockBreakEvent;
            import org.bukkit.event.block.BlockPlaceEvent;
            import org.bukkit.event.player.PlayerChangedWorldEvent;
            import org.bukkit.event.player.PlayerEditBookEvent;
            import org.bukkit.event.player.PlayerInteractEvent;
            import org.bukkit.generator.ChunkGenerator;
            import org.bukkit.inventory.EquipmentSlot;
            import org.bukkit.inventory.ItemStack;
            import org.bukkit.inventory.meta.BookMeta;
            import org.bukkit.persistence.PersistentDataType;
            import org.bukkit.scheduler.BukkitRunnable;

            import java.time.Duration;
            import java.util.*;
            import java.util.concurrent.ThreadLocalRandom;

            /**
             * The Control Room: a black-and-white void world with a central control tower, floating islands, and a
             * console of buttons and signs where the Honored One changes the server's rules. The Book of Wishes sits on a lectern.
             */
            public final class ControlRoom implements Listener {

                public static final String WORLD = "control_room";
                private static final int CY = 100;     // surface of the lower deck
                private static final int TOP = 118;    // surface of the control deck
                private static final TextColor WHITE = TextColor.color(0xF2F2F2);

                /** One block of the console: a sign (delta 0) or a - / + button. */
                private record Panel(int x, int y, int z, String setting, int delta, String face) {}

                private static final class VoidGen extends ChunkGenerator {
                    @Override
                    public Location getFixedSpawnLocation(World w, Random r) { return new Location(w, 0.5, CY + 1, 12.5); }
                }

                private final WispsPlugin plugin;
                private final ControlStore store;
                private final ControlRules rules;
                private final HonoredOneManager honored;
                private final PrismaticEdge edge;
                private final NamespacedKey keyBook;

                private World world;
                private final Map<String, Panel> buttons = new HashMap<>();
                private final List<Panel> signs = new ArrayList<>();
                private final List<Runnable> ops = new ArrayList<>();
                private boolean building;

                public ControlRoom(WispsPlugin plugin, ControlStore store, ControlRules rules, HonoredOneManager honored, PrismaticEdge edge) {
                    this.plugin = plugin; this.store = store; this.rules = rules; this.honored = honored; this.edge = edge;
                    this.keyBook = new NamespacedKey(plugin, "book_of_wishes");
                }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    rules.addListener(s -> refreshSigns());
                    Bukkit.getScheduler().runTask(plugin, this::init);
                    // keep it night, calm and monochrome
                    Bukkit.getScheduler().runTaskTimer(plugin, () -> {
                        if (world == null) return;
                        world.setTime(18000L);
                        world.setStorm(false);
                    }, 100L, 100L);
                    Bukkit.getScheduler().runTaskTimer(plugin, this::ambient, 20L, 10L);
                }

                public World world() { return world; }

                // ================= the world =================

                private void init() {
                    World w = Bukkit.getWorld(WORLD);
                    if (w == null) {
                        WorldCreator wc = new WorldCreator(WORLD);
                        wc.environment(World.Environment.NORMAL);
                        wc.generator(new VoidGen());
                        wc.generateStructures(false);
                        w = wc.createWorld();
                    }
                    if (w == null) { plugin.getLogger().warning("Could not create the Control Room world."); return; }
                    world = w;
                    world.setDifficulty(Difficulty.PEACEFUL);
                    world.setSpawnFlags(false, false);
                    world.setSpawnLocation(0, CY + 1, 12);
                    world.setTime(18000L);
                    layout();
                    if (!store.yml().getBoolean("controlroom.built", false)) build(null);
                    else refreshSigns();
                }

                public Location spawn() { return new Location(world, 0.5, CY + 1, 12.5, 180f, 0f); }

                private void ambient() {
                    if (world == null) return;
                    ThreadLocalRandom r = ThreadLocalRandom.current();
                    for (Player p : world.getPlayers()) {
                        Location l = p.getLocation();
                        for (int i = 0; i < 6; i++) {
                            boolean white = r.nextBoolean();
                            world.spawnParticle(Particle.DUST, l.clone().add(r.nextDouble(-12, 12), r.nextDouble(-4, 10), r.nextDouble(-12, 12)),
                                    1, 0, 0, 0, 0, new Particle.DustOptions(white ? Color.WHITE : Color.fromRGB(10, 10, 10), 1.6f));
                        }
                        if (r.nextInt(4) == 0)
                            world.spawnParticle(Particle.END_ROD, l.clone().add(r.nextDouble(-10, 10), r.nextDouble(0, 8), r.nextDouble(-10, 10)), 1, 0, 0, 0, 0.01);
                    }
                }

                // ================= entering and leaving =================

                public boolean enter(Player p) {
                    if (world == null) { p.sendMessage(Component.text("The Control Room isn't ready yet.", NamedTextColor.RED)); return false; }
                    if (p.getWorld().equals(world)) return false;
                    Location back = p.getLocation();
                    store.yml().set("returns." + p.getUniqueId(), back.getWorld().getName() + ";" + back.getX() + ";" + back.getY() + ";" + back.getZ() + ";" + back.getYaw() + ";" + back.getPitch());
                    store.save();
                    p.teleport(spawn());
                    p.showTitle(Title.title(
                            Component.text("THE CONTROL ROOM", WHITE, TextDecoration.BOLD),
                            Component.text("the server is yours to shape", NamedTextColor.GRAY),
                            Title.Times.times(Duration.ofMillis(600), Duration.ofMillis(3500), Duration.ofMillis(1000))));
                    p.playSound(p.getLocation(), Sound.BLOCK_BELL_RESONATE, 1.2f, 0.5f);
                    return true;
                }

                public void leave(Player p) {
                    Location dest = null;
                    String raw = store.yml().getString("returns." + p.getUniqueId());
                    if (raw != null) {
                        String[] a = raw.split(";");
                        World w = a.length >= 6 ? Bukkit.getWorld(a[0]) : null;
                        if (w != null) {
                            try { dest = new Location(w, Double.parseDouble(a[1]), Double.parseDouble(a[2]), Double.parseDouble(a[3]), Float.parseFloat(a[4]), Float.parseFloat(a[5])); }
                            catch (NumberFormatException ignored) {}
                        }
                    }
                    if (dest == null) dest = Bukkit.getWorlds().get(0).getSpawnLocation();
                    p.teleport(dest);
                }

                @EventHandler
                public void onWorldChange(PlayerChangedWorldEvent e) {
                    Player p = e.getPlayer();
                    if (world == null || !p.getWorld().equals(world) || honored.canEnter(p)) return;
                    p.sendMessage(Component.text("You are not the Honored One.", NamedTextColor.RED));
                    p.teleport(e.getFrom().getSpawnLocation());
                }

                // ================= the console =================

                /** Works out where every sign and button goes. Same result every start, so nothing has to be stored. */
                private void layout() {
                    buttons.clear();
                    signs.clear();
                    List<ControlRules.Setting> all = rules.all();
                    int[] offs = {-8, -4, 0, 4, 8};
                    int y = TOP + 2;
                    for (int i = 0; i < all.size() && i < 20; i++) {
                        int wall = i / 5, off = offs[i % 5];
                        int sx = 0, sz = 0, mx = 0, mz = 0, px = 0, pz = 0;
                        String face = "west";
                        if (wall == 0) { sx = 11; sz = off; mx = 11; mz = off - 1; px = 11; pz = off + 1; face = "west"; }
                        else if (wall == 1) { sx = -11; sz = off; mx = -11; mz = off + 1; px = -11; pz = off - 1; face = "east"; }
                        else if (wall == 2) { sx = off; sz = 11; mx = off + 1; mz = 11; px = off - 1; pz = 11; face = "north"; }
                        else { sx = off; sz = -11; mx = off - 1; mz = -11; px = off + 1; pz = -11; face = "south"; }
                        String id = all.get(i).id;
                        signs.add(new Panel(sx, y, sz, id, 0, face));
                        buttons.put(key(mx, y, mz), new Panel(mx, y, mz, id, -1, face));
                        buttons.put(key(px, y, pz), new Panel(px, y, pz, id, +1, face));
                    }
                }

                private static String key(int x, int y, int z) { return x + "," + y + "," + z; }

                public void refreshSigns() {
                    if (world == null) return;
                    for (Panel pn : signs) {
                        ControlRules.Setting s = rules.find(pn.setting());
                        if (s == null) continue;
                        BlockState st = world.getBlockAt(pn.x(), pn.y(), pn.z()).getState();
                        if (!(st instanceof Sign sign)) continue;
                        SignSide side = sign.getSide(Side.FRONT);
                        side.line(0, Component.text(s.label, NamedTextColor.WHITE, TextDecoration.BOLD));
                        side.line(1, Component.text(rules.format(s), rules.isBanned(s) ? NamedTextColor.RED : NamedTextColor.GREEN, TextDecoration.BOLD));
                        side.line(2, Component.text("[ - ]      [ + ]", NamedTextColor.GRAY));
                        side.line(3, Component.text(s.group, NamedTextColor.DARK_GRAY));
                        side.setColor(org.bukkit.DyeColor.WHITE);
                        side.setGlowingText(true);
                        sign.setWaxed(true);
                        sign.update();
                    }
                }

                @EventHandler
                public void onClick(PlayerInteractEvent e) {
                    if (world == null || e.getClickedBlock() == null || !e.getClickedBlock().getWorld().equals(world)) return;
                    if (e.getAction() != Action.RIGHT_CLICK_BLOCK || e.getHand() != EquipmentSlot.HAND) return;
                    Player p = e.getPlayer();
                    Block b = e.getClickedBlock();

                    if (b.getType() == Material.LECTERN) {
                        e.setCancelled(true);
                        if (!honored.canEdit(p)) { p.sendActionBar(Component.text("Only the Honored One may write here.", NamedTextColor.RED)); return; }
                        giveBook(p);
                        return;
                    }
                    Panel pn = buttons.get(key(b.getX(), b.getY(), b.getZ()));
                    if (pn == null) return;
                    e.setCancelled(true);
                    if (!honored.canEdit(p)) {
                        p.sendActionBar(Component.text("Only the Honored One may alter the rules.", NamedTextColor.RED));
                        p.playSound(p.getLocation(), Sound.BLOCK_NOTE_BLOCK_BASS, 1.0f, 0.6f);
                        return;
                    }
                    ControlRules.Setting s = rules.find(pn.setting());
                    String before = rules.format(s);
                    rules.adjust(pn.setting(), pn.delta());
                    String after = rules.format(s);
                    p.playSound(p.getLocation(), Sound.BLOCK_NOTE_BLOCK_CHIME, 1.0f, pn.delta() > 0 ? 1.4f : 0.8f);
                    p.sendActionBar(Component.text(s.label + ": " + before + " \u2192 " + after, WHITE));
                    world.spawnParticle(Particle.END_ROD, b.getLocation().add(0.5, 0.5, 0.5), 8, 0.3, 0.3, 0.3, 0.02);
                    if (!before.equals(after)) {
                        Bukkit.broadcast(Component.text("[Control Room] ", NamedTextColor.DARK_GRAY)
                                .append(Component.text(p.getName() + " set ", NamedTextColor.GRAY))
                                .append(Component.text(s.label, NamedTextColor.WHITE))
                                .append(Component.text(" to ", NamedTextColor.GRAY))
                                .append(Component.text(after, rules.isBanned(s) ? NamedTextColor.RED : NamedTextColor.GREEN)));
                    }
                }

                @EventHandler(priority = EventPriority.HIGH)
                public void onBreak(BlockBreakEvent e) {
                    if (world != null && e.getBlock().getWorld().equals(world) && !(e.getPlayer().hasPermission("wisps.admin"))) e.setCancelled(true);
                }

                @EventHandler(priority = EventPriority.HIGH)
                public void onPlace(BlockPlaceEvent e) {
                    if (world != null && e.getBlock().getWorld().equals(world) && !(e.getPlayer().hasPermission("wisps.admin"))) e.setCancelled(true);
                }

                // ================= the Book of Wishes =================

                private void giveBook(Player p) {
                    for (ItemStack it : p.getInventory().getContents()) {
                        if (it != null && it.hasItemMeta() && it.getItemMeta().getPersistentDataContainer().has(keyBook, PersistentDataType.BYTE)) {
                            p.sendActionBar(Component.text("You already hold the Book of Wishes.", NamedTextColor.GRAY));
                            return;
                        }
                    }
                    ItemStack book = new ItemStack(Material.WRITABLE_BOOK);
                    BookMeta bm = (BookMeta) book.getItemMeta();
                    bm.displayName(Component.text("Book of Wishes", WHITE, TextDecoration.BOLD).decoration(TextDecoration.ITALIC, false));
                    bm.addPages(
                            Component.text("On the next page, you may request any features / rules that are not toggle-able in the Control Room."),
                            Component.text("YOUR WISHES:\n\n- "));
                    bm.getPersistentDataContainer().set(keyBook, PersistentDataType.BYTE, (byte) 1);
                    book.setItemMeta(bm);
                    Map<Integer, ItemStack> left = p.getInventory().addItem(book);
                    for (ItemStack rest : left.values()) p.getWorld().dropItemNaturally(p.getLocation(), rest);
                    p.sendMessage(Component.text("The Book of Wishes is yours. Write what you want that the console can't change.", NamedTextColor.GRAY));
                }

                @EventHandler
                public void onBook(PlayerEditBookEvent e) {
                    if (!e.getPreviousBookMeta().getPersistentDataContainer().has(keyBook, PersistentDataType.BYTE)) return;
                    List<net.kyori.adventure.text.Component> pages = e.getNewBookMeta().pages();
                    StringBuilder sb = new StringBuilder();
                    for (int i = 1; i < pages.size(); i++) { // page 1 is the instructions
                        if (sb.length() > 0) sb.append('\n');
                        sb.append(PlainTextComponentSerializer.plainText().serialize(pages.get(i)));
                    }
                    String text = sb.toString().trim();
                    store.yml().set("wishes.text", text);
                    store.yml().set("wishes.by", e.getPlayer().getName());
                    store.yml().set("wishes.at", System.currentTimeMillis());
                    store.save();
                    e.getPlayer().sendMessage(Component.text("Your wishes have been heard.", NamedTextColor.GRAY, TextDecoration.ITALIC));
                    for (Player op : Bukkit.getOnlinePlayers())
                        if (op.hasPermission("wisps.admin"))
                            op.sendMessage(Component.text("[Control Room] " + e.getPlayer().getName() + " updated the Book of Wishes. /controlroom wishes", NamedTextColor.DARK_GRAY));
                }

                public List<String> wishes() {
                    String t = store.yml().getString("wishes.text", "");
                    if (t.isBlank()) return List.of();
                    List<String> out = new ArrayList<>();
                    for (String line : t.split("\n")) if (!line.isBlank()) out.add(line.trim());
                    return out;
                }

                public String wishesBy() { return store.yml().getString("wishes.by", "unknown"); }

                // ================= building =================

                public boolean isBuilding() { return building; }

                /** Builds (or rebuilds) the whole thing a few thousand blocks per tick. */
                public void build(Player notify) {
                    if (world == null || building) return;
                    building = true;
                    ops.clear();
                    buildLowerDeck();
                    buildTower();
                    buildControlDeck();
                    buildIslands();
                    final int total = ops.size();
                    if (notify != null) notify.sendMessage(Component.text("Building the Control Room (" + total + " blocks)...", NamedTextColor.GRAY));
                    new BukkitRunnable() {
                        int idx;

                        @Override
                        public void run() {
                            for (int i = 0; i < 3500 && idx < total; i++) ops.get(idx++).run();
                            if (idx >= total) {
                                cancel();
                                ops.clear();
                                building = false;
                                store.yml().set("controlroom.built", true);
                                store.save();
                                refreshSigns();
                                if (notify != null && notify.isOnline()) notify.sendMessage(Component.text("The Control Room is built.", NamedTextColor.GREEN));
                                plugin.getLogger().info("Control Room built (" + total + " blocks).");
                            }
                        }
                    }.runTaskTimer(plugin, 1L, 1L);
                }

                private void set(int x, int y, int z, Material m) { ops.add(() -> world.getBlockAt(x, y, z).setType(m, false)); }

                private void data(int x, int y, int z, String bd) { ops.add(() -> world.getBlockAt(x, y, z).setBlockData(Bukkit.createBlockData(bd), false)); }

                private void box(int x1, int y1, int z1, int x2, int y2, int z2, Material m) {
                    for (int x = Math.min(x1, x2); x <= Math.max(x1, x2); x++)
                        for (int y = Math.min(y1, y2); y <= Math.max(y1, y2); y++)
                            for (int z = Math.min(z1, z2); z <= Math.max(z1, z2); z++) set(x, y, z, m);
                }

                private static Material checker(int x, int z) { return ((x + z) & 1) == 0 ? Material.WHITE_CONCRETE : Material.BLACK_CONCRETE; }

                private void buildLowerDeck() {
                    int r = 22, depth = 12;
                    for (int x = -r; x <= r; x++)
                        for (int z = -r; z <= r; z++)
                            if (x * x + z * z <= r * r) set(x, CY, z, checker(x, z));
                    for (int d = 1; d <= depth; d++) {
                        double rr = r * (1.0 - d / (double) (depth + 1));
                        int ri = (int) Math.ceil(rr);
                        for (int x = -ri; x <= ri; x++)
                            for (int z = -ri; z <= ri; z++)
                                if (x * x + z * z <= rr * rr) set(x, CY - d, z, d % 3 == 0 ? Material.POLISHED_BLACKSTONE : Material.BLACKSTONE);
                    }
                    for (int i = 0; i < 12; i++) { // lamps sunk into the floor
                        double a = i * Math.PI * 2 / 12;
                        set((int) Math.round(Math.cos(a) * 19), CY, (int) Math.round(Math.sin(a) * 19), Material.SEA_LANTERN);
                    }
                    for (int i = 0; i < 6; i++) {
                        double a = i * Math.PI * 2 / 6;
                        set((int) Math.round(Math.cos(a) * 10), CY, (int) Math.round(Math.sin(a) * 10), Material.SEA_LANTERN);
                    }
                }

                private void buildTower() {
                    for (int y = CY + 1; y < TOP; y++)
                        for (int x = -3; x <= 3; x++)
                            for (int z = -3; z <= 3; z++) {
                                int d2 = x * x + z * z;
                                if (d2 >= 6 && d2 <= 12) set(x, y, z, y % 4 == 0 ? Material.WHITE_CONCRETE : Material.BLACK_CONCRETE);
                            }
                    for (int y = CY + 1; y <= TOP; y++) data(4, y, 0, "minecraft:ladder[facing=east]");
                }

                private void buildControlDeck() {
                    int h = 13;
                    // floor, with a hole where the ladder comes up
                    for (int x = -h; x <= h; x++)
                        for (int z = -h; z <= h; z++) {
                            if (x == 4 && z == 0) continue;
                            set(x, TOP, z, checker(x, z));
                        }
                    // an inverted pyramid underneath
                    for (int d = 1; d <= 9; d++) {
                        int half = (int) Math.floor(h - d * 1.4);
                        for (int x = -half; x <= half; x++)
                            for (int z = -half; z <= half; z++) {
                                if (x == 4 && z == 0) continue;
                                set(x, TOP - d, z, d % 3 == 0 ? Material.POLISHED_BLACKSTONE : Material.BLACKSTONE);
                            }
                    }
                    for (int s : new int[]{-6, 6}) for (int t : new int[]{-6, 6}) set(s, TOP, t, Material.SEA_LANTERN);

                    // backing walls
                    for (int side = 0; side < 4; side++) {
                        for (int a = -11; a <= 11; a++) {
                            for (int y = TOP + 1; y <= TOP + 4; y++) {
                                int wx, wz;
                                if (side == 0) { wx = 12; wz = a; }
                                else if (side == 1) { wx = -12; wz = a; }
                                else if (side == 2) { wx = a; wz = 12; }
                                else { wx = a; wz = -12; }
                                set(wx, y, wz, y == TOP + 4 ? Material.WHITE_CONCRETE : Material.BLACK_CONCRETE);
                            }
                        }
                    }
                    for (int s : new int[]{-12, 12}) for (int t : new int[]{-12, 12}) {
                        box(s, TOP + 1, t, s, TOP + 5, t, Material.QUARTZ_PILLAR);
                        set(s, TOP + 6, t, Material.SEA_LANTERN);
                    }
                    // the console itself
                    for (Panel pn : signs) data(pn.x(), pn.y(), pn.z(), "minecraft:dark_oak_wall_sign[facing=" + pn.face() + "]");
                    for (Panel pn : buttons.values())
                        data(pn.x(), pn.y(), pn.z(), (pn.delta() > 0 ? "minecraft:stone_button" : "minecraft:polished_blackstone_button")
                                + "[face=wall,facing=" + pn.face() + "]");
                    // lectern and its sign
                    set(0, TOP + 1, 0, Material.OBSIDIAN);
                    data(0, TOP + 2, 0, "minecraft:lectern[facing=south]");
                    data(0, TOP + 1, 3, "minecraft:dark_oak_sign[rotation=8]");
                    ops.add(() -> {
                        BlockState st = world.getBlockAt(0, TOP + 1, 3).getState();
                        if (st instanceof Sign sign) {
                            SignSide f = sign.getSide(Side.FRONT);
                            f.line(0, Component.text("BOOK OF WISHES", NamedTextColor.WHITE, TextDecoration.BOLD));
                            f.line(1, Component.text("right-click the", NamedTextColor.GRAY));
                            f.line(2, Component.text("lectern", NamedTextColor.GRAY));
                            f.setColor(org.bukkit.DyeColor.WHITE);
                            f.setGlowingText(true);
                            sign.setWaxed(true);
                            sign.update();
                        }
                    });
                }

                // ---- floating islands ----

                private void buildIslands() {
                    for (int k = 0; k < 8; k++) {
                        double ang = k * Math.PI / 4 + 0.3;
                        double rad = 46 + (k % 2) * 10;
                        int cx = (int) Math.round(Math.cos(ang) * rad), cz = (int) Math.round(Math.sin(ang) * rad);
                        int cy = 96 + ((k * 7) % 5) * 6;
                        int r = 7 + (k % 3);
                        islandBase(cx, cy, cz, r);
                        switch (k) {
                            case 0 -> pavilion(cx, cy, cz);
                            case 1 -> tower(cx, cy, cz);
                            case 2 -> hourglass(cx, cy, cz);
                            case 3 -> altar(cx, cy, cz);
                            case 4 -> arena(cx, cy, cz, r - 1);
                            case 5 -> arch(cx, cy, cz);
                            case 6 -> ruins(cx, cy, cz, r - 2);
                            default -> obelisk(cx, cy, cz);
                        }
                    }
                }

                private void islandBase(int cx, int cy, int cz, int r) {
                    int depth = r + 3;
                    for (int x = -r; x <= r; x++)
                        for (int z = -r; z <= r; z++)
                            if (x * x + z * z <= r * r) set(cx + x, cy, cz + z, checker(cx + x, cz + z));
                    for (int d = 1; d <= depth; d++) {
                        double rr = r * (1.0 - d / (double) (depth + 1));
                        int ri = (int) Math.ceil(rr);
                        for (int x = -ri; x <= ri; x++)
                            for (int z = -ri; z <= ri; z++)
                                if (x * x + z * z <= rr * rr) set(cx + x, cy - d, cz + z, d % 2 == 0 ? Material.BLACKSTONE : Material.POLISHED_BLACKSTONE);
                    }
                }

                private void pavilion(int cx, int cy, int cz) {
                    for (int sx : new int[]{-3, 3}) for (int sz : new int[]{-3, 3}) box(cx + sx, cy + 1, cz + sz, cx + sx, cy + 5, cz + sz, Material.QUARTZ_PILLAR);
                    box(cx - 4, cy + 6, cz - 4, cx + 4, cy + 6, cz + 4, Material.WHITE_CONCRETE);
                    box(cx - 2, cy + 7, cz - 2, cx + 2, cy + 7, cz + 2, Material.BLACK_CONCRETE);
                    set(cx, cy + 5, cz, Material.SEA_LANTERN);
                }

                private void tower(int cx, int cy, int cz) {
                    for (int y = cy + 1; y <= cy + 11; y++)
                        for (int x = -2; x <= 2; x++)
                            for (int z = -2; z <= 2; z++)
                                if (Math.abs(x) == 2 || Math.abs(z) == 2) set(cx + x, y, cz + z, y % 3 == 0 ? Material.WHITE_CONCRETE : Material.BLACK_CONCRETE);
                    box(cx - 2, cy + 12, cz - 2, cx + 2, cy + 12, cz + 2, Material.BLACK_CONCRETE);
                    set(cx, cy + 13, cz, Material.SEA_LANTERN);
                }

                /** The Prophet's hourglass. */
                private void hourglass(int cx, int cy, int cz) {
                    int h = 16;
                    box(cx - 4, cy + 1, cz, cx + 4, cy + 1, cz, Material.BLACK_CONCRETE);
                    box(cx - 4, cy + h, cz, cx + 4, cy + h, cz, Material.BLACK_CONCRETE);
                    double mid = (h + 1) / 2.0;
                    for (int y = cy + 2; y < cy + h; y++) {
                        int w = (int) Math.round(4.0 * Math.abs(y - cy - mid) / (mid - 1));
                        set(cx + w, y, cz, Material.BLACK_CONCRETE);
                        set(cx - w, y, cz, Material.BLACK_CONCRETE);
                    }
                    for (int y = cy + 2; y <= cy + 5; y++) {
                        int w = 5 - (y - cy - 1);
                        box(cx - w + 1, y, cz, cx + w - 1, y, cz, Material.WHITE_CONCRETE);
                    }
                    set(cx, cy + 8, cz, Material.SEA_LANTERN);
                }

                private void altar(int cx, int cy, int cz) {
                    for (int i = 0; i < 6; i++) {
                        double a = i * Math.PI / 3;
                        int px = cx + (int) Math.round(Math.cos(a) * 4), pz = cz + (int) Math.round(Math.sin(a) * 4);
                        box(px, cy + 1, pz, px, cy + 6, pz, Material.QUARTZ_PILLAR);
                        set(px, cy + 7, pz, Material.BLACK_CONCRETE);
                    }
                    box(cx - 1, cy + 1, cz - 1, cx + 1, cy + 1, cz + 1, Material.OBSIDIAN);
                    set(cx, cy + 2, cz, Material.SEA_LANTERN);
                }

                private void arena(int cx, int cy, int cz, int r) {
                    for (int x = -r; x <= r; x++)
                        for (int z = -r; z <= r; z++) {
                            int d2 = x * x + z * z;
                            if (d2 <= r * r && d2 >= (r - 1) * (r - 1) && ((x + z) & 3) != 0)
                                for (int y = 1; y <= 3; y++) set(cx + x, cy + y, cz + z, y == 3 ? Material.WHITE_CONCRETE : Material.BLACK_CONCRETE);
                        }
                    set(cx, cy + 1, cz, Material.SEA_LANTERN);
                }

                private void arch(int cx, int cy, int cz) {
                    box(cx - 4, cy + 1, cz, cx - 4, cy + 8, cz, Material.BLACK_CONCRETE);
                    box(cx + 4, cy + 1, cz, cx + 4, cy + 8, cz, Material.BLACK_CONCRETE);
                    for (int deg = 0; deg <= 180; deg += 6) {
                        double a = Math.toRadians(deg);
                        set(cx + (int) Math.round(Math.cos(a) * 4), cy + 8 + (int) Math.round(Math.sin(a) * 4), cz, Material.WHITE_CONCRETE);
                    }
                }

                private void ruins(int cx, int cy, int cz, int r) {
                    Random rnd = new Random(77);
                    for (int i = 0; i < 14; i++) {
                        int x = cx + rnd.nextInt(2 * r + 1) - r, z = cz + rnd.nextInt(2 * r + 1) - r;
                        int len = 2 + rnd.nextInt(4), hh = 1 + rnd.nextInt(4);
                        boolean alongX = rnd.nextBoolean();
                        Material m = rnd.nextBoolean() ? Material.BLACK_CONCRETE : Material.WHITE_CONCRETE;
                        if (alongX) box(x, cy + 1, z, x + len, cy + hh, z, m); else box(x, cy + 1, z, x, cy + hh, z + len, m);
                    }
                }

                private void obelisk(int cx, int cy, int cz) {
                    for (int y = 1; y <= 22; y++) {
                        int half = y < 14 ? 1 : 0;
                        box(cx - half, cy + y, cz - half, cx + half, cy + y, cz + half, y % 5 == 0 ? Material.WHITE_CONCRETE : Material.BLACK_CONCRETE);
                    }
                    set(cx, cy + 23, cz, Material.SEA_LANTERN);
                }
            }
            EOF_JAVA

      - name: Create ControlRules.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/ControlRules.java)
            cat > src/main/java/me/lofi/wisps/ControlRules.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import org.bukkit.Bukkit;
            import org.bukkit.World;

            import java.util.*;
            import java.util.function.Consumer;

            /** Every server rule the Control Room can change, and its current value. */
            public final class ControlRules {

                public enum Kind { INT, BOOL, MULT, TIER }

                public static final String[] TIERS = {"Leather/Gold", "Chainmail", "Iron/Turtle", "Diamond", "Netherite"};

                public static final class Setting {
                    public final String id, label, group, onLabel, offLabel;
                    public final Kind kind;
                    public final double min, max, step, def;
                    public final boolean unlimitedAtMax;

                    Setting(String id, String label, String group, Kind kind, double min, double max, double step, double def,
                            boolean unlimitedAtMax, String onLabel, String offLabel) {
                        this.id = id; this.label = label; this.group = group; this.kind = kind;
                        this.min = min; this.max = max; this.step = step; this.def = def;
                        this.unlimitedAtMax = unlimitedAtMax; this.onLabel = onLabel; this.offLabel = offLabel;
                    }
                }

                private static final List<Setting> ALL = new ArrayList<>();

                private static void add(String id, String label, String group, Kind kind, double min, double max, double step, double def,
                                        boolean unl, String on, String off) {
                    ALL.add(new Setting(id, label, group, kind, min, max, step, def, unl, on, off));
                }

                static {
                    // enchantment limits (0 = the enchant is banned)
                    add("ench.sharpness", "Sharpness", "Enchant limit", Kind.INT, 0, 5, 1, 5, false, "", "");
                    add("ench.protection", "Protection", "Enchant limit", Kind.INT, 0, 4, 1, 4, false, "", "");
                    add("ench.knockback", "Knockback", "Enchant limit", Kind.INT, 0, 2, 1, 2, false, "", "");
                    add("ench.thorns", "Thorns", "Enchant limit", Kind.INT, 0, 3, 1, 3, false, "", "");
                    add("ench.infinity", "Infinity", "Enchant limit", Kind.INT, 0, 1, 1, 1, false, "", "");
                    add("ench.wind_burst", "Wind Burst", "Enchant limit", Kind.INT, 0, 3, 1, 3, false, "", "");
                    // item limits
                    add("item.cobweb", "Cobwebs", "Item limit", Kind.INT, 0, 64, 4, 64, true, "", "");
                    add("item.pearls", "Ender pearls", "Item limit", Kind.INT, 0, 64, 4, 64, true, "", "");
                    add("item.pearl_cd", "Pearl cooldown", "Item limit", Kind.MULT, 1, 8, 0.5, 1, false, "", "");
                    add("item.totems", "Totems per fight", "Item limit", Kind.INT, 0, 6, 1, 6, true, "", "");
                    add("item.turtle_master", "Turtle Master", "Item limit", Kind.BOOL, 0, 1, 1, 1, false, "allowed", "BANNED");
                    add("item.slow_falling", "Slow Falling", "Item limit", Kind.BOOL, 0, 1, 1, 1, false, "allowed", "BANNED");
                    add("item.egapple", "Ench. golden apple", "Item limit", Kind.BOOL, 0, 1, 1, 1, false, "allowed", "BANNED");
                    // border
                    add("border.radius", "Border radius", "World border", Kind.INT, 500, 30000, 500, 10000, false, "", "");
                    // armor
                    add("armor.tier", "Max armor tier", "Armor limit", Kind.TIER, 0, 4, 1, 4, false, "", "");
                    add("armor.netherite", "Netherite pieces", "Armor limit", Kind.INT, 0, 4, 1, 4, false, "", "");
                    // mythic
                    add("mythic.prismatic", "Prismatic Edge", "Mythic item", Kind.BOOL, 0, 1, 1, 0, false, "INTRODUCED", "dormant");
                }

                private final WispsPlugin plugin;
                private final ControlStore store;
                private final List<Consumer<Setting>> listeners = new ArrayList<>();

                public ControlRules(WispsPlugin plugin, ControlStore store) { this.plugin = plugin; this.store = store; }

                public List<Setting> all() { return Collections.unmodifiableList(ALL); }

                public Setting find(String id) {
                    for (Setting s : ALL) if (s.id.equalsIgnoreCase(id)) return s;
                    return null;
                }

                public void addListener(Consumer<Setting> l) { listeners.add(l); }

                /** True when somebody has explicitly set this rule (so we should enforce it). */
                public boolean isSet(String id) { return store.yml().contains("rules." + id); }

                public double get(String id) {
                    Setting s = find(id);
                    if (s == null) return 0;
                    if (store.yml().contains("rules." + id)) return store.yml().getDouble("rules." + id);
                    if (id.equals("border.radius")) {
                        List<World> ws = Bukkit.getWorlds();
                        if (!ws.isEmpty()) {
                            double r = ws.get(0).getWorldBorder().getSize() / 2.0;
                            if (r >= s.min && r <= s.max) return Math.round(r / s.step) * s.step;
                        }
                    }
                    return s.def;
                }

                public int intv(String id) { return (int) Math.round(get(id)); }

                public boolean bool(String id) { return get(id) >= 0.5; }

                /** The cap for a "limit" rule, or -1 when it is at its maximum (= no limit). */
                public int limit(String id) {
                    Setting s = find(id);
                    if (s == null) return -1;
                    double v = get(id);
                    return (s.unlimitedAtMax && v >= s.max) ? -1 : (int) Math.round(v);
                }

                public double adjust(String id, int direction) {
                    Setting s = find(id);
                    if (s == null) return 0;
                    double v = get(id);
                    if (s.kind == Kind.BOOL) v = v >= 0.5 ? 0 : 1;
                    else v = Math.round((v + direction * s.step) / s.step) * s.step;
                    set(id, v);
                    return get(id);
                }

                public void set(String id, double value) {
                    Setting s = find(id);
                    if (s == null) return;
                    double v = Math.max(s.min, Math.min(s.max, value));
                    store.yml().set("rules." + id, v);
                    store.save();
                    for (Consumer<Setting> l : listeners) l.accept(s);
                }

                public void reset() {
                    store.yml().set("rules", null);
                    store.save();
                    for (Setting s : ALL) for (Consumer<Setting> l : listeners) l.accept(s);
                }

                public String format(Setting s, double v) {
                    if (s.kind == Kind.BOOL) return v >= 0.5 ? s.onLabel : s.offLabel;
                    if (s.kind == Kind.MULT) return "x" + String.format(Locale.ROOT, "%.1f", v);
                    if (s.kind == Kind.TIER) return TIERS[(int) Math.max(0, Math.min(TIERS.length - 1, Math.round(v)))];
                    if (s.id.equals("border.radius")) return (long) v + " blocks";
                    if (s.unlimitedAtMax && v >= s.max) return "unlimited";
                    if (v <= 0) return s.id.startsWith("armor") ? "none" : "BANNED";
                    return String.valueOf((int) Math.round(v));
                }

                public String format(Setting s) { return format(s, get(s.id)); }

                /** Red-worthy values: bans and zeroes. */
                public boolean isBanned(Setting s) {
                    double v = get(s.id);
                    if (s.kind == Kind.BOOL) return s.offLabel.equals("BANNED") && v < 0.5;
                    return s.kind == Kind.INT && v <= 0 && s.min <= 0 && !s.id.startsWith("armor");
                }
            }
            EOF_JAVA

