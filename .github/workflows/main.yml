      - name: Create CooldownScaler.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/CooldownScaler.java)
            cat > src/main/java/me/lofi/wisps/CooldownScaler.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import org.bukkit.Bukkit;
            import org.bukkit.entity.Player;

            import java.util.*;

            /**
             * Applies the "gem cooldowns xN" vows. BlissGems sets a cooldown when an ability fires;
             * when we see a brand-new one for a player with a vow multiplier, we shorten it.
             */
            public final class CooldownScaler {

                private final VowManager vows;
                private final GemBridge bridge;
                private final Map<UUID, Map<String, Integer>> last = new HashMap<>();

                public CooldownScaler(VowManager vows, GemBridge bridge) { this.vows = vows; this.bridge = bridge; }

                public void tick() {
                    if (!bridge.cooldownsAvailable()) return;
                    for (Player p : Bukkit.getOnlinePlayers()) {
                        UUID id = p.getUniqueId();
                        double mult = vows.cooldownMultiplier(p);
                        if (Math.abs(mult - 1.0) < 1e-6 || bridge.noCooldown(p)) { last.remove(id); continue; }
                        Map<String, Integer> prev = last.get(id);
                        boolean primed = prev != null; // first sighting only records, never rescales old cooldowns
                        Map<String, Integer> cur = new HashMap<>();
                        for (String key : bridge.cooldownKeys(id)) {
                            int rem = bridge.remaining(p, key);
                            if (rem <= 0) continue;
                            Integer before = prev == null ? null : prev.get(key);
                            if (primed && (before == null || rem > before + 1)) {
                                int scaled = Math.max(1, (int) Math.ceil(rem * mult));
                                if (scaled < rem) { bridge.setCooldown(p, key, scaled); rem = scaled; }
                            }
                            cur.put(key, rem);
                        }
                        last.put(id, cur);
                    }
                }
            }
            EOF_JAVA

      - name: Create EchoAbilities.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/EchoAbilities.java)
            cat > src/main/java/me/lofi/wisps/EchoAbilities.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import org.bukkit.Color;
            import org.bukkit.FluidCollisionMode;
            import org.bukkit.GameMode;
            import org.bukkit.Location;
            import org.bukkit.Particle;
            import org.bukkit.Sound;
            import org.bukkit.World;
            import org.bukkit.entity.ArmorStand;
            import org.bukkit.entity.Entity;
            import org.bukkit.entity.LivingEntity;
            import org.bukkit.entity.Player;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.Listener;
            import org.bukkit.event.block.Action;
            import org.bukkit.event.entity.EntityDamageEvent;
            import org.bukkit.event.player.PlayerInteractEvent;
            import org.bukkit.event.player.PlayerItemHeldEvent;
            import org.bukkit.event.player.PlayerQuitEvent;
            import org.bukkit.inventory.EquipmentSlot;
            import org.bukkit.potion.PotionEffect;
            import org.bukkit.potion.PotionEffectType;
            import org.bukkit.scheduler.BukkitRunnable;
            import org.bukkit.util.RayTraceResult;
            import org.bukkit.util.Vector;

            import java.util.*;
            import java.util.concurrent.ThreadLocalRandom;

            /**
             * Echoes: while Adrenaline is awakened, weaker copies of its own abilities (Rush, Chains, Heartbind Curse,
             * Abyss Slam, Surge). Sneak + scroll picks one, sneak + left-click casts it.
             * Every echo is painted mostly blue, with black and a little red.
             */
            public final class EchoAbilities implements Listener {

                private enum Echo {
                    ECHO_RUSH("Echo Rush", 12),
                    ECHO_CHAINS("Echo Chains", 9),
                    ECHO_CURSE("Echo Curse", 45),
                    ECHO_SLAM("Echo Slam", 15),
                    ECHO_SURGE("Echo Surge", 25);
                    final String label;
                    final int cooldown;
                    Echo(String label, int cooldown) { this.label = label; this.cooldown = cooldown; }
                }

                private static final String VOW_ID = "awaken_adrenaline";

                // Echo numbers, each noticeably below the real ability (real value in the comment)
                private static final double RUSH_SPEED = 1.0, RUSH_DAMAGE = 2.0;       // real Rush: power 3.6, damage 4
                private static final int RUSH_TICKS = 7;
                private static final double CHAINS_RANGE = 20.0, CHAINS_DAMAGE = 3.0;  // real Chains: range 45, damage 8, 4 charges
                private static final double CURSE_RANGE = 18.0, CURSE_DAMAGE = 2.0;    // real Curse: range 40, damage 4, Slowness IV 20s
                private static final double SLAM_RADIUS = 4.0, SLAM_DAMAGE = 4.0;      // real Slam: radius 8, damage 10
                private static final double SURGE_RADIUS = 4.0, SURGE_PUSH = 0.9;      // real Surge: radius 6, push 1.4

                // blue is the main colour (~60%), then black (~25%), then red (~15%)
                private static final Color BLUE_A = Color.fromRGB(60, 140, 255), BLUE_B = Color.fromRGB(120, 200, 255),
                        DARK = Color.fromRGB(8, 8, 24), RED = Color.fromRGB(255, 40, 60);

                private final WispsPlugin plugin;
                private final VowManager vows;
                private final Map<UUID, Integer> selected = new HashMap<>();
                private final Map<UUID, Map<Echo, Long>> readyAt = new HashMap<>();
                private final Map<UUID, Long> noFallUntil = new HashMap<>();

                public EchoAbilities(WispsPlugin plugin, VowManager vows) { this.plugin = plugin; this.vows = vows; }

                public void start() { plugin.getServer().getPluginManager().registerEvents(this, plugin); }

                private boolean active(Player p) { return vows.has(p, VOW_ID); }

                // ================= input =================

                @EventHandler
                public void onScroll(PlayerItemHeldEvent e) {
                    Player p = e.getPlayer();
                    if (!p.isSneaking() || !active(p)) return;
                    int diff = e.getNewSlot() - e.getPreviousSlot();
                    if (diff > 4) diff -= 9; else if (diff < -4) diff += 9;
                    if (diff == 0) return;
                    e.setCancelled(true);
                    int n = Echo.values().length;
                    int sel = selected.getOrDefault(p.getUniqueId(), 0);
                    selected.put(p.getUniqueId(), ((sel + (diff > 0 ? 1 : -1)) % n + n) % n);
                    show(p);
                }

                @EventHandler
                public void onClick(PlayerInteractEvent e) {
                    Action a = e.getAction();
                    if (a != Action.LEFT_CLICK_AIR && a != Action.LEFT_CLICK_BLOCK) return;
                    if (e.getHand() != EquipmentSlot.HAND) return;
                    Player p = e.getPlayer();
                    if (!p.isSneaking() || !active(p)) return;
                    if (a == Action.LEFT_CLICK_BLOCK) {
                        // leave Adrenal Vein (sneak-mining ores with a pickaxe) alone
                        if (p.getInventory().getItemInMainHand().getType().name().endsWith("_PICKAXE")) return;
                        e.setCancelled(true);
                    }
                    cast(p);
                }

                @EventHandler
                public void onFall(EntityDamageEvent e) {
                    if (e.getEntity() instanceof Player p && e.getCause() == EntityDamageEvent.DamageCause.FALL) {
                        Long until = noFallUntil.get(p.getUniqueId());
                        if (until != null && System.currentTimeMillis() < until) e.setCancelled(true);
                    }
                }

                @EventHandler
                public void onQuit(PlayerQuitEvent e) {
                    UUID id = e.getPlayer().getUniqueId();
                    selected.remove(id); readyAt.remove(id); noFallUntil.remove(id);
                }

                private void show(Player p) {
                    Echo[] all = Echo.values();
                    int sel = selected.getOrDefault(p.getUniqueId(), 0);
                    long now = System.currentTimeMillis();
                    Map<Echo, Long> m = readyAt.getOrDefault(p.getUniqueId(), Map.of());
                    Component c = Component.text("ECHOES  ", NamedTextColor.BLUE, TextDecoration.BOLD);
                    for (int i = 0; i < all.length; i++) {
                        long left = (m.getOrDefault(all[i], 0L) - now + 999) / 1000;
                        String label = all[i].label + (left > 0 ? " " + left + "s" : "");
                        c = c.append(i == sel ? Component.text("[" + label + "]", NamedTextColor.AQUA, TextDecoration.BOLD)
                                              : Component.text(label, NamedTextColor.DARK_GRAY));
                        if (i < all.length - 1) c = c.append(Component.text("  ", NamedTextColor.GRAY));
                    }
                    p.sendActionBar(c);
                }

                private void cast(Player p) {
                    UUID id = p.getUniqueId();
                    Echo ech = Echo.values()[selected.getOrDefault(id, 0)];
                    long now = System.currentTimeMillis();
                    Map<Echo, Long> m = readyAt.computeIfAbsent(id, k -> new EnumMap<>(Echo.class));
                    long ready = m.getOrDefault(ech, 0L);
                    if (now < ready) {
                        p.sendActionBar(Component.text(ech.label + " \u00B7 " + ((ready - now + 999) / 1000) + "s", NamedTextColor.GRAY));
                        return;
                    }
                    boolean ok = switch (ech) {
                        case ECHO_RUSH -> rush(p);
                        case ECHO_CHAINS -> chains(p);
                        case ECHO_CURSE -> curse(p);
                        case ECHO_SLAM -> slam(p);
                        case ECHO_SURGE -> surge(p);
                    };
                    if (ok) m.put(ech, now + ech.cooldown * 1000L);
                }

                // ================= the echoes =================

                /** Adrenal Rush, shorter and softer: a quick dash that clips whoever you pass through. */
                private boolean rush(Player p) {
                    World w = p.getWorld();
                    Vector dir = p.getEyeLocation().getDirection();
                    dir.setY(Math.max(-0.2, Math.min(0.3, dir.getY())));
                    dir.normalize();
                    noFallUntil.put(p.getUniqueId(), System.currentTimeMillis() + 4000L);
                    w.playSound(p.getLocation(), Sound.ENTITY_PLAYER_ATTACK_SWEEP, 1.2f, 0.6f);
                    w.playSound(p.getLocation(), Sound.ENTITY_WARDEN_HEARTBEAT, 1.0f, 1.6f);
                    new BukkitRunnable() {
                        final Set<UUID> hit = new HashSet<>();
                        int age;

                        @Override
                        public void run() {
                            if (!p.isOnline() || p.isDead() || ++age > RUSH_TICKS) { cancel(); return; }
                            p.setVelocity(dir.clone().multiply(RUSH_SPEED));
                            Location c = p.getLocation().add(0, 1.0, 0);
                            for (Entity x : w.getNearbyEntities(c, 1.4, 1.2, 1.4)) {
                                if (!hittable(x, p) || !hit.add(x.getUniqueId())) continue;
                                ((LivingEntity) x).damage(RUSH_DAMAGE, p);
                            }
                            afterimage(w, p.getLocation());
                        }
                    }.runTaskTimer(plugin, 0L, 1L);
                    return true;
                }

                /** Bound Chains, one charge and a short reach: grapples you to a block, or yanks an enemy to you. */
                private boolean chains(Player p) {
                    World w = p.getWorld();
                    Location eye = p.getEyeLocation();
                    RayTraceResult r = w.rayTrace(eye, eye.getDirection(), CHAINS_RANGE, FluidCollisionMode.NEVER, true, 0.5, x -> hittable(x, p));
                    if (r == null || r.getHitPosition() == null) { p.sendActionBar(Component.text("nothing to grab.", NamedTextColor.GRAY)); return false; }
                    Vector hitPos = r.getHitPosition();
                    w.playSound(eye, Sound.BLOCK_ANVIL_LAND, 1.0f, 1.6f);
                    if (r.getHitEntity() instanceof LivingEntity victim) {
                        Vector pull = p.getLocation().toVector().subtract(victim.getLocation().toVector());
                        pull.setY(0);
                        if (pull.lengthSquared() > 1e-4) pull.normalize();
                        victim.setVelocity(pull.multiply(1.3).setY(0.35));
                        victim.damage(CHAINS_DAMAGE, p);
                        echoLine(w, eye, hitPos);
                    } else {
                        noFallUntil.put(p.getUniqueId(), System.currentTimeMillis() + 6000L);
                        new BukkitRunnable() {
                            int age;

                            @Override
                            public void run() {
                                if (!p.isOnline() || ++age > 14) { cancel(); return; }
                                Vector to = hitPos.clone().subtract(p.getLocation().toVector().add(new Vector(0, 1, 0)));
                                if (to.length() < 2.0) { cancel(); return; }
                                p.setVelocity(to.normalize().multiply(1.1));
                                echoLine(w, p.getLocation().add(0, 1.0, 0), hitPos);
                            }
                        }.runTaskTimer(plugin, 0L, 1L);
                    }
                    return true;
                }

                /** Heartbind Curse, a faint one: a small hit, Slowness II for 6s and Darkness for 4s. */
                private boolean curse(Player p) {
                    LivingEntity t = target(p, CURSE_RANGE, 1.5);
                    if (t == null) { p.sendActionBar(Component.text("no target in sight.", NamedTextColor.GRAY)); return false; }
                    World w = p.getWorld();
                    t.damage(CURSE_DAMAGE, p);
                    t.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 20 * 6, 1, false, true, true));
                    t.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 20 * 4, 0, false, true, true));
                    w.playSound(t.getLocation(), Sound.ENTITY_WARDEN_HEARTBEAT, 1.6f, 0.7f);
                    new BukkitRunnable() {
                        int age;

                        @Override
                        public void run() {
                            if (!p.isOnline() || !t.isValid() || t.isDead() || ++age > 40) { cancel(); return; }
                            Location heart = t.getLocation().add(0, 1.0, 0);
                            echoLine(w, p.getLocation().add(0, 1.0, 0), heart.toVector());
                            if (age % 10 == 0) {
                                double r = age % 20 == 0 ? 1.1 : 0.8;
                                for (int i = 0; i < 20; i++) {
                                    double a = i * Math.PI * 2 / 20;
                                    edust(w, heart.getX() + Math.cos(a) * r, heart.getY(), heart.getZ() + Math.sin(a) * r, 1.2f);
                                }
                            }
                        }
                    }.runTaskTimer(plugin, 1L, 1L);
                    return true;
                }

                /** Abyss Slam, a small one: half the radius, under half the damage, three seconds of Darkness. */
                private boolean slam(Player p) {
                    World w = p.getWorld();
                    Location l = p.getLocation();
                    if (l.clone().subtract(0, 0.5, 0).getBlock().getType().isAir()) {
                        noFallUntil.put(p.getUniqueId(), System.currentTimeMillis() + 4000L);
                        p.setVelocity(new Vector(0, -1.6, 0));
                    }
                    for (Entity x : w.getNearbyEntities(l, SLAM_RADIUS, 3, SLAM_RADIUS)) {
                        if (!hittable(x, p)) continue;
                        LivingEntity le = (LivingEntity) x;
                        le.damage(SLAM_DAMAGE, p);
                        le.addPotionEffect(new PotionEffect(PotionEffectType.DARKNESS, 60, 0, false, true, true));
                        shove(le, l, 0.6, 0.45);
                    }
                    w.playSound(l, Sound.ENTITY_LIGHTNING_BOLT_IMPACT, 1.2f, 1.5f);
                    w.playSound(l, Sound.BLOCK_ANVIL_LAND, 1.0f, 0.7f);
                    shockwave(w, l, SLAM_RADIUS + 1, 10);
                    return true;
                }

                /** Adrenaline Surge, a short one: a smaller pulse and a short Haste II / Speed I burst. */
                private boolean surge(Player p) {
                    World w = p.getWorld();
                    Location l = p.getLocation();
                    p.addPotionEffect(new PotionEffect(PotionEffectType.HASTE, 120, 1, false, true, true));
                    p.addPotionEffect(new PotionEffect(PotionEffectType.SPEED, 120, 0, false, true, true));
                    for (Entity x : w.getNearbyEntities(l, SURGE_RADIUS, 2.5, SURGE_RADIUS)) {
                        if (!hittable(x, p)) continue;
                        LivingEntity le = (LivingEntity) x;
                        shove(le, l, SURGE_PUSH, 0.3);
                        le.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 40, 0, false, true, true));
                    }
                    w.playSound(l, Sound.ENTITY_WARDEN_HEARTBEAT, 2.0f, 0.8f);
                    shockwave(w, l, SURGE_RADIUS + 0.5, 8);
                    return true;
                }

                // ================= helpers =================

                private static boolean hittable(Entity x, Player p) {
                    if (x == p || !(x instanceof LivingEntity le) || le.isDead() || x instanceof ArmorStand) return false;
                    if (x instanceof Player o && (o.getGameMode() == GameMode.SPECTATOR || o.getGameMode() == GameMode.CREATIVE)) return false;
                    return true;
                }

                private static LivingEntity target(Player p, double range, double size) {
                    Location eye = p.getEyeLocation();
                    RayTraceResult r = p.getWorld().rayTrace(eye, eye.getDirection(), range, FluidCollisionMode.NEVER, true, size, x -> hittable(x, p));
                    return r != null && r.getHitEntity() instanceof LivingEntity le ? le : null;
                }

                private static void shove(Entity e, Location from, double force, double up) {
                    Vector away = e.getLocation().toVector().subtract(from.toVector());
                    away.setY(0);
                    if (away.lengthSquared() < 1e-4) away = new Vector(0, 0, 0); else away.normalize();
                    e.setVelocity(away.multiply(force).setY(up));
                }

                /** One echo-coloured speck: mostly blue, some black, a little red. */
                private static void edust(World w, double x, double y, double z, float size) {
                    double r = ThreadLocalRandom.current().nextDouble();
                    Color c = r < 0.34 ? BLUE_A : r < 0.60 ? BLUE_B : r < 0.85 ? DARK : RED;
                    w.spawnParticle(Particle.DUST, new Location(w, x, y, z), 1, 0, 0, 0, 0, new Particle.DustOptions(c, size));
                }

                private static void afterimage(World w, Location l) {
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();
                    for (int i = 0; i < 12; i++)
                        edust(w, l.getX() + rnd.nextDouble(-0.35, 0.35), l.getY() + rnd.nextDouble(0, 1.9), l.getZ() + rnd.nextDouble(-0.35, 0.35), 1.2f);
                    w.spawnParticle(Particle.SOUL_FIRE_FLAME, l.clone().add(0, 1.0, 0), 3, 0.25, 0.5, 0.25, 0.01);
                }

                private static void echoLine(World w, Location from, Vector to) {
                    Vector a = from.toVector();
                    Vector d = to.clone().subtract(a);
                    double len = d.length();
                    if (len < 0.1) return;
                    d.normalize();
                    for (double s = 0; s < len; s += 0.4)
                        edust(w, a.getX() + d.getX() * s, a.getY() + d.getY() * s, a.getZ() + d.getZ() * s, 1.0f);
                }

                private void shockwave(World w, Location c, double maxR, int ticks) {
                    new BukkitRunnable() {
                        int age;

                        @Override
                        public void run() {
                            age++;
                            double r = Math.max(0.5, maxR * age / ticks);
                            int pts = Math.max(16, (int) (r * 10));
                            for (int i = 0; i < pts; i++) {
                                double a = i * Math.PI * 2 / pts;
                                edust(w, c.getX() + Math.cos(a) * r, c.getY() + 0.2, c.getZ() + Math.sin(a) * r, 1.4f);
                            }
                            w.spawnParticle(Particle.SOUL_FIRE_FLAME, c.clone().add(0, 0.3, 0), 6, r * 0.5, 0.1, r * 0.5, 0.01);
                            if (age >= ticks) cancel();
                        }
                    }.runTaskTimer(plugin, 0L, 1L);
                }
            }
            EOF_JAVA

      - name: Create GemBridge.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/GemBridge.java)
            cat > src/main/java/me/lofi/wisps/GemBridge.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import org.bukkit.Bukkit;
            import org.bukkit.entity.Player;
            import org.bukkit.plugin.Plugin;
            import org.bukkit.plugin.java.JavaPlugin;

            import java.lang.reflect.Method;
            import java.util.*;

            /** Talks to BlissGems through reflection, so Wisps compiles and runs even without it. */
            public final class GemBridge {

                private final JavaPlugin plugin;
                private boolean ready, warned;
                private long nextTry;
                private Object api, gemMgr, abilityMgr;
                private Method mHas, mGemId, mTier;
                private Method mNoCd, mKeys, mRemain, mSet;

                public GemBridge(JavaPlugin plugin) { this.plugin = plugin; }

                private boolean ensure() {
                    if (ready) return true;
                    long now = System.currentTimeMillis();
                    if (now < nextTry) return false;
                    nextTry = now + 30_000L;
                    try {
                        Plugin bg = Bukkit.getPluginManager().getPlugin("BlissGems");
                        if (bg == null || !bg.isEnabled()) return false;
                        Class<?> apiCls = Class.forName("dev.xoperr.blissgems.api.BlissGemsAPI", true, bg.getClass().getClassLoader());
                        Object a = Bukkit.getServicesManager().load(apiCls);
                        if (a == null && apiCls.isInstance(bg)) a = bg;
                        if (a == null) return false;
                        api = a;
                        mHas = apiCls.getMethod("playerHasGem", Player.class, String.class);
                        gemMgr = apiCls.getMethod("getGemManager").invoke(a);
                        mGemId = gemMgr.getClass().getMethod("getGemId", Player.class);
                        mTier = gemMgr.getClass().getMethod("getGemTier", Player.class);
                        try {
                            abilityMgr = apiCls.getMethod("getAbilityManager").invoke(a);
                            Class<?> ac = abilityMgr.getClass();
                            mNoCd = ac.getMethod("hasNoCooldown", Player.class);
                            mKeys = ac.getMethod("getCooldownsFor", UUID.class);
                            mRemain = ac.getMethod("getRemainingCooldown", Player.class, String.class);
                            mSet = ac.getMethod("setCooldown", Player.class, String.class, int.class);
                        } catch (Throwable t) {
                            abilityMgr = null;
                        }
                        ready = true;
                    } catch (Throwable t) {
                        if (!warned) { warned = true; plugin.getLogger().warning("BlissGems bridge unavailable: " + t); }
                    }
                    return ready;
                }

                public boolean available() { return ensure(); }

                /** Lowercase id of the gem the player is using, or "". */
                public String activeGem(Player p) {
                    if (!ensure()) return "";
                    try {
                        Object o = mGemId.invoke(gemMgr, p);
                        return o == null ? "" : o.toString().toLowerCase(Locale.ROOT);
                    } catch (Throwable t) { return ""; }
                }

                public int tier(Player p) {
                    if (!ensure()) return 0;
                    try {
                        Object o = mTier.invoke(gemMgr, p);
                        return o instanceof Number n ? n.intValue() : 0;
                    } catch (Throwable t) { return 0; }
                }

                /** True when the player is using this gem at (at least) this tier. */
                public boolean holds(Player p, String gem, int minTier) {
                    if (!ensure()) return false;
                    String want = gem.toLowerCase(Locale.ROOT);
                    if (activeGem(p).contains(want)) return tier(p) >= minTier;
                    try { return minTier <= 1 && Boolean.TRUE.equals(mHas.invoke(api, p, gem)); }
                    catch (Throwable t) { return false; }
                }

                // ---- cooldowns ----
                public boolean cooldownsAvailable() { return ensure() && abilityMgr != null; }

                public boolean noCooldown(Player p) {
                    try { return Boolean.TRUE.equals(mNoCd.invoke(abilityMgr, p)); } catch (Throwable t) { return false; }
                }

                public Set<String> cooldownKeys(UUID id) {
                    Set<String> out = new HashSet<>();
                    try {
                        Object o = mKeys.invoke(abilityMgr, id);
                        if (o instanceof Map<?, ?> m) for (Object k : m.keySet()) if (k instanceof String s) out.add(s);
                    } catch (Throwable ignored) {}
                    return out;
                }

                public int remaining(Player p, String key) {
                    try {
                        Object o = mRemain.invoke(abilityMgr, p, key);
                        return o instanceof Number n ? n.intValue() : 0;
                    } catch (Throwable t) { return 0; }
                }

                public void setCooldown(Player p, String key, int seconds) {
                    try { mSet.invoke(abilityMgr, p, key, seconds); } catch (Throwable ignored) {}
                }
            }
            EOF_JAVA

      - name: Create HonoredOneManager.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/HonoredOneManager.java)
            cat > src/main/java/me/lofi/wisps/HonoredOneManager.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import net.kyori.adventure.title.Title;
            import org.bukkit.Bukkit;
            import org.bukkit.OfflinePlayer;
            import org.bukkit.Sound;
            import org.bukkit.entity.Player;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.EventPriority;
            import org.bukkit.event.Listener;
            import org.bukkit.event.entity.PlayerDeathEvent;

            import java.time.Duration;
            import java.util.*;

            /**
             * The Honored One: the title that drifts during the event (it passes to whoever kills the holder),
             * and, if you still hold it when the timer ends, the right to enter the Control Room.
             */
            public final class HonoredOneManager implements Listener {

                private final WispsPlugin plugin;
                private final ControlStore store;
                private WispManager wisps;

                private UUID holder;
                private boolean ascended, eventActive;
                private long eventEnd;

                public HonoredOneManager(WispsPlugin plugin, ControlStore store) {
                    this.plugin = plugin; this.store = store;
                    String h = store.yml().getString("honored.holder");
                    if (h != null) { try { holder = UUID.fromString(h); } catch (IllegalArgumentException ignored) {} }
                    ascended = store.yml().getBoolean("honored.ascended", false);
                    eventActive = store.yml().getBoolean("honored.event-active", false);
                    eventEnd = store.yml().getLong("honored.event-end", 0L);
                }

                public void setWisps(WispManager wisps) { this.wisps = wisps; }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    Bukkit.getScheduler().runTaskTimer(plugin, () -> {
                        if (eventActive && System.currentTimeMillis() >= eventEnd) endEvent();
                    }, 40L, 20L);
                }

                // ================= state =================

                public boolean isHolder(Player p) { return holder != null && holder.equals(p.getUniqueId()); }
                public boolean ascended() { return ascended; }
                public boolean eventActive() { return eventActive; }
                public UUID holder() { return holder; }

                /** While the event runs, the holder is hunted (see TrackingManager). */
                public boolean isTracked(Player p) { return eventActive && isHolder(p); }

                public boolean canEnter(Player p) { return p.hasPermission("wisps.admin") || (isHolder(p) && ascended); }
                public boolean canEdit(Player p) { return canEnter(p); }

                public String holderName() {
                    if (holder == null) return "nobody";
                    OfflinePlayer op = Bukkit.getOfflinePlayer(holder);
                    return op.getName() == null ? holder.toString() : op.getName();
                }

                public String timeLeft() {
                    if (!eventActive) return "no event running";
                    long ms = Math.max(0, eventEnd - System.currentTimeMillis());
                    long d = ms / 86_400_000L, h = (ms / 3_600_000L) % 24, m = (ms / 60_000L) % 60;
                    return d + "d " + h + "h " + m + "m left";
                }

                private void save() {
                    store.yml().set("honored.holder", holder == null ? null : holder.toString());
                    store.yml().set("honored.ascended", ascended);
                    store.yml().set("honored.event-active", eventActive);
                    store.yml().set("honored.event-end", eventEnd);
                    store.save();
                }

                // ================= admin actions =================

                public void setHolder(Player p, boolean ascend) {
                    holder = p.getUniqueId();
                    ascended = ascend;
                    save();
                }

                public void clear() {
                    holder = null; ascended = false; eventActive = false;
                    save();
                }

                /** Starts the event: the Prophet speaks to everyone, and the title is given to {@code first}. */
                public void startEvent(int days, Player first) {
                    eventActive = true;
                    ascended = false;
                    eventEnd = System.currentTimeMillis() + days * 86_400_000L;
                    holder = first.getUniqueId();
                    save();
                    Bukkit.broadcast(Component.empty());
                    Bukkit.broadcast(Component.text("\u29D6 THE HONORED ONE EVENT HAS BEGUN", NamedTextColor.WHITE, TextDecoration.BOLD));
                    Bukkit.broadcast(Component.text("One among you holds the title for " + days + " days. It will drift.", NamedTextColor.GRAY));
                    Bukkit.broadcast(Component.empty());
                    for (Player p : Bukkit.getOnlinePlayers()) {
                        p.playSound(p.getLocation(), Sound.BLOCK_BELL_RESONATE, 1.2f, 0.5f);
                        if (wisps != null) wisps.offer(p, WispType.PROPHET, false, true);
                    }
                    first.showTitle(Title.title(
                            Component.text("THE HONORED ONE", NamedTextColor.WHITE, TextDecoration.BOLD),
                            Component.text("it is you. for now.", NamedTextColor.GRAY),
                            Title.Times.times(Duration.ofMillis(600), Duration.ofMillis(4000), Duration.ofMillis(1000))));
                }

                /** Ends the event: whoever holds the title ascends and may enter the Control Room. */
                public void endEvent() {
                    if (!eventActive) return;
                    eventActive = false;
                    if (holder != null) ascended = true;
                    save();
                    Bukkit.broadcast(Component.empty());
                    Bukkit.broadcast(Component.text("\u29D6 THE TIMER HAS ENDED", NamedTextColor.WHITE, TextDecoration.BOLD));
                    if (holder != null) {
                        Bukkit.broadcast(Component.text(holderName() + " has ascended. The Control Room is theirs.", NamedTextColor.GRAY));
                        Player p = Bukkit.getPlayer(holder);
                        if (p != null) {
                            p.showTitle(Title.title(
                                    Component.text("YOU HAVE ASCENDED", NamedTextColor.WHITE, TextDecoration.BOLD),
                                    Component.text("/controlroom enter", NamedTextColor.GRAY),
                                    Title.Times.times(Duration.ofMillis(600), Duration.ofMillis(4000), Duration.ofMillis(1000))));
                            p.playSound(p.getLocation(), Sound.ENTITY_ENDER_DRAGON_GROWL, 1.0f, 0.6f);
                        }
                    } else {
                        Bukkit.broadcast(Component.text("No one held the title. All others face the consequences of their decisions.", NamedTextColor.GRAY));
                    }
                    Bukkit.broadcast(Component.empty());
                }

                // ================= the title drifts =================

                @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
                public void onDeath(PlayerDeathEvent e) {
                    if (!eventActive) return;
                    Player victim = e.getEntity();
                    Player killer = victim.getKiller();
                    if (!isHolder(victim) || killer == null || killer == victim) return;
                    holder = killer.getUniqueId();
                    save();
                    Bukkit.broadcast(Component.text(killer.getName() + " has taken the title of Honored One from " + victim.getName() + ".", NamedTextColor.WHITE, TextDecoration.ITALIC));
                    killer.showTitle(Title.title(
                            Component.text("THE HONORED ONE", NamedTextColor.WHITE, TextDecoration.BOLD),
                            Component.text("the title is yours", NamedTextColor.GRAY),
                            Title.Times.times(Duration.ofMillis(400), Duration.ofMillis(2500), Duration.ofMillis(800))));
                    killer.playSound(killer.getLocation(), Sound.BLOCK_BELL_USE, 1.0f, 0.6f);
                }
            }
            EOF_JAVA

      - name: Create PrismaticEdge.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/PrismaticEdge.java)
            cat > src/main/java/me/lofi/wisps/PrismaticEdge.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import net.kyori.adventure.text.minimessage.MiniMessage;
            import org.bukkit.Bukkit;
            import org.bukkit.Color;
            import org.bukkit.Location;
            import org.bukkit.Material;
            import org.bukkit.NamespacedKey;
            import org.bukkit.Particle;
            import org.bukkit.Registry;
            import org.bukkit.Sound;
            import org.bukkit.World;
            import org.bukkit.enchantments.Enchantment;
            import org.bukkit.entity.Entity;
            import org.bukkit.entity.LivingEntity;
            import org.bukkit.entity.Player;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.Listener;
            import org.bukkit.event.block.Action;
            import org.bukkit.event.player.PlayerInteractEvent;
            import org.bukkit.inventory.EquipmentSlot;
            import org.bukkit.inventory.ItemStack;
            import org.bukkit.inventory.ShapedRecipe;
            import org.bukkit.inventory.meta.ItemMeta;
            import org.bukkit.persistence.PersistentDataType;
            import org.bukkit.util.RayTraceResult;
            import org.bukkit.util.Vector;

            import java.util.*;

            /**
             * The Prismatic Edge, a mythic sword the Control Room can introduce. (The real item's abilities weren't
             * available to me, so these two are my own design: tune or replace them freely.)
             * Right-click: Prism Slash, a rainbow cone that cuts everything ahead. Sneak + right-click: Refract, a short blink.
             */
            public final class PrismaticEdge implements Listener {

                private static final double SLASH_DAMAGE = 8.0, SLASH_RANGE = 10.0, SLASH_HALF_ANGLE = 40.0;
                private static final long SLASH_CD = 10_000L, REFRACT_CD = 12_000L;
                private static final double REFRACT_RANGE = 8.0;

                private final WispsPlugin plugin;
                private final ControlRules rules;
                private final NamespacedKey keyItem, keyRecipe;
                private final Map<UUID, Long> slashReady = new HashMap<>(), refractReady = new HashMap<>();

                public PrismaticEdge(WispsPlugin plugin, ControlRules rules) {
                    this.plugin = plugin; this.rules = rules;
                    this.keyItem = new NamespacedKey(plugin, "prismatic_edge");
                    this.keyRecipe = new NamespacedKey(plugin, "prismatic_edge_recipe");
                }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    rules.addListener(s -> { if (s.id.equals("mythic.prismatic")) syncRecipe(); });
                    syncRecipe();
                }

                public void shutdown() { Bukkit.removeRecipe(keyRecipe); }

                public boolean enabled() { return rules.bool("mythic.prismatic"); }

                public boolean is(ItemStack it) {
                    return it != null && it.hasItemMeta() && it.getItemMeta().getPersistentDataContainer().has(keyItem, PersistentDataType.BYTE);
                }

                public ItemStack create() {
                    ItemStack it = new ItemStack(Material.NETHERITE_SWORD);
                    ItemMeta m = it.getItemMeta();
                    m.displayName(MiniMessage.miniMessage().deserialize("<!italic><bold><rainbow>Prismatic Edge</rainbow></bold>"));
                    m.lore(List.of(
                            Component.text("Mythic", NamedTextColor.LIGHT_PURPLE).decoration(TextDecoration.ITALIC, false),
                            Component.text("Right-click: Prism Slash", NamedTextColor.GRAY).decoration(TextDecoration.ITALIC, false),
                            Component.text("Sneak + right-click: Refract", NamedTextColor.GRAY).decoration(TextDecoration.ITALIC, false),
                            Component.text("Introduced by the Honored One.", NamedTextColor.DARK_GRAY).decoration(TextDecoration.ITALIC, false)));
                    Enchantment sharp = Registry.ENCHANTMENT.get(NamespacedKey.minecraft("sharpness"));
                    Enchantment unb = Registry.ENCHANTMENT.get(NamespacedKey.minecraft("unbreaking"));
                    if (sharp != null) m.addEnchant(sharp, 5, true);
                    if (unb != null) m.addEnchant(unb, 3, true);
                    m.setUnbreakable(true);
                    m.getPersistentDataContainer().set(keyItem, PersistentDataType.BYTE, (byte) 1);
                    it.setItemMeta(m);
                    return it;
                }

                /** The recipe exists only while the Control Room has introduced the sword. */
                public void syncRecipe() {
                    Bukkit.removeRecipe(keyRecipe);
                    if (!enabled()) return;
                    ShapedRecipe r = new ShapedRecipe(keyRecipe, create());
                    r.shape(" N ", "DSD", " I ");
                    r.setIngredient('N', Material.NETHER_STAR);
                    r.setIngredient('D', Material.DIAMOND_BLOCK);
                    r.setIngredient('S', Material.NETHERITE_SWORD);
                    r.setIngredient('I', Material.NETHERITE_INGOT);
                    Bukkit.addRecipe(r);
                }

                // ================= abilities =================

                @EventHandler
                public void onUse(PlayerInteractEvent e) {
                    if (e.getAction() != Action.RIGHT_CLICK_AIR && e.getAction() != Action.RIGHT_CLICK_BLOCK) return;
                    if (e.getHand() != EquipmentSlot.HAND) return;
                    Player p = e.getPlayer();
                    ItemStack held = p.getInventory().getItemInMainHand();
                    if (!is(held)) return;
                    if (!enabled()) { p.sendActionBar(Component.text("the Prismatic Edge is dormant.", NamedTextColor.GRAY)); return; }
                    long now = System.currentTimeMillis();
                    if (p.isSneaking()) {
                        long ready = refractReady.getOrDefault(p.getUniqueId(), 0L);
                        if (now < ready) { cdMsg(p, "Refract", ready - now); return; }
                        refract(p);
                        refractReady.put(p.getUniqueId(), now + REFRACT_CD);
                    } else {
                        long ready = slashReady.getOrDefault(p.getUniqueId(), 0L);
                        if (now < ready) { cdMsg(p, "Prism Slash", ready - now); return; }
                        slash(p);
                        slashReady.put(p.getUniqueId(), now + SLASH_CD);
                    }
                }

                private static void cdMsg(Player p, String name, long ms) {
                    p.sendActionBar(Component.text(name + " \u00B7 " + ((ms + 999) / 1000) + "s", NamedTextColor.GRAY));
                }

                private void slash(Player p) {
                    World w = p.getWorld();
                    Location eye = p.getEyeLocation();
                    Vector dir = eye.getDirection().normalize();
                    w.playSound(eye, Sound.ENTITY_PLAYER_ATTACK_SWEEP, 1.4f, 1.6f);
                    w.playSound(eye, Sound.BLOCK_AMETHYST_BLOCK_CHIME, 1.4f, 1.2f);

                    // a fan of coloured rays
                    for (int k = -5; k <= 5; k++) {
                        double ang = Math.toRadians(k * SLASH_HALF_ANGLE / 5.0);
                        double cos = Math.cos(ang), sin = Math.sin(ang);
                        Vector d = new Vector(dir.getX() * cos - dir.getZ() * sin, dir.getY(), dir.getX() * sin + dir.getZ() * cos).normalize();
                        Color c = rainbow((k + 5) / 11.0);
                        for (double s = 1.0; s <= SLASH_RANGE; s += 0.5) {
                            Location l = eye.clone().add(d.clone().multiply(s)).add(0, -0.3, 0);
                            w.spawnParticle(Particle.DUST, l, 1, 0, 0, 0, 0, new Particle.DustOptions(c, 1.5f));
                        }
                    }
                    // everything inside the cone
                    double cosLimit = Math.cos(Math.toRadians(SLASH_HALF_ANGLE));
                    for (Entity x : w.getNearbyEntities(eye, SLASH_RANGE, SLASH_RANGE, SLASH_RANGE)) {
                        if (x == p || !(x instanceof LivingEntity le) || le.isDead()) continue;
                        Vector to = le.getEyeLocation().toVector().subtract(eye.toVector());
                        double dist = to.length();
                        if (dist > SLASH_RANGE || dist < 0.01) continue;
                        if (to.normalize().dot(dir) < cosLimit) continue;
                        le.damage(SLASH_DAMAGE, p);
                        le.setVelocity(dir.clone().multiply(0.5).setY(0.25));
                        w.spawnParticle(Particle.END_ROD, le.getLocation().add(0, 1, 0), 12, 0.3, 0.5, 0.3, 0.05);
                    }
                }

                private void refract(Player p) {
                    World w = p.getWorld();
                    Location eye = p.getEyeLocation();
                    Vector dir = eye.getDirection().normalize();
                    RayTraceResult hit = w.rayTraceBlocks(eye, dir, REFRACT_RANGE);
                    double dist = hit == null ? REFRACT_RANGE : Math.max(0, hit.getHitPosition().distance(eye.toVector()) - 1.0);
                    Location from = p.getLocation().clone();
                    Location to = from.clone().add(dir.clone().multiply(dist));
                    for (double s = 0; s <= dist; s += 0.4) {
                        Location l = from.clone().add(dir.clone().multiply(s)).add(0, 1.0, 0);
                        w.spawnParticle(Particle.DUST, l, 2, 0.15, 0.4, 0.15, 0, new Particle.DustOptions(rainbow(s / Math.max(1.0, dist)), 1.6f));
                    }
                    to.setYaw(from.getYaw());
                    to.setPitch(from.getPitch());
                    p.teleport(to);
                    p.setFallDistance(0);
                    w.playSound(to, Sound.ENTITY_ENDERMAN_TELEPORT, 1.0f, 1.8f);
                }

                /** hue in [0,1) to a fully-saturated colour. */
                private static Color rainbow(double h) {
                    h = ((h % 1.0) + 1.0) % 1.0;
                    int i = (int) (h * 6);
                    double f = h * 6 - i, q = 1 - f, r, g, b;
                    if (i == 0) { r = 1; g = f; b = 0; }
                    else if (i == 1) { r = q; g = 1; b = 0; }
                    else if (i == 2) { r = 0; g = 1; b = f; }
                    else if (i == 3) { r = 0; g = q; b = 1; }
                    else if (i == 4) { r = f; g = 0; b = 1; }
                    else { r = 1; g = 0; b = q; }
                    return Color.fromRGB((int) (r * 255), (int) (g * 255), (int) (b * 255));
                }
            }
            EOF_JAVA

      - name: Create RuleEnforcer.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/RuleEnforcer.java)
            cat > src/main/java/me/lofi/wisps/RuleEnforcer.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import com.destroystokyo.paper.event.player.PlayerArmorChangeEvent;
            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import org.bukkit.Bukkit;
            import org.bukkit.Material;
            import org.bukkit.NamespacedKey;
            import org.bukkit.Registry;
            import org.bukkit.World;
            import org.bukkit.enchantments.Enchantment;
            import org.bukkit.entity.EnderPearl;
            import org.bukkit.entity.Player;
            import org.bukkit.entity.Projectile;
            import org.bukkit.event.Event;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.EventPriority;
            import org.bukkit.event.Listener;
            import org.bukkit.event.block.Action;
            import org.bukkit.event.block.BlockPlaceEvent;
            import org.bukkit.event.enchantment.EnchantItemEvent;
            import org.bukkit.event.entity.EntityDamageByEntityEvent;
            import org.bukkit.event.entity.EntityResurrectEvent;
            import org.bukkit.event.entity.PotionSplashEvent;
            import org.bukkit.event.entity.ProjectileLaunchEvent;
            import org.bukkit.event.inventory.PrepareAnvilEvent;
            import org.bukkit.event.player.PlayerInteractEvent;
            import org.bukkit.event.player.PlayerItemConsumeEvent;
            import org.bukkit.event.player.PlayerQuitEvent;
            import org.bukkit.inventory.ItemStack;
            import org.bukkit.inventory.PlayerInventory;
            import org.bukkit.inventory.meta.EnchantmentStorageMeta;
            import org.bukkit.inventory.meta.ItemMeta;
            import org.bukkit.inventory.meta.PotionMeta;
            import org.bukkit.potion.PotionType;

            import java.util.*;

            /** Turns the Control Room's settings into actual server rules. */
            public final class RuleEnforcer implements Listener {

                private static final Map<String, String> ENCHANTS = Map.of(
                        "sharpness", "ench.sharpness", "protection", "ench.protection", "knockback", "ench.knockback",
                        "thorns", "ench.thorns", "infinity", "ench.infinity", "wind_burst", "ench.wind_burst");

                private final WispsPlugin plugin;
                private final ControlRules rules;
                private final String controlWorld;
                private final Map<UUID, Long> lastCombat = new HashMap<>();
                private final Map<UUID, Integer> pops = new HashMap<>();

                public RuleEnforcer(WispsPlugin plugin, ControlRules rules, String controlWorld) {
                    this.plugin = plugin; this.rules = rules; this.controlWorld = controlWorld;
                }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    rules.addListener(this::onRuleChanged);
                    Bukkit.getScheduler().runTaskTimer(plugin, this::scanAll, 40L, 40L);
                    Bukkit.getScheduler().runTask(plugin, () -> applyBorder(false));
                }

                // ================= reacting to changes =================

                private void onRuleChanged(ControlRules.Setting s) {
                    if (s.id.equals("border.radius")) applyBorder(true);
                    else scanAll();
                }

                /** Border: overworlds get the radius, nethers get 1/8 of it. Only touched once somebody sets it. */
                public void applyBorder(boolean animate) {
                    if (!rules.isSet("border.radius")) return;
                    double radius = rules.get("border.radius");
                    for (World w : Bukkit.getWorlds()) {
                        if (w.getName().equals(controlWorld)) continue;
                        double size;
                        if (w.getEnvironment() == World.Environment.NORMAL) size = radius * 2.0;
                        else if (w.getEnvironment() == World.Environment.NETHER) size = radius * 2.0 / 8.0;
                        else continue;
                        w.getWorldBorder().setSize(size, animate ? 10L : 0L);
                    }
                }

                public void scanAll() { for (Player p : Bukkit.getOnlinePlayers()) scan(p); }

                private void scan(Player p) {
                    PlayerInventory inv = p.getInventory();
                    boolean changed = false;
                    for (ItemStack it : inv.getContents()) if (clamp(it)) changed = true;
                    changed |= limitItem(p, Material.COBWEB, "item.cobweb");
                    changed |= limitItem(p, Material.ENDER_PEARL, "item.pearls");
                    changed |= enforceArmor(p);
                    if (changed) p.updateInventory();
                }

                // ================= enchantments =================

                private int capFor(Enchantment e) {
                    String rule = ENCHANTS.get(e.getKey().getKey());
                    if (rule == null) return -1;
                    ControlRules.Setting s = rules.find(rule);
                    int v = rules.intv(rule);
                    return v >= (int) s.max ? -1 : v;
                }

                /** Pulls over-limit enchantments down to the current cap. Returns true if the item changed. */
                private boolean clamp(ItemStack it) {
                    if (it == null || !it.hasItemMeta()) return false;
                    ItemMeta m = it.getItemMeta();
                    boolean changed = false;
                    if (m instanceof EnchantmentStorageMeta sm) {
                        for (Map.Entry<Enchantment, Integer> en : new HashMap<>(sm.getStoredEnchants()).entrySet()) {
                            int cap = capFor(en.getKey());
                            if (cap >= 0 && en.getValue() > cap) {
                                sm.removeStoredEnchant(en.getKey());
                                if (cap > 0) sm.addStoredEnchant(en.getKey(), cap, true);
                                changed = true;
                            }
                        }
                    }
                    for (Map.Entry<Enchantment, Integer> en : new HashMap<>(m.getEnchants()).entrySet()) {
                        int cap = capFor(en.getKey());
                        if (cap >= 0 && en.getValue() > cap) {
                            m.removeEnchant(en.getKey());
                            if (cap > 0) m.addEnchant(en.getKey(), cap, true);
                            changed = true;
                        }
                    }
                    if (changed) it.setItemMeta(m);
                    return changed;
                }

                @EventHandler
                public void onEnchant(EnchantItemEvent e) {
                    Player p = e.getEnchanter();
                    Bukkit.getScheduler().runTask(plugin, () -> scan(p));
                }

                @EventHandler
                public void onAnvil(PrepareAnvilEvent e) {
                    ItemStack r = e.getResult();
                    if (r == null) return;
                    ItemStack copy = r.clone();
                    if (clamp(copy)) e.setResult(copy);
                }

                // ================= item limits =================

                private boolean limitItem(Player p, Material type, String rule) {
                    int cap = rules.limit(rule);
                    if (cap < 0) return false;
                    ItemStack[] c = p.getInventory().getContents();
                    int count = 0;
                    for (ItemStack it : c) if (it != null && it.getType() == type) count += it.getAmount();
                    if (count <= cap) return false;
                    int excess = count - cap;
                    for (int i = c.length - 1; i >= 0 && excess > 0; i--) {
                        ItemStack it = c[i];
                        if (it == null || it.getType() != type) continue;
                        int take = Math.min(excess, it.getAmount());
                        excess -= take;
                        if (take >= it.getAmount()) p.getInventory().setItem(i, null);
                        else { it.setAmount(it.getAmount() - take); p.getInventory().setItem(i, it); }
                    }
                    p.sendActionBar(Component.text("limit: " + cap + " " + type.name().toLowerCase(Locale.ROOT).replace('_', ' '), NamedTextColor.RED));
                    return true;
                }

                @EventHandler
                public void onPlace(BlockPlaceEvent e) {
                    if (e.getBlockPlaced().getType() == Material.COBWEB && rules.limit("item.cobweb") == 0) {
                        e.setCancelled(true);
                        e.getPlayer().sendActionBar(Component.text("cobwebs are banned.", NamedTextColor.RED));
                    }
                }

                @EventHandler
                public void onUse(PlayerInteractEvent e) {
                    if (e.getAction() != Action.RIGHT_CLICK_AIR && e.getAction() != Action.RIGHT_CLICK_BLOCK) return;
                    ItemStack it = e.getItem();
                    if (it == null) return;
                    if (it.getType() == Material.ENDER_PEARL && rules.limit("item.pearls") == 0) {
                        e.setUseItemInHand(Event.Result.DENY);
                        e.getPlayer().sendActionBar(Component.text("ender pearls are banned.", NamedTextColor.RED));
                    } else if (bannedPotion(it)) {
                        e.setUseItemInHand(Event.Result.DENY);
                        e.getPlayer().sendActionBar(Component.text("that potion is banned.", NamedTextColor.RED));
                    }
                }

                @EventHandler
                public void onPearl(ProjectileLaunchEvent e) {
                    if (!(e.getEntity() instanceof EnderPearl) || !(e.getEntity().getShooter() instanceof Player p)) return;
                    double mult = rules.get("item.pearl_cd");
                    if (mult <= 1.0) return;
                    // vanilla sets its own 1s cooldown right after the throw, so ours goes on a tick later
                    Bukkit.getScheduler().runTask(plugin, () -> p.setCooldown(Material.ENDER_PEARL, (int) Math.round(20 * mult)));
                }

                // ================= banned consumables =================

                private boolean bannedPotion(ItemStack it) {
                    if (it == null) return false;
                    Material t = it.getType();
                    if (t != Material.POTION && t != Material.SPLASH_POTION && t != Material.LINGERING_POTION) return false;
                    if (!(it.getItemMeta() instanceof PotionMeta pm)) return false;
                    PotionType base = pm.getBasePotionType();
                    if (base == null) return false;
                    String key = base.getKey().getKey();
                    if (!rules.bool("item.turtle_master") && key.contains("turtle_master")) return true;
                    if (!rules.bool("item.slow_falling") && key.contains("slow_falling")) return true;
                    return false;
                }

                @EventHandler
                public void onConsume(PlayerItemConsumeEvent e) {
                    ItemStack it = e.getItem();
                    if (it.getType() == Material.ENCHANTED_GOLDEN_APPLE && !rules.bool("item.egapple")) {
                        e.setCancelled(true);
                        e.getPlayer().sendActionBar(Component.text("enchanted golden apples are banned.", NamedTextColor.RED));
                    } else if (bannedPotion(it)) {
                        e.setCancelled(true);
                        e.getPlayer().sendActionBar(Component.text("that potion is banned.", NamedTextColor.RED));
                    }
                }

                @EventHandler
                public void onSplash(PotionSplashEvent e) {
                    if (bannedPotion(e.getEntity().getItem())) e.setCancelled(true);
                }

                // ================= totems per fight =================

                @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
                public void onCombat(EntityDamageByEntityEvent e) {
                    if (!(e.getEntity() instanceof Player victim)) return;
                    Player attacker = null;
                    if (e.getDamager() instanceof Player a) attacker = a;
                    else if (e.getDamager() instanceof Projectile pr && pr.getShooter() instanceof Player a) attacker = a;
                    if (attacker == null || attacker == victim) return;
                    long now = System.currentTimeMillis();
                    lastCombat.put(victim.getUniqueId(), now);
                    lastCombat.put(attacker.getUniqueId(), now);
                }

                @EventHandler(priority = EventPriority.HIGH, ignoreCancelled = true)
                public void onTotem(EntityResurrectEvent e) {
                    if (!(e.getEntity() instanceof Player p)) return;
                    int cap = rules.limit("item.totems");
                    if (cap < 0) return;
                    long now = System.currentTimeMillis();
                    Long last = lastCombat.get(p.getUniqueId());
                    if (last == null || now - last > 30_000L) pops.put(p.getUniqueId(), 0); // a new fight
                    int used = pops.getOrDefault(p.getUniqueId(), 0);
                    if (used >= cap) {
                        e.setCancelled(true);
                        p.sendActionBar(Component.text("no more totems this fight (" + cap + ").", NamedTextColor.RED));
                        return;
                    }
                    pops.put(p.getUniqueId(), used + 1);
                    lastCombat.put(p.getUniqueId(), now);
                }

                @EventHandler
                public void onQuit(PlayerQuitEvent e) {
                    lastCombat.remove(e.getPlayer().getUniqueId());
                    pops.remove(e.getPlayer().getUniqueId());
                }

                // ================= armor =================

                private static int rank(ItemStack it) {
                    if (it == null) return -1;
                    String n = it.getType().name();
                    if (n.startsWith("LEATHER_") || n.startsWith("GOLDEN_")) return 0;
                    if (n.startsWith("CHAINMAIL_")) return 1;
                    if (n.startsWith("IRON_") || n.equals("TURTLE_HELMET")) return 2;
                    if (n.startsWith("DIAMOND_")) return 3;
                    if (n.startsWith("NETHERITE_")) return 4;
                    return -1;
                }

                private boolean enforceArmor(Player p) {
                    PlayerInventory inv = p.getInventory();
                    ItemStack[] arm = inv.getArmorContents(); // boots, leggings, chestplate, helmet
                    int maxTier = rules.intv("armor.tier");
                    int netherite = rules.intv("armor.netherite");
                    boolean changed = false;
                    for (int i = 0; i < arm.length; i++) {
                        if (rank(arm[i]) > maxTier) { strip(p, arm, i, "armor above " + ControlRules.TIERS[maxTier] + " is banned"); changed = true; }
                    }
                    int count = 0;
                    for (ItemStack it : arm) if (rank(it) == 4) count++;
                    for (int i = 0; i < arm.length && count > netherite; i++) {
                        if (rank(arm[i]) == 4) { strip(p, arm, i, "only " + netherite + " netherite pieces allowed"); count--; changed = true; }
                    }
                    if (changed) inv.setArmorContents(arm);
                    return changed;
                }

                private void strip(Player p, ItemStack[] arm, int slot, String why) {
                    ItemStack it = arm[slot];
                    arm[slot] = null;
                    Map<Integer, ItemStack> left = p.getInventory().addItem(it);
                    for (ItemStack rest : left.values()) p.getWorld().dropItemNaturally(p.getLocation(), rest);
                    p.sendActionBar(Component.text(why + ".", NamedTextColor.RED));
                }

                @EventHandler
                public void onArmor(PlayerArmorChangeEvent e) {
                    Player p = e.getPlayer();
                    Bukkit.getScheduler().runTask(plugin, () -> { if (enforceArmor(p)) p.updateInventory(); });
                }
            }
            EOF_JAVA

      - name: Create TrackingManager.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/TrackingManager.java)
            cat > src/main/java/me/lofi/wisps/TrackingManager.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import org.bukkit.Bukkit;
            import org.bukkit.Location;
            import org.bukkit.Sound;
            import org.bukkit.command.Command;
            import org.bukkit.command.CommandExecutor;
            import org.bukkit.command.CommandSender;
            import org.bukkit.entity.Player;
            import org.bukkit.potion.PotionEffect;
            import org.bukkit.potion.PotionEffectType;

            import java.util.*;

            /**
             * The Last Heartbeat's price: at random moments the holder glows and anyone can run /track to find them.
             * Switch the whole thing on or off with "/wisp tracking on|off" (or tracking.enabled in config.yml).
             */
            public final class TrackingManager implements CommandExecutor {

                private static final String[] DIRS = {"N", "NE", "E", "SE", "S", "SW", "W", "NW"};

                private final WispsPlugin plugin;
                private final VowManager vows;
                private final Map<UUID, Long> nextAt = new HashMap<>(), until = new HashMap<>();
                private final Random rng = new Random();
                private HonoredOneManager honored;

                public TrackingManager(WispsPlugin plugin, VowManager vows) { this.plugin = plugin; this.vows = vows; }

                public void setHonored(HonoredOneManager h) { this.honored = h; }

                public void start() { Bukkit.getScheduler().runTaskTimer(plugin, this::tick, 20L, 20L); }

                public boolean enabled() { return plugin.getConfig().getBoolean("tracking.enabled", true); }

                public void setEnabled(boolean on) {
                    plugin.getConfig().set("tracking.enabled", on);
                    plugin.saveConfig();
                    if (!on) {
                        for (UUID id : new ArrayList<>(until.keySet())) {
                            Player p = Bukkit.getPlayer(id);
                            if (p != null) stop(p, false); else until.remove(id);
                        }
                        nextAt.clear();
                    }
                }

                private boolean cursed(Player p) {
                    if (honored != null && honored.isTracked(p)) return true;
                    for (Vow v : vows.vows(p)) if (v.tracked) return true;
                    return false;
                }

                private void tick() {
                    long now = System.currentTimeMillis();
                    boolean on = enabled();
                    for (Player p : Bukkit.getOnlinePlayers()) {
                        UUID id = p.getUniqueId();
                        if (!on || !cursed(p)) {
                            if (until.containsKey(id)) stop(p, false);
                            nextAt.remove(id);
                            continue;
                        }
                        Long end = until.get(id);
                        if (end != null) {
                            if (now >= end) { stop(p, true); schedule(id, now); }
                            else if (!p.hasPotionEffect(PotionEffectType.GLOWING)) glow(p, end - now);
                            continue;
                        }
                        Long n = nextAt.get(id);
                        if (n == null) { schedule(id, now); continue; }
                        if (now >= n) begin(p, now);
                    }
                    until.keySet().removeIf(id -> Bukkit.getPlayer(id) == null);
                    nextAt.keySet().removeIf(id -> Bukkit.getPlayer(id) == null);
                }

                private void schedule(UUID id, long now) {
                    int min = Math.max(5, plugin.getConfig().getInt("tracking.min-interval-seconds", 45));
                    int max = Math.max(min, plugin.getConfig().getInt("tracking.max-interval-seconds", 120));
                    nextAt.put(id, now + (min + rng.nextInt(max - min + 1)) * 1000L);
                }

                private void begin(Player p, long now) {
                    int dur = Math.max(5, plugin.getConfig().getInt("tracking.duration-seconds", 30));
                    until.put(p.getUniqueId(), now + dur * 1000L);
                    nextAt.remove(p.getUniqueId());
                    glow(p, dur * 1000L);
                    p.sendActionBar(Component.text("you are being tracked.", NamedTextColor.RED));
                    p.playSound(p.getLocation(), Sound.ENTITY_WARDEN_HEARTBEAT, 1.5f, 0.8f);
                    boolean hon = honored != null && honored.isTracked(p);
                    Bukkit.broadcast(Component.text(hon ? "\u29D6 " : "\u2764 ", hon ? NamedTextColor.WHITE : NamedTextColor.DARK_RED)
                            .append(Component.text(hon ? "The Honored One, " + p.getName() + ", has been located. " : p.getName() + "'s heartbeat has been detected. ", NamedTextColor.GRAY))
                            .append(Component.text("/track", NamedTextColor.AQUA))
                            .append(Component.text(" for the next " + dur + "s.", NamedTextColor.GRAY)));
                }

                private void glow(Player p, long ms) {
                    p.addPotionEffect(new PotionEffect(PotionEffectType.GLOWING, (int) (ms / 50) + 20, 0, false, false, false));
                }

                private void stop(Player p, boolean announce) {
                    until.remove(p.getUniqueId());
                    p.removePotionEffect(PotionEffectType.GLOWING);
                    if (announce) p.sendActionBar(Component.text("the trail goes cold.", NamedTextColor.GRAY));
                }

                // ================= /track =================

                @Override
                public boolean onCommand(CommandSender s, Command cmd, String label, String[] a) {
                    if (!enabled()) { s.sendMessage(Component.text("Tracking is switched off.", NamedTextColor.GRAY)); return true; }
                    long now = System.currentTimeMillis();
                    boolean any = false;
                    for (Map.Entry<UUID, Long> en : until.entrySet()) {
                        Player t = Bukkit.getPlayer(en.getKey());
                        if (t == null || en.getValue() <= now) continue;
                        any = true;
                        Location tl = t.getLocation();
                        String xyz = tl.getBlockX() + ", " + tl.getBlockY() + ", " + tl.getBlockZ();
                        long left = (en.getValue() - now + 999) / 1000;
                        Component head = Component.text("\u2764 " + t.getName(), NamedTextColor.RED);
                        if (s instanceof Player me && me.getWorld() == t.getWorld()) {
                            Location ml = me.getLocation();
                            double dx = tl.getX() - ml.getX(), dz = tl.getZ() - ml.getZ();
                            double deg = (Math.toDegrees(Math.atan2(dx, -dz)) + 360) % 360;
                            String dir = DIRS[(int) Math.round(deg / 45.0) % 8];
                            me.setCompassTarget(tl);
                            s.sendMessage(head.append(Component.text("  " + xyz + "  \u00B7  " + Math.round(ml.distance(tl)) + " blocks " + dir + "  \u00B7  " + left + "s", NamedTextColor.GRAY)));
                        } else {
                            s.sendMessage(head.append(Component.text("  " + xyz + " in " + t.getWorld().getName() + "  \u00B7  " + left + "s", NamedTextColor.GRAY)));
                        }
                    }
                    if (!any) s.sendMessage(Component.text("No one is being tracked right now.", NamedTextColor.GRAY));
                    else if (s instanceof Player) s.sendMessage(Component.text("Your compass now points at them.", NamedTextColor.DARK_GRAY));
                    return true;
                }
            }
            EOF_JAVA

