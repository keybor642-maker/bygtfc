      - name: Create VowCommand.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/VowCommand.java)
            cat > src/main/java/me/lofi/wisps/VowCommand.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import org.bukkit.Bukkit;
            import org.bukkit.command.*;
            import org.bukkit.entity.Player;

            import java.util.*;

            /** /vow list [player] | info <id> | give <player> <id> | revoke <player> <id> | clear <player> | random <player> [wisp] */
            public final class VowCommand implements TabExecutor {

                private final VowManager vows;
                public VowCommand(VowManager vows) { this.vows = vows; }

                private static void msg(CommandSender s, String t, NamedTextColor c) { s.sendMessage(Component.text(t, c)); }

                @Override
                public boolean onCommand(CommandSender s, Command cmd, String label, String[] a) {
                    String sub = a.length == 0 ? "list" : a[0].toLowerCase(Locale.ROOT);
                    switch (sub) {
                        case "list" -> {
                            Player t = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : s instanceof Player p ? p : null;
                            if (t == null) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            if (t != s && !s.hasPermission("wisps.admin")) { msg(s, "No permission.", NamedTextColor.RED); return true; }
                            Map<String, Long> m = vows.active(t);
                            if (m.isEmpty()) { msg(s, t.getName() + " has no binding vows.", NamedTextColor.GRAY); return true; }
                            m.forEach((id, exp) -> {
                                Vow v = Vow.get(id);
                                String left = exp == 0 ? "permanent" : Math.max(0, (exp - System.currentTimeMillis()) / 60000) + " min left";
                                msg(s, v.name + " (" + left + ")  -" + v.sacrifice + " / +" + v.blessing, NamedTextColor.GOLD);
                            });
                        }
                        case "info" -> {
                            Vow v = a.length > 1 ? Vow.get(a[1]) : null;
                            if (v == null) { msg(s, "Unknown vow.", NamedTextColor.RED); return true; }
                            msg(s, v.name + " [" + v.giver + "]", NamedTextColor.GOLD);
                            msg(s, "Sacrifice: " + v.sacrifice, NamedTextColor.RED);
                            msg(s, "Blessing: " + v.blessing, NamedTextColor.GREEN);
                        }
                        case "give", "revoke", "clear" -> {
                            if (!s.hasPermission("wisps.admin")) { msg(s, "No permission.", NamedTextColor.RED); return true; }
                            Player t = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : null;
                            if (t == null) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            if (sub.equals("clear")) { vows.clear(t); msg(s, "Cleared " + t.getName() + "'s vows.", NamedTextColor.GREEN); return true; }
                            Vow v = a.length > 2 ? Vow.get(a[2]) : null;
                            if (v == null) { msg(s, "Unknown vow.", NamedTextColor.RED); return true; }
                            if (sub.equals("give")) {
                                msg(s, vows.grant(t, v, true) == VowManager.Result.OK ? "Bound " + t.getName() + " to " + v.name + "." : t.getName() + " already has it.",
                                        NamedTextColor.GREEN);
                            } else { vows.revoke(t, v.id); msg(s, "Revoked " + v.name + ".", NamedTextColor.GREEN); }
                        }
                        case "random" -> {
                            if (!s.hasPermission("wisps.admin")) { msg(s, "No permission.", NamedTextColor.RED); return true; }
                            Player t = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : (s instanceof Player me ? me : null);
                            if (t == null) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            WispType type = a.length > 2 ? WispType.parse(a[2]) : null;
                            List<Vow> pool = new ArrayList<>();
                            Set<String> have = vows.active(t).keySet();
                            if (type != null && type != WispType.PROPHET) pool.addAll(Vow.pool(type.giver));
                            else { pool.addAll(Vow.pool(Vow.Giver.MANIFESTATION)); pool.addAll(Vow.pool(Vow.Giver.BALANCE)); }
                            pool.removeIf(v -> have.contains(v.id));
                            if (pool.isEmpty()) { msg(s, "Nothing left to give " + t.getName() + ".", NamedTextColor.RED); return true; }
                            Vow v = pool.get(new Random().nextInt(pool.size()));
                            vows.grant(t, v, true);
                            msg(s, "Bound " + t.getName() + " to " + v.name + ".", NamedTextColor.GREEN);
                        }
                        default -> msg(s, "/vow list|info|give|revoke|clear|random", NamedTextColor.GRAY);
                    }
                    return true;
                }

                @Override
                public List<String> onTabComplete(CommandSender s, Command c, String l, String[] a) {
                    List<String> out = new ArrayList<>();
                    if (a.length == 1) out.addAll(List.of("list", "info", "give", "revoke", "clear", "random"));
                    else if (a.length == 2 && !a[0].equalsIgnoreCase("info")) Bukkit.getOnlinePlayers().forEach(p -> out.add(p.getName()));
                    else if (a.length == 2 || (a.length == 3 && (a[0].equalsIgnoreCase("give") || a[0].equalsIgnoreCase("revoke"))))
                        Vow.all().forEach(v -> out.add(v.id));
                    String last = a[a.length - 1].toLowerCase(Locale.ROOT);
                    return out.stream().filter(x -> x.toLowerCase(Locale.ROOT).startsWith(last)).toList();
                }
            }
            EOF_JAVA

      - name: Create VowManager.java
        run: |
