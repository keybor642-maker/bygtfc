            cat > src/main/java/me/lofi/wisps/VowManager.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import io.papermc.paper.event.player.AsyncChatEvent;
            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import org.bukkit.Bukkit;
            import org.bukkit.Material;
            import org.bukkit.NamespacedKey;
            import org.bukkit.attribute.Attribute;
            import org.bukkit.attribute.AttributeInstance;
            import org.bukkit.attribute.AttributeModifier;
            import org.bukkit.entity.*;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.EventPriority;
            import org.bukkit.event.Listener;
            import org.bukkit.event.block.BlockPlaceEvent;
            import org.bukkit.event.entity.*;
            import org.bukkit.event.player.*;
            import org.bukkit.inventory.EquipmentSlotGroup;
            import org.bukkit.inventory.ItemStack;
            import org.bukkit.inventory.PlayerInventory;
            import org.bukkit.persistence.PersistentDataType;
            import org.bukkit.plugin.java.JavaPlugin;
            import org.bukkit.potion.PotionEffect;

            import java.util.*;
            import java.util.function.Consumer;

            /** Stores active vows on the player (PDC) and enforces every sacrifice + blessing. */
            public final class VowManager implements Listener {

                public static final int MAX_VOWS = 3;
                public enum Result { OK, HAVE, MAX, XP }

                private final JavaPlugin plugin;
                private final NamespacedKey KEY_VOWS;
                private final NamespacedKey KEY_GLOW;

                /** Implemented by AwakeningManager. */
                public interface Hooks {
                    void onExpired(Player p, Vow v);
                    void onFinalBeat(Player p, Vow v);
                }
                private Hooks hooks;
                public void setHooks(Hooks h) { this.hooks = h; }

                private final Map<UUID, Long> immuneUntil = new HashMap<>();
                /** Makes a player untouchable for this many ticks (used by Final Beat). */
                public void immune(Player p, int ticks) { immuneUntil.put(p.getUniqueId(), System.currentTimeMillis() + ticks * 50L); }

                public VowManager(JavaPlugin plugin) {
                    this.plugin = plugin;
                    this.KEY_VOWS = new NamespacedKey(plugin, "binding_vows");
                    this.KEY_GLOW = new NamespacedKey(plugin, "vow_glow");
                }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    // restrictions (armor/offhand/sprint) every 10 ticks
                    Bukkit.getScheduler().runTaskTimer(plugin, () -> {
                        for (Player p : Bukkit.getOnlinePlayers()) {
                            List<Vow> vs = vows(p);
                            if (vs.isEmpty()) continue;
                            Set<Vow.Restriction> r = EnumSet.noneOf(Vow.Restriction.class);
                            vs.forEach(v -> r.addAll(v.restrictions));
                            enforce(p, r);
                        }
                    }, 10L, 10L);
                    // perma effects every 2s
                    Bukkit.getScheduler().runTaskTimer(plugin, () -> {
                        for (Player p : Bukkit.getOnlinePlayers()) applyEffects(p);
                    }, 40L, 40L);
                    // expiry check every second
                    Bukkit.getScheduler().runTaskTimer(plugin, () -> {
                        for (Player p : Bukkit.getOnlinePlayers()) {
                            String raw = p.getPersistentDataContainer().getOrDefault(KEY_VOWS, PersistentDataType.STRING, "");
                            if (raw.isEmpty()) continue;
                            Map<String, Long> m = active(p);
                            List<String> gone = new ArrayList<>();
                            for (String part : raw.split(",")) {
                                if (part.isBlank()) continue;
                                String id = part.split(":")[0];
                                if (!m.containsKey(id)) gone.add(id);
                            }
                            if (gone.isEmpty()) continue;
                            save(p, m); refresh(p);
                            p.sendActionBar(Component.text("a binding vow has run its course.", NamedTextColor.GRAY));
                            for (String id : gone) {
                                Vow v = Vow.get(id);
                                if (v != null && hooks != null) hooks.onExpired(p, v);
                            }
                        }
                    }, 20L, 20L);
                }

                /** Re-applies every active vow's potion effects right now. */
                public void applyEffects(Player p) {
                    for (Vow v : vows(p))
                        for (Vow.Eff e : v.effects)
                            p.addPotionEffect(new PotionEffect(e.type(), 120, e.amp(), true, false, false));
                }

                // ================= STATE =================

                public Map<String, Long> active(Player p) {
                    String raw = p.getPersistentDataContainer().getOrDefault(KEY_VOWS, PersistentDataType.STRING, "");
                    Map<String, Long> m = new LinkedHashMap<>();
                    long now = System.currentTimeMillis();
                    for (String part : raw.split(",")) {
                        if (part.isBlank()) continue;
                        String[] kv = part.split(":");
                        if (Vow.get(kv[0]) == null) continue;
                        long exp = 0;
                        try { if (kv.length > 1) exp = Long.parseLong(kv[1]); } catch (NumberFormatException ignored) {}
                        if (exp != 0 && exp < now) continue;
                        m.put(kv[0], exp);
                    }
                    return m;
                }

                private void save(Player p, Map<String, Long> m) {
                    if (m.isEmpty()) { p.getPersistentDataContainer().remove(KEY_VOWS); return; }
                    StringJoiner j = new StringJoiner(",");
                    m.forEach((id, exp) -> j.add(id + ":" + exp));
                    p.getPersistentDataContainer().set(KEY_VOWS, PersistentDataType.STRING, j.toString());
                }

                public List<Vow> vows(Player p) {
                    List<Vow> out = new ArrayList<>();
                    for (String id : active(p).keySet()) { Vow v = Vow.get(id); if (v != null) out.add(v); }
                    return out;
                }

                public boolean has(Player p, String id) { return active(p).containsKey(id); }
                public int count(Player p) { return active(p).size(); }
                public boolean has(Player p, Vow.Restriction r) { return vows(p).stream().anyMatch(v -> v.restrictions.contains(r)); }

                /** HOOK: multiply your gem ability cooldowns by this. */
                public double cooldownMultiplier(Player p) {
                    double m = 1;
                    for (Vow v : vows(p)) m *= v.cooldownMult;
                    return Math.max(0.1, m);
                }

                public Result grant(Player p, Vow v, boolean admin) {
                    Map<String, Long> m = active(p);
                    if (m.containsKey(v.id)) return Result.HAVE;
                    if (!admin && m.size() >= MAX_VOWS) return Result.MAX;
                    if (!admin && v.xpCost > 0) {
                        if (p.getLevel() < v.xpCost) return Result.XP;
                        p.setLevel(p.getLevel() - v.xpCost);
                    }
                    m.put(v.id, v.minutes > 0 ? System.currentTimeMillis() + v.minutes * 60_000L : 0L);
                    save(p, m);
                    refresh(p);
                    return Result.OK;
                }

                public void revoke(Player p, String id) {
                    Map<String, Long> m = active(p);
                    m.remove(id);
                    save(p, m);
                    refresh(p);
                }

                public void clear(Player p) { save(p, new LinkedHashMap<>()); refresh(p); }

                // ================= ATTRIBUTES / GLOW =================

                public void refresh(Player p) {
                    double hearts = 0, move = 0, aspd = 0, armor = 0, step = 0, reach = 0, kb = 0;
                    boolean glow = false;
                    for (Vow v : vows(p)) {
                        hearts += v.hearts; move += v.moveSpeed; aspd += v.attackSpeed; armor += v.armor;
                        step += v.stepHeight; reach += v.reach; kb += v.knockbackRes;
                        glow |= v.restrictions.contains(Vow.Restriction.GLOWING);
                    }
                    hearts = Math.max(hearts, -9); // never below 1 heart

                    for (Attribute a : new Attribute[]{Attribute.MAX_HEALTH, Attribute.MOVEMENT_SPEED, Attribute.ATTACK_SPEED,
                            Attribute.ARMOR, Attribute.STEP_HEIGHT, Attribute.ENTITY_INTERACTION_RANGE, Attribute.KNOCKBACK_RESISTANCE}) {
                        AttributeInstance inst = p.getAttribute(a);
                        if (inst == null) continue;
                        for (AttributeModifier mod : new ArrayList<>(inst.getModifiers()))
                            if (mod.getKey().getNamespace().equals(plugin.getName().toLowerCase(Locale.ROOT)) && mod.getKey().getKey().startsWith("vow_"))
                                inst.removeModifier(mod);
                    }
                    setMod(p, Attribute.MAX_HEALTH, "vow_hearts", hearts * 2, AttributeModifier.Operation.ADD_NUMBER);
                    setMod(p, Attribute.MOVEMENT_SPEED, "vow_move", move, AttributeModifier.Operation.ADD_SCALAR);
                    setMod(p, Attribute.ATTACK_SPEED, "vow_atkspeed", aspd, AttributeModifier.Operation.ADD_SCALAR);
                    setMod(p, Attribute.ARMOR, "vow_armor", armor, AttributeModifier.Operation.ADD_NUMBER);
                    setMod(p, Attribute.STEP_HEIGHT, "vow_step", step, AttributeModifier.Operation.ADD_NUMBER);
                    setMod(p, Attribute.ENTITY_INTERACTION_RANGE, "vow_reach", reach, AttributeModifier.Operation.ADD_NUMBER);
                    setMod(p, Attribute.KNOCKBACK_RESISTANCE, "vow_kb", kb, AttributeModifier.Operation.ADD_NUMBER);

                    AttributeInstance hp = p.getAttribute(Attribute.MAX_HEALTH);
                    if (hp != null && p.getHealth() > hp.getValue()) p.setHealth(hp.getValue());

                    // glow flag lives in PDC so it still clears after a restart
                    var pdc = p.getPersistentDataContainer();
                    if (glow) { p.setGlowing(true); pdc.set(KEY_GLOW, PersistentDataType.BYTE, (byte) 1); }
                    else if (pdc.has(KEY_GLOW, PersistentDataType.BYTE)) { pdc.remove(KEY_GLOW); p.setGlowing(false); }
                }

                private void setMod(Player p, Attribute a, String key, double amount, AttributeModifier.Operation op) {
                    if (amount == 0) return;
                    AttributeInstance inst = p.getAttribute(a);
                    if (inst != null) inst.addModifier(new AttributeModifier(new NamespacedKey(plugin, key), amount, op, EquipmentSlotGroup.ANY));
                }

                // ================= RESTRICTION ENFORCEMENT =================

                private void enforce(Player p, Set<Vow.Restriction> r) {
                    PlayerInventory inv = p.getInventory();
                    boolean stripped = false;
                    if (r.contains(Vow.Restriction.NO_HELMET)) stripped |= strip(p, inv.getHelmet(), inv::setHelmet);
                    if (r.contains(Vow.Restriction.NO_CHESTPLATE)) stripped |= strip(p, inv.getChestplate(), inv::setChestplate);
                    if (r.contains(Vow.Restriction.NO_LEGGINGS)) stripped |= strip(p, inv.getLeggings(), inv::setLeggings);
                    if (r.contains(Vow.Restriction.NO_BOOTS)) stripped |= strip(p, inv.getBoots(), inv::setBoots);
                    if (r.contains(Vow.Restriction.NO_OFFHAND)) stripped |= strip(p, inv.getItemInOffHand(), inv::setItemInOffHand);
                    if (r.contains(Vow.Restriction.NO_SPRINT) && p.isSprinting()) p.setSprinting(false);
                    if (stripped) p.sendActionBar(Component.text("your vow forbids that.", NamedTextColor.RED));
                }

                private boolean strip(Player p, ItemStack it, Consumer<ItemStack> setter) {
                    if (it == null || it.getType().isAir()) return false;
                    setter.accept(new ItemStack(Material.AIR));
                    p.getInventory().addItem(it).values().forEach(left -> p.getWorld().dropItemNaturally(p.getLocation(), left));
                    return true;
                }

                // ================= EVENTS =================

                @EventHandler public void onJoin(PlayerJoinEvent e) { Bukkit.getScheduler().runTask(plugin, () -> refresh(e.getPlayer())); }
                @EventHandler public void onRespawn(PlayerRespawnEvent e) { Bukkit.getScheduler().runTaskLater(plugin, () -> refresh(e.getPlayer()), 2L); }

                private static boolean isNight(org.bukkit.World w) { long t = w.getTime(); return t >= 13000 && t < 23000; }

                private static Player playerSource(Entity damager) {
                    if (damager instanceof Player p) return p;
                    if (damager instanceof Projectile pr && pr.getShooter() instanceof Player p) return p;
                    return null;
                }

                private static double maxHp(LivingEntity le) {
                    AttributeInstance i = le.getAttribute(Attribute.MAX_HEALTH);
                    return i == null ? 20 : i.getValue();
                }

                @EventHandler(priority = EventPriority.HIGH, ignoreCancelled = true)
                public void onDamage(EntityDamageEvent e) {
                    // damage TAKEN
                    if (e.getEntity() instanceof Player defender) {
                        Long im = immuneUntil.get(defender.getUniqueId());
                        if (im != null) {
                            if (System.currentTimeMillis() < im) { e.setCancelled(true); return; }
                            immuneUntil.remove(defender.getUniqueId());
                        }
                        List<Vow> vs = vows(defender);
                        if (!vs.isEmpty()) {
                            if (e.getCause() == EntityDamageEvent.DamageCause.FALL && vs.stream().anyMatch(v -> v.noFall)) { e.setCancelled(true); return; }
                            double m = 1;
                            for (Vow v : vs) m *= v.takenMult;
                            if (m != 1) e.setDamage(e.getDamage() * m);
                            if (hooks != null) {
                                for (Vow v : vs) {
                                    if (v.lastStand && defender.getHealth() + defender.getAbsorptionAmount() - e.getFinalDamage() <= 0) {
                                        e.setCancelled(true);
                                        hooks.onFinalBeat(defender, v);
                                        return;
                                    }
                                }
                            }
                        }
                    }
                    // damage DEALT
                    if (e instanceof EntityDamageByEntityEvent ee && ee.getEntity() instanceof LivingEntity target) {
                        Player attacker = playerSource(ee.getDamager());
                        if (attacker == null) return;
                        double m = 1;
                        for (Vow v : vows(attacker)) {
                            m *= v.dealtMult;
                            if (v.tide) m *= isNight(attacker.getWorld()) ? 1.3 : 0.8;
                            if (v.executeBonus > 0 && target.getHealth() / maxHp(target) < 0.3) m *= 1 + v.executeBonus;
                        }
                        if (m != 1) e.setDamage(e.getDamage() * m);
                    }
                }

                @EventHandler(priority = EventPriority.MONITOR, ignoreCancelled = true)
                public void onHitResolved(EntityDamageByEntityEvent e) {
                    double dealt = e.getFinalDamage();
                    if (dealt <= 0) return;
                    Player attacker = playerSource(e.getDamager());
                    if (attacker != null && !attacker.isDead()) {
                        double ls = 0;
                        for (Vow v : vows(attacker)) ls += v.lifesteal;
                        if (ls > 0) attacker.setHealth(Math.min(maxHp(attacker), attacker.getHealth() + dealt * ls));
                    }
                    if (e.getEntity() instanceof Player defender && e.getDamager() instanceof LivingEntity src) {
                        double rf = 0;
                        for (Vow v : vows(defender)) rf += v.reflect;
                        if (rf > 0) src.damage(dealt * rf); // no damager passed -> can't recurse
                    }
                }

                @EventHandler(ignoreCancelled = true)
                public void onRegain(EntityRegainHealthEvent e) {
                    if (!(e.getEntity() instanceof Player p)) return;
                    List<Vow> vs = vows(p);
                    if (vs.isEmpty()) return;
                    EntityRegainHealthEvent.RegainReason r = e.getRegainReason();
                    double m = 1;
                    for (Vow v : vs) {
                        if (v.restrictions.contains(Vow.Restriction.NO_NATURAL_REGEN)
                                && (r == EntityRegainHealthEvent.RegainReason.SATIATED || r == EntityRegainHealthEvent.RegainReason.REGEN)) {
                            e.setCancelled(true); return;
                        }
                        m *= v.healingMult;
                    }
                    if (m != 1) e.setAmount(e.getAmount() * m);
                }

                @EventHandler(ignoreCancelled = true)
                public void onFood(FoodLevelChangeEvent e) {
                    if (!(e.getEntity() instanceof Player p) || !has(p, Vow.Restriction.FAST_HUNGER)) return;
                    int drop = p.getFoodLevel() - e.getFoodLevel();
                    if (drop > 0) e.setFoodLevel(Math.max(0, p.getFoodLevel() - drop * 2));
                }

                @EventHandler(ignoreCancelled = true)
                public void onChat(AsyncChatEvent e) {
                    Player p = e.getPlayer();
                    if (!has(p, Vow.Restriction.NO_CHAT)) return;
                    e.setCancelled(true);
                    Bukkit.getScheduler().runTask(plugin, () -> p.sendActionBar(Component.text("your vow has taken your voice.", NamedTextColor.RED)));
                }

                @EventHandler(ignoreCancelled = true)
                public void onPlace(BlockPlaceEvent e) {
                    if (has(e.getPlayer(), Vow.Restriction.NO_BLOCK_PLACE)) e.setCancelled(true);
                }

                @EventHandler(ignoreCancelled = true)
                public void onConsume(PlayerItemConsumeEvent e) {
                    Material t = e.getItem().getType();
                    if ((t == Material.GOLDEN_APPLE || t == Material.ENCHANTED_GOLDEN_APPLE) && has(e.getPlayer(), Vow.Restriction.NO_GAPPLES)) {
                        e.setCancelled(true);
                        e.getPlayer().sendActionBar(Component.text("your hands are clean. keep them that way.", NamedTextColor.RED));
                    }
                }

                @EventHandler(ignoreCancelled = true)
                public void onBow(EntityShootBowEvent e) {
                    if (e.getEntity() instanceof Player p && has(p, Vow.Restriction.NO_RANGED)) e.setCancelled(true);
                }

                @EventHandler(ignoreCancelled = true)
                public void onTrident(ProjectileLaunchEvent e) {
                    if (e.getEntity() instanceof Trident t && t.getShooter() instanceof Player p && has(p, Vow.Restriction.NO_RANGED)) e.setCancelled(true);
                }

                @EventHandler(ignoreCancelled = true)
                public void onTeleport(PlayerTeleportEvent e) {
                    PlayerTeleportEvent.TeleportCause c = e.getCause();
                    if ((c == PlayerTeleportEvent.TeleportCause.ENDER_PEARL || c == PlayerTeleportEvent.TeleportCause.CHORUS_FRUIT)
                            && has(e.getPlayer(), Vow.Restriction.NO_PEARLS)) e.setCancelled(true);
                }

                @EventHandler(ignoreCancelled = true)
                public void onTotem(EntityResurrectEvent e) {
                    if (e.getEntity() instanceof Player p && has(p, Vow.Restriction.NO_TOTEM)) e.setCancelled(true);
                }

                @EventHandler(ignoreCancelled = true)
                public void onBed(PlayerBedEnterEvent e) {
                    if (has(e.getPlayer(), Vow.Restriction.NO_SLEEP)) {
                        e.setCancelled(true);
                        e.getPlayer().sendActionBar(Component.text("you are an exile. you do not sleep.", NamedTextColor.RED));
                    }
                }

                @EventHandler(ignoreCancelled = true)
                public void onSprint(PlayerToggleSprintEvent e) {
                    if (e.isSprinting() && has(e.getPlayer(), Vow.Restriction.NO_SPRINT)) e.setCancelled(true);
                }

                @EventHandler
                public void onDeath(PlayerDeathEvent e) {
                    if (vows(e.getEntity()).stream().anyMatch(v -> v.keepInventory)) {
                        e.setKeepInventory(true);
                        e.getDrops().clear();
                        e.setKeepLevel(true);
                        e.setDroppedExp(0);
                    }
                }
            }
            EOF_JAVA

      - name: Create WispCommand.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/WispCommand.java)
            cat > src/main/java/me/lofi/wisps/WispCommand.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import org.bukkit.Bukkit;
            import org.bukkit.Sound;
            import org.bukkit.command.*;
            import org.bukkit.entity.Player;

            import java.util.*;

            /** /wisp ... see the usage text below. */
            public final class WispCommand implements TabExecutor {

                private static final List<String> SUBS = List.of("offer", "prophet", "hourglass", "awaken", "endawaken", "skip",
                        "cancel", "lock", "shake", "tracking", "list", "reload");

                private final WispsPlugin plugin;
                private final WispManager wisps;
                private final AwakeningManager awakenings;
                private final TrackingManager tracking;

                public WispCommand(WispsPlugin plugin, WispManager wisps, AwakeningManager awakenings, TrackingManager tracking) {
                    this.plugin = plugin; this.wisps = wisps; this.awakenings = awakenings; this.tracking = tracking;
                }

                private static void msg(CommandSender s, String t, NamedTextColor c) { s.sendMessage(Component.text(t, c)); }

                /** A player name, "all", or (when omitted) the sender. */
                private static List<Player> targets(CommandSender s, String[] a, int idx) {
                    if (a.length > idx) {
                        if (a[idx].equalsIgnoreCase("all") || a[idx].equals("*")) return new ArrayList<>(Bukkit.getOnlinePlayers());
                        Player p = Bukkit.getPlayerExact(a[idx]);
                        return p == null ? List.of() : List.of(p);
                    }
                    return s instanceof Player p ? List.of(p) : List.of();
                }

                private static void usage(CommandSender s) {
                    msg(s, "/wisp offer <manifestation|balance|prophet> [player] [broken]", NamedTextColor.GRAY);
                    msg(s, "/wisp prophet [player|all]        the Prophet's speech and Assessment", NamedTextColor.GRAY);
                    msg(s, "/wisp hourglass [player|all] [seconds]", NamedTextColor.GRAY);
                    msg(s, "/wisp awaken <adrenaline|heretic|auratus> [player]", NamedTextColor.GRAY);
                    msg(s, "/wisp endawaken [player]          end an awakening early (Burnout)", NamedTextColor.GRAY);
                    msg(s, "/wisp skip [player]               skip the dialogue, go to the offers", NamedTextColor.GRAY);
                    msg(s, "/wisp cancel [player|all]", NamedTextColor.GRAY);
                    msg(s, "/wisp lock on|off|status          camera pull toward the wisp", NamedTextColor.GRAY);
                    msg(s, "/wisp shake <player> [strength] [seconds]", NamedTextColor.GRAY);
                    msg(s, "/wisp tracking on|off|status", NamedTextColor.GRAY);
                    msg(s, "/wisp list | reload", NamedTextColor.GRAY);
                }

                @Override
                public boolean onCommand(CommandSender s, Command cmd, String label, String[] a) {
                    String sub = a.length == 0 ? "" : a[0].toLowerCase(Locale.ROOT);
                    switch (sub) {
                        case "offer" -> {
                            WispType type = a.length > 1 ? WispType.parse(a[1]) : null;
                            if (type == null) { msg(s, "/wisp offer <manifestation|balance|prophet> [player] [broken]", NamedTextColor.GRAY); return true; }
                            List<Player> t = targets(s, a, 2);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            boolean broken = a.length > 3 && a[3].equalsIgnoreCase("broken");
                            for (Player p : t) if (!wisps.offer(p, type, broken)) msg(s, p.getName() + " is already in a scene.", NamedTextColor.RED);
                        }
                        case "prophet" -> {
                            List<Player> t = targets(s, a, 1);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            boolean everyone = a.length > 1 && (a[1].equalsIgnoreCase("all") || a[1].equals("*"));
                            if (everyone) {
                                Bukkit.broadcast(Component.empty());
                                Bukkit.broadcast(Component.text("\u29D6 The Prophet has appeared. The Assessment is upon you.", WispType.PROPHET.color, TextDecoration.BOLD));
                                Bukkit.broadcast(Component.empty());
                                for (Player p : Bukkit.getOnlinePlayers()) p.playSound(p.getLocation(), Sound.BLOCK_BELL_RESONATE, 1.2f, 0.5f);
                            }
                            for (Player p : t) wisps.offer(p, WispType.PROPHET, false);
                        }
                        case "hourglass" -> {
                            List<Player> t = targets(s, a, 1);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            int secs = 15;
                            if (a.length > 2) try { secs = Math.max(1, Math.min(300, Integer.parseInt(a[2]))); } catch (NumberFormatException ignored) {}
                            for (Player p : t) wisps.hourglass(p, secs);
                        }
                        case "awaken" -> {
                            Vow v = a.length > 1 ? Vow.awakeningFor(a[1]) : null;
                            if (v == null) { msg(s, "/wisp awaken <adrenaline|heretic|auratus> [player]  (skips the gem check, for testing)", NamedTextColor.GRAY); return true; }
                            List<Player> t = targets(s, a, 2);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            for (Player p : t) if (!awakenings.begin(p, v)) msg(s, "Could not start for " + p.getName() + " (already in a scene?).", NamedTextColor.RED);
                        }
                        case "endawaken" -> {
                            List<Player> t = targets(s, a, 1);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            for (Player p : t) msg(s, awakenings.endAwakening(p) ? "Ended " + p.getName() + "'s awakening." : p.getName() + " isn't awakened.", NamedTextColor.GRAY);
                        }
                        case "skip" -> {
                            List<Player> t = targets(s, a, 1);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            for (Player p : t) msg(s, wisps.skip(p) ? "Skipped." : p.getName() + " isn't in the dialogue.", NamedTextColor.GRAY);
                        }
                        case "cancel" -> {
                            List<Player> t = targets(s, a, 1);
                            if (t.isEmpty()) { msg(s, "Player not found.", NamedTextColor.RED); return true; }
                            int n = 0;
                            for (Player p : t) if (wisps.cancel(p)) n++;
                            msg(s, n > 0 ? "Cancelled " + n + " scene(s)." : "No wisp scene running.", NamedTextColor.GRAY);
                        }
                        case "lock" -> {
                            String arg = a.length > 1 ? a[1].toLowerCase(Locale.ROOT) : "status";
                            if (arg.equals("on")) wisps.setLock(true);
                            else if (arg.equals("off")) wisps.setLock(false);
                            msg(s, "Camera lock is " + (wisps.lockEnabled() ? "ON" : "OFF") + ".  (/wisp lock on|off)", NamedTextColor.GRAY);
                        }
                        case "shake" -> {
                            Player p = a.length > 1 ? Bukkit.getPlayerExact(a[1]) : (s instanceof Player me ? me : null);
                            if (p == null) { msg(s, "/wisp shake <player> [strength] [seconds]", NamedTextColor.GRAY); return true; }
                            double str = 2.0; int secs = 2;
                            try { if (a.length > 2) str = Math.max(0.1, Math.min(10, Double.parseDouble(a[2]))); } catch (NumberFormatException ignored) {}
                            try { if (a.length > 3) secs = Math.max(1, Math.min(30, Integer.parseInt(a[3]))); } catch (NumberFormatException ignored) {}
                            CameraFx.shake(p, str, secs * 20);
                        }
                        case "tracking" -> {
                            String arg = a.length > 1 ? a[1].toLowerCase(Locale.ROOT) : "status";
                            if (arg.equals("on")) tracking.setEnabled(true);
                            else if (arg.equals("off")) tracking.setEnabled(false);
                            msg(s, "Tracking is " + (tracking.enabled() ? "ON" : "OFF") + ".  (/wisp tracking on|off)", NamedTextColor.GRAY);
                        }
                        case "list" -> {
                            List<String> d = wisps.describe();
                            if (d.isEmpty()) msg(s, "No wisp scenes running.", NamedTextColor.GRAY);
                            else for (String line : d) msg(s, line, NamedTextColor.GRAY);
                        }
                        case "reload" -> { plugin.reloadConfig(); msg(s, "Wisps config reloaded.", NamedTextColor.GREEN); }
                        default -> usage(s);
                    }
                    return true;
                }

                @Override
                public List<String> onTabComplete(CommandSender s, Command c, String l, String[] a) {
                    List<String> out = new ArrayList<>();
                    String sub = a.length > 0 ? a[0].toLowerCase(Locale.ROOT) : "";
                    if (a.length == 1) out.addAll(SUBS);
                    else if (a.length == 2 && sub.equals("offer")) out.addAll(List.of("manifestation", "balance", "prophet"));
                    else if (a.length == 2 && sub.equals("awaken")) for (Vow v : Vow.awakenings()) out.add(v.gem);
                    else if (a.length == 2 && (sub.equals("tracking") || sub.equals("lock"))) out.addAll(List.of("on", "off", "status"));
                    else if (a.length == 2 && Set.of("prophet", "hourglass", "endawaken", "skip", "cancel", "shake").contains(sub)) {
                        out.add("all");
                        Bukkit.getOnlinePlayers().forEach(p -> out.add(p.getName()));
                    } else if (a.length == 3 && Set.of("offer", "awaken").contains(sub)) Bukkit.getOnlinePlayers().forEach(p -> out.add(p.getName()));
                    else if (a.length == 4 && sub.equals("offer")) out.add("broken");
                    String last = a[a.length - 1].toLowerCase(Locale.ROOT);
                    return out.stream().filter(x -> x.toLowerCase(Locale.ROOT).startsWith(last)).toList();
                }
            }
            EOF_JAVA

      - name: Create WispForms.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/WispForms.java)
            cat > src/main/java/me/lofi/wisps/WispForms.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import org.bukkit.Color;
            import org.bukkit.Location;
            import org.bukkit.Particle;
            import org.bukkit.entity.Player;
            import org.bukkit.util.Vector;

            import java.util.concurrent.ThreadLocalRandom;

            /** Particle bodies of the wisps, drawn only for the player being spoken to. Built to be read from ~25 blocks away. */
            final class WispForms {

                private WispForms() {}

                private static final Color CORE = Color.fromRGB(8, 14, 18), TEAL = Color.fromRGB(34, 110, 120),
                        GLOW = Color.fromRGB(110, 235, 245), PURPLE = Color.fromRGB(165, 80, 225),
                        BLUE = Color.fromRGB(80, 140, 235), GOLD = Color.fromRGB(255, 214, 80),
                        WHITE = Color.fromRGB(255, 255, 255), SILVER = Color.fromRGB(222, 218, 208),
                        ORANGE = Color.fromRGB(255, 150, 40), GREEN = Color.fromRGB(60, 220, 100),
                        CYAN = Color.fromRGB(60, 220, 240), PINK = Color.fromRGB(255, 100, 200),
                        VOID = Color.fromRGB(14, 10, 30), VIOLET = Color.fromRGB(140, 90, 255);

                private static final Color[] SPECKS = {PURPLE, ORANGE, GREEN, CYAN, PINK, GOLD};

                static void render(Player p, WispType type, Location c, Vector r, Vector u, Vector n, double scale, long t) {
                    if (scale <= 0.05) return;
                    switch (type) {
                        case MANIFESTATION -> manifestation(p, c, r, u, n, scale, t);
                        case BALANCE -> balance(p, c, r, u, n, scale, t);
                        case PROPHET -> prophet(p, c, r, u, n, scale, t);
                    }
                }

                /** Dark spiral galaxy: black core, teal-lit arms, purple / blue / gold specks. */
                private static void manifestation(Player p, Location c, Vector r, Vector u, Vector n, double scale, long t) {
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();
                    double R = 1.8 * scale, spin = t * 0.04;
                    for (int arm = 0; arm < 3; arm++) {
                        for (int i = 0; i < 44; i++) {
                            double f = (i + 1) / 44.0;
                            double a = arm * 2.0944 + f * 3.4 + spin;
                            double rad = R * (0.08 + 0.92 * f);
                            double x = Math.cos(a) * rad, y = Math.sin(a) * rad;
                            dust(p, c, r, u, n, x, y, 0, mix(CORE, TEAL, f * f), (float) (2.6 - 1.3 * f));
                            if (i % 4 == 0)
                                dust(p, c, r, u, n, x + rnd.nextDouble(-0.2, 0.2), y + rnd.nextDouble(-0.2, 0.2), rnd.nextDouble(-0.3, 0.3), GLOW, 1.0f);
                        }
                    }
                    for (int i = 0; i < 18; i++) {
                        double a = rnd.nextDouble(6.283), rad = R * 0.2 * Math.sqrt(rnd.nextDouble());
                        dust(p, c, r, u, n, Math.cos(a) * rad, Math.sin(a) * rad, rnd.nextDouble(-0.3, 0.3), CORE, 3.4f);
                    }
                    Color[] specks = {PURPLE, BLUE, GOLD};
                    for (int i = 0; i < 14; i++) {
                        double a = rnd.nextDouble(6.283), rad = R * (0.6 + rnd.nextDouble() * 0.7);
                        dust(p, c, r, u, n, Math.cos(a) * rad, Math.sin(a) * rad, rnd.nextDouble(-0.5, 0.5), specks[i % 3], 1.1f);
                    }
                }

                /** White rosette: eight overlapping petals inside a double ring. */
                private static void balance(Player p, Location c, Vector r, Vector u, Vector n, double scale, long t) {
                    double R = 1.6 * scale, rot = t * 0.02;
                    for (int i = 0; i < 72; i++) {
                        double a = i * Math.PI * 2 / 72 + rot;
                        dust(p, c, r, u, n, Math.cos(a) * R, Math.sin(a) * R, 0, WHITE, 1.5f);
                        dust(p, c, r, u, n, Math.cos(a) * R * 0.92, Math.sin(a) * R * 0.92, 0, SILVER, 1.0f);
                    }
                    for (int k = 0; k < 8; k++) {
                        double pa = rot + k * Math.PI / 4;
                        double cx = Math.cos(pa) * R * 0.5, cy = Math.sin(pa) * R * 0.5;
                        for (int j = 0; j < 22; j++) {
                            double a = j * Math.PI * 2 / 22;
                            dust(p, c, r, u, n, cx + Math.cos(a) * R * 0.5, cy + Math.sin(a) * R * 0.5, 0, WHITE, 1.2f);
                        }
                    }
                    p.spawnParticle(Particle.END_ROD, c, 2, 0.3, 0.3, 0.3, 0);
                }

                /** Three tilted orbit rings of white sparks, a spinning pinwheel of crescents, and coloured specks. */
                private static void prophet(Player p, Location c, Vector r, Vector u, Vector n, double scale, long t) {
                    ThreadLocalRandom rnd = ThreadLocalRandom.current();
                    double R = 2.0 * scale;
                    double tilt = 1.15 + 0.15 * Math.sin(t * 0.02);
                    for (int k = 0; k < 3; k++) {
                        double phi = k * Math.PI / 3 + t * 0.012;
                        for (int i = 0; i < 72; i++) {
                            double th = i * Math.PI * 2 / 72;
                            Vector q = orbit(th, tilt, phi);
                            Location l = at(c, r, u, n, q.getX() * R, q.getY() * R, q.getZ() * R);
                            p.spawnParticle(Particle.END_ROD, l, 1, 0, 0, 0, 0);
                            if (i % 2 == 0) p.spawnParticle(Particle.DUST, l, 1, 0, 0, 0, 0, new Particle.DustOptions(WHITE, 1.4f));
                        }
                        for (int i = 0; i < 9; i++) {
                            Vector q = orbit(rnd.nextDouble(6.283), tilt, phi);
                            Location l = at(c, r, u, n, q.getX() * R, q.getY() * R, q.getZ() * R);
                            l.add(rnd.nextDouble(-0.3, 0.3), rnd.nextDouble(-0.3, 0.3), rnd.nextDouble(-0.3, 0.3));
                            p.spawnParticle(Particle.DUST, l, 1, 0, 0, 0, 0, new Particle.DustOptions(SPECKS[rnd.nextInt(SPECKS.length)], 1.2f));
                        }
                    }
                    double spin = -t * 0.05;
                    for (int k = 0; k < 6; k++) {
                        for (int j = 0; j < 14; j++) {
                            double f = j / 13.0;
                            double a = k * Math.PI / 3 + spin + f * 1.1;
                            double rad = R * (0.07 + 0.21 * f);
                            dust(p, c, r, u, n, Math.cos(a) * rad, Math.sin(a) * rad, 0, WHITE, (float) (2.2 - 1.0 * f));
                            if (j % 4 == 0) p.spawnParticle(Particle.END_ROD, at(c, r, u, n, Math.cos(a) * rad, Math.sin(a) * rad, 0), 1, 0, 0, 0, 0);
                        }
                    }
                    p.spawnParticle(Particle.END_ROD, c, 3, 0.2, 0.2, 0.2, 0);
                }

                /** A point on a unit circle, tilted and then turned about the view axis. */
                private static Vector orbit(double th, double tilt, double phi) {
                    double x = Math.cos(th), y = Math.sin(th) * Math.cos(tilt), z = Math.sin(th) * Math.sin(tilt);
                    return new Vector(x * Math.cos(phi) - y * Math.sin(phi), x * Math.sin(phi) + y * Math.cos(phi), z);
                }

                /** The Prophet's hourglass: two bars joined by a cross, with sand falling through the middle. */
                static void hourglass(Player p, Location c, Vector r, Vector u, Vector n, double s, long t) {
                    double w = 1.0 * s, h = 1.6 * s;
                    seg(p, c, r, u, n, -w, h, w, h, 22);
                    seg(p, c, r, u, n, -w, -h, w, -h, 22);
                    seg(p, c, r, u, n, -w, h, w, -h, 36);
                    seg(p, c, r, u, n, w, h, -w, -h, 36);
                    for (int i = 0; i < 6; i++) {
                        double fall = ((t * 0.05) + i / 6.0) % 1.0;
                        dust(p, c, r, u, n, 0, -fall * h * 0.9, 0, GOLD, 1.3f);
                    }
                    p.spawnParticle(Particle.END_ROD, at(c, r, u, n, 0, 0, 0), 2, 0.2, 0.2, 0.2, 0);
                }

                private static void seg(Player p, Location c, Vector r, Vector u, Vector n, double x1, double y1, double x2, double y2, int steps) {
                    for (int i = 0; i <= steps; i++) {
                        double f = i / (double) steps;
                        double x = x1 + (x2 - x1) * f, y = y1 + (y2 - y1) * f;
                        dust(p, c, r, u, n, x, y, 0, i % 3 == 0 ? VIOLET : VOID, i % 3 == 0 ? 1.0f : 2.6f);
                    }
                }

                private static Location at(Location c, Vector r, Vector u, Vector n, double x, double y, double z) {
                    return new Location(c.getWorld(),
                            c.getX() + r.getX() * x + u.getX() * y + n.getX() * z,
                            c.getY() + r.getY() * x + u.getY() * y + n.getY() * z,
                            c.getZ() + r.getZ() * x + u.getZ() * y + n.getZ() * z);
                }

                private static void dust(Player p, Location c, Vector r, Vector u, Vector n, double x, double y, double z, Color col, float size) {
                    p.spawnParticle(Particle.DUST, at(c, r, u, n, x, y, z), 1, 0, 0, 0, 0, new Particle.DustOptions(col, Math.max(0.1f, Math.min(4f, size))));
                }

                private static Color mix(Color a, Color b, double t) {
                    return Color.fromRGB(
                            (int) (a.getRed() + (b.getRed() - a.getRed()) * t),
                            (int) (a.getGreen() + (b.getGreen() - a.getGreen()) * t),
                            (int) (a.getBlue() + (b.getBlue() - a.getBlue()) * t));
                }
            }
            EOF_JAVA

      - name: Create WispManager.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/WispManager.java)
            cat > src/main/java/me/lofi/wisps/WispManager.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import io.papermc.paper.event.player.AsyncChatEvent;
            import net.kyori.adventure.text.Component;
            import net.kyori.adventure.text.format.NamedTextColor;
            import net.kyori.adventure.text.format.TextColor;
            import net.kyori.adventure.text.format.TextDecoration;
            import net.kyori.adventure.text.serializer.plain.PlainTextComponentSerializer;
            import net.kyori.adventure.title.Title;
            import org.bukkit.Bukkit;
            import org.bukkit.Location;
            import org.bukkit.Particle;
            import org.bukkit.Sound;
            import org.bukkit.entity.Player;
            import org.bukkit.event.EventHandler;
            import org.bukkit.event.EventPriority;
            import org.bukkit.event.Listener;
            import org.bukkit.event.entity.PlayerDeathEvent;
            import org.bukkit.event.player.PlayerQuitEvent;
            import org.bukkit.util.Vector;

            import java.time.Duration;
            import java.util.*;
            import java.util.concurrent.ConcurrentHashMap;
            import java.util.concurrent.ThreadLocalRandom;

            /**
             * The wisp scene. The wisp hangs in the sky as a particle body, your camera is drawn up to it
             * (and shakes if you fight it), it speaks on your hotbar, lists its offers in chat, and you answer by
             * typing in chat (a number, a name, "accept", or "cancel").
             */
            public final class WispManager implements Listener {

                private enum State { FADE_IN, SPEAK, ASK, FADE_OUT }

                private static final class Session {
                    final Player p;
                    final WispType type;
                    final boolean broken;
                    volatile State state = State.FADE_IN;
                    int t;
                    double scale;
                    Location pos;
                    Vector offset = new Vector(0, 15, 18);
                    boolean hourglass, speechOnly;
                    List<String> lines;
                    final List<Vow> offers = new ArrayList<>();
                    Session(Player p, WispType type, boolean broken) { this.p = p; this.type = type; this.broken = broken; }
                }

                private static final class Hourglass {
                    final Vector offset;
                    int left;
                    Hourglass(Vector offset, int left) { this.offset = offset; this.left = left; }
                }

                private static final Set<String> CANCEL = Set.of("cancel", "refuse", "no", "nope", "leave", "stop",
                        "decline", "exit", "nevermind", "never mind", "nothing");
                private static final Set<String> ACCEPT = Set.of("accept", "yes", "y", "ok", "okay", "sure", "do it", "i accept");
                private static final TextColor GOLD = TextColor.color(0xFFD24A);

                private final WispsPlugin plugin;
                private final VowManager vows;
                private final AwakeningManager awaken;
                private final GemBridge bridge;
                private final Map<UUID, Session> sessions = new ConcurrentHashMap<>();
                private final Map<UUID, Hourglass> hourglasses = new HashMap<>();
                private final Random rng = new Random();
                private long tick;

                public WispManager(WispsPlugin plugin, VowManager vows, AwakeningManager awaken, GemBridge bridge) {
                    this.plugin = plugin; this.vows = vows; this.awaken = awaken; this.bridge = bridge;
                }

                public void start() {
                    Bukkit.getPluginManager().registerEvents(this, plugin);
                    Bukkit.getScheduler().runTaskTimer(plugin, this::tickAll, 1L, 1L);
                }

                public void shutdown() { sessions.clear(); hourglasses.clear(); }

                // ================= API =================

                /** @param broken true = "your gem is broken" intro, false = the shorter offer intro (ignored by the Prophet) */
                public boolean offer(Player p, WispType type, boolean broken) { return offer(p, type, broken, false); }

                /** @param speechOnly the Prophet gives his speech and the Assessment title, but no variable is offered */
                public boolean offer(Player p, WispType type, boolean broken, boolean speechOnly) {
                    if (sessions.containsKey(p.getUniqueId()) || awaken.isBusy(p)) return false;
                    Session s = new Session(p, type, broken);
                    s.speechOnly = speechOnly;
                    s.lines = broken ? type.brokenGemLines : type.offerLines;
                    s.offset = skyOffset(p, type == WispType.PROPHET ? 21 : 18, type == WispType.PROPHET ? 17 : 15);
                    sessions.put(p.getUniqueId(), s);
                    return true;
                }

                public boolean cancel(Player p) { return sessions.remove(p.getUniqueId()) != null; }

                /** Jumps from the dialogue straight to the offers. */
                public boolean skip(Player p) {
                    Session s = sessions.get(p.getUniqueId());
                    if (s == null || s.state != State.SPEAK) return false;
                    enterAsk(s);
                    return true;
                }

                /** Draws the Prophet's hourglass in the sky for a while. */
                public void hourglass(Player p, int seconds) {
                    hourglasses.put(p.getUniqueId(), new Hourglass(skyOffset(p, 16, 12), seconds * 20));
                    p.playSound(p.getLocation(), Sound.BLOCK_BELL_RESONATE, 1.0f, 0.5f);
                }

                public boolean lockEnabled() { return plugin.getConfig().getBoolean("look-lock", true); }

                public void setLock(boolean on) { plugin.getConfig().set("look-lock", on); plugin.saveConfig(); }

                public List<String> describe() {
                    List<String> out = new ArrayList<>();
                    for (Session s : sessions.values())
                        out.add(s.p.getName() + " \u2014 " + s.type.displayName + " (" + s.state.name().toLowerCase(Locale.ROOT) + ")");
                    for (UUID id : hourglasses.keySet()) {
                        Player p = Bukkit.getPlayer(id);
                        if (p != null) out.add(p.getName() + " \u2014 hourglass");
                    }
                    return out;
                }

                private static Vector skyOffset(Player p, double forward, double height) {
                    Vector f = p.getLocation().getDirection().setY(0);
                    if (f.lengthSquared() < 1e-6) f = new Vector(0, 0, 1);
                    return f.normalize().multiply(forward).setY(height);
                }

                // ================= LOOP =================

                private void tickAll() {
                    tick++;
                    for (Session s : new ArrayList<>(sessions.values())) {
                        Player p = s.p;
                        if (!p.isOnline() || p.isDead()) { sessions.remove(p.getUniqueId()); continue; }
                        s.pos = p.getLocation().add(s.offset).add(0, Math.sin(tick * 0.04) * 0.6, 0);
                        s.t++;
                        double sizeMul = s.type == WispType.PROPHET ? 3.2 : 3.0;
                        if (s.state == State.FADE_IN) {
                            s.scale = Math.min(1.0, s.t / 30.0) * sizeMul;
                            if (s.t == 1) intro(s);
                            if (s.t >= 30) { s.state = State.SPEAK; s.t = 0; }
                        } else if (s.state == State.SPEAK) {
                            s.scale = sizeMul;
                            speak(s);
                        } else if (s.state == State.ASK) {
                            s.scale = sizeMul;
                            ask(s);
                        } else {
                            s.scale = Math.max(0.0, 1.0 - s.t / 18.0) * sizeMul;
                            if (s.t >= 18) { sessions.remove(p.getUniqueId()); continue; }
                        }
                        if (s.state != State.FADE_OUT && lockEnabled()) lookLock(s);
                        if (tick % 2 == 0) render(s);
                    }
                    for (Iterator<Map.Entry<UUID, Hourglass>> it = hourglasses.entrySet().iterator(); it.hasNext(); ) {
                        Map.Entry<UUID, Hourglass> en = it.next();
                        Player p = Bukkit.getPlayer(en.getKey());
                        Hourglass h = en.getValue();
                        if (p == null || --h.left <= 0) { it.remove(); continue; }
                        if (tick % 2 == 0) {
                            Location pos = p.getLocation().add(h.offset).add(0, Math.sin(tick * 0.04) * 0.5, 0);
                            Vector n = p.getEyeLocation().toVector().subtract(pos.toVector()).normalize();
                            Vector right = new Vector(n.getZ(), 0, -n.getX());
                            if (right.lengthSquared() < 1e-6) right = new Vector(1, 0, 0);
                            right.normalize();
                            Vector up = n.clone().crossProduct(right).normalize();
                            WispForms.hourglass(p, pos, right, up, n, 3.4, tick);
                        }
                        if (h.left % 60 == 0) p.playSound(p.getLocation(), Sound.BLOCK_BELL_USE, 0.6f, 0.5f);
                    }
                }

                private void render(Session s) {
                    Player p = s.p;
                    Vector n = p.getEyeLocation().toVector().subtract(s.pos.toVector());
                    if (n.lengthSquared() < 1e-6) return;
                    n.normalize();
                    Vector right = new Vector(n.getZ(), 0, -n.getX());
                    if (right.lengthSquared() < 1e-6) right = new Vector(1, 0, 0);
                    right.normalize();
                    Vector up = n.clone().crossProduct(right).normalize();
                    WispForms.render(p, s.type, s.pos, right, up, n, s.scale, tick);
                    if (s.hourglass) {
                        Location hg = s.pos.clone().subtract(up.clone().multiply(s.scale * 3.6));
                        WispForms.hourglass(p, hg, right, up, n, s.scale * 0.8, tick);
                    }
                }

                // ---- the camera: pulled up to the wisp, shaken if you fight it ----
                private void lookLock(Session s) {
                    Player p = s.p;
                    Location eye = p.getEyeLocation();
                    Vector to = s.pos.toVector().subtract(eye.toVector());
                    double hd = Math.sqrt(to.getX() * to.getX() + to.getZ() * to.getZ());
                    if (hd < 1e-6 && Math.abs(to.getY()) < 1e-6) return;
                    double yawT = Math.toDegrees(Math.atan2(-to.getX(), to.getZ()));
                    double pitchT = -Math.toDegrees(Math.atan2(to.getY(), hd));
                    double yaw = eye.getYaw(), pitch = eye.getPitch();
                    double dy = wrap(yawT - yaw), dp = pitchT - pitch;
                    double off = Math.hypot(dy, dp);

                    double pull;
                    boolean resisting = false;
                    if (s.state == State.FADE_IN) pull = 0.10 + s.t * 0.006;   // swing up and take it in
                    else if (off > 10) { pull = 0.30; resisting = true; }       // you're looking away: yanked back
                    else pull = 0.08;                                           // keeps you centred, gently

                    double ny = yaw + dy * pull, np = pitch + dp * pull;
                    if (resisting) {
                        ThreadLocalRandom rnd = ThreadLocalRandom.current();
                        double m = Math.min(1.6, 0.4 + off * 0.03);
                        ny += rnd.nextDouble(-m, m);
                        np += rnd.nextDouble(-m, m) * 0.7;
                        if (s.t % 12 == 0) p.playSound(p.getLocation(), Sound.ENTITY_WARDEN_HEARTBEAT, 0.6f, 0.5f);
                    }
                    p.setRotation((float) ny, (float) Math.max(-89.0, Math.min(89.0, np)));
                }

                private static double wrap(double a) {
                    a %= 360;
                    if (a > 180) a -= 360;
                    if (a < -180) a += 360;
                    return a;
                }

                private float pitch(Session s) {
                    return s.type == WispType.MANIFESTATION ? 0.6f : s.type == WispType.PROPHET ? 0.5f : 1.3f;
                }

                private void intro(Session s) {
                    Player p = s.p;
                    p.playSound(p.getLocation(), Sound.BLOCK_BEACON_ACTIVATE, 0.5f, pitch(s) + 0.4f);
                    if (s.type == WispType.PROPHET) {
                        p.playSound(p.getLocation(), Sound.ENTITY_ENDER_DRAGON_GROWL, 0.5f, 0.6f);
                        p.playSound(p.getLocation(), Sound.BLOCK_BELL_RESONATE, 1.0f, 0.5f);
                        p.showTitle(Title.title(
                                Component.text("THE PROPHET", s.type.color, TextDecoration.BOLD),
                                Component.text("has appeared", NamedTextColor.GRAY),
                                Title.Times.times(Duration.ofMillis(500), Duration.ofMillis(2500), Duration.ofMillis(800))));
                    } else {
                        p.playSound(p.getLocation(), Sound.BLOCK_AMETHYST_BLOCK_CHIME, 1.2f, pitch(s));
                    }
                }

                // ---- dialogue on the hotbar ----
                private void speak(Session s) {
                    boolean prophet = s.type == WispType.PROPHET;
                    int lineTicks = Math.max(20, plugin.getConfig().getInt(prophet ? "prophet-line-ticks" : "line-ticks", prophet ? 44 : 52));
                    int st = s.t - 1;
                    int idx = st / lineTicks, in = st % lineTicks;
                    if (idx >= s.lines.size()) { enterAsk(s); return; }
                    if (in == 0) {
                        if (prophet) s.p.playSound(s.p.getLocation(), Sound.BLOCK_BELL_USE, 0.7f, 0.5f);
                        else s.p.playSound(s.p.getLocation(), Sound.BLOCK_AMETHYST_BLOCK_CHIME, 1.0f, pitch(s) + idx * 0.12f);
                        if (prophet && idx >= s.lines.size() - 2) s.hourglass = true; // the symbol appears as the Assessment begins
                    }
                    if (in == 0 || in % 18 == 0) {
                        Component line = prophet ? Component.text(s.lines.get(idx), s.type.color, TextDecoration.BOLD)
                                                 : Component.text(s.lines.get(idx), s.type.color);
                        s.p.sendActionBar(line);
                    }
                }

                private void enterAsk(Session s) {
                    if (s.type == WispType.PROPHET) {
                        s.hourglass = true;
                        s.p.showTitle(Title.title(
                                Component.text("THE ASSESSMENT", s.type.color, TextDecoration.BOLD),
                                Component.text("has begun", NamedTextColor.GRAY),
                                Title.Times.times(Duration.ofMillis(300), Duration.ofMillis(3000), Duration.ofMillis(900))));
                        s.p.playSound(s.p.getLocation(), Sound.ENTITY_WARDEN_HEARTBEAT, 1.5f, 0.5f);
                        if (s.speechOnly || !plugin.getConfig().getBoolean("prophet-offer-variable", true)) {
                            s.state = State.FADE_OUT; s.t = 0;
                            return;
                        }
                    }
                    buildOffers(s);
                    if (s.offers.isEmpty()) {
                        s.p.sendActionBar(Component.text(s.type == WispType.PROPHET ? "You hold all you can." : "your hands are full. there is nothing left to give.", s.type.color));
                        s.state = State.FADE_OUT; s.t = 0;
                        return;
                    }
                    s.state = State.ASK; s.t = 0;
                    showOptions(s);
                }

                private void ask(Session s) {
                    int timeout = plugin.getConfig().getInt("reply-timeout-seconds", 90);
                    if (s.t % 20 == 1) {
                        String hint = s.offers.size() == 1 ? "answer in chat: accept  \u00B7  or cancel"
                                                            : "answer in chat: 1-" + s.offers.size() + "  \u00B7  or type cancel";
                        s.p.sendActionBar(Component.text(hint, s.type.color));
                    }
                    if (s.t > timeout * 20) refuse(s);
                }

                private void buildOffers(Session s) {
                    Player p = s.p;
                    boolean prophet = s.type == WispType.PROPHET;
                    Set<String> have = vows.active(p).keySet();
                    List<Vow> pool = new ArrayList<>();
                    if (vows.count(p) < VowManager.MAX_VOWS) {
                        List<Vow.Giver> givers = prophet ? List.of(Vow.Giver.MANIFESTATION, Vow.Giver.BALANCE) : List.of(s.type.giver);
                        for (Vow.Giver g : givers) {
                            for (Vow v : Vow.pool(g)) {
                                if (have.contains(v.id)) continue;
                                if (v.xpCost > 0 && p.getLevel() < v.xpCost) continue;
                                pool.add(v);
                            }
                        }
                    }
                    Collections.shuffle(pool, rng);
                    Vow aw = null;
                    if (s.type.giver == Vow.Giver.MANIFESTATION) {
                        for (Vow v : Vow.awakenings()) if (awaken.eligible(p, v)) { aw = v; break; }
                    }
                    int n = prophet ? 1 : Math.max(1, plugin.getConfig().getInt("options", 3));
                    int take = Math.min(pool.size(), aw != null ? n - 1 : n);
                    for (int i = 0; i < take; i++) s.offers.add(pool.get(i));
                    if (aw != null) s.offers.add(aw);
                }

                private void showOptions(Session s) {
                    Player p = s.p;
                    TextColor wc = s.type.color;
                    boolean prophet = s.type == WispType.PROPHET;
                    p.sendMessage(Component.empty());
                    p.sendMessage(Component.text("<" + s.type.displayName + "> ", wc).append(Component.text(
                            prophet ? "A variable has been introduced. I will not command you. Accept it, or do not." : "choose. answer here in chat.", NamedTextColor.GRAY)));
                    for (int i = 0; i < s.offers.size(); i++) {
                        Vow v = s.offers.get(i);
                        TextColor c = v.awakening ? GOLD : wc;
                        String head = v.awakening ? "\u2605 AWAKENING \u00B7 " + v.name : v.name;
                        p.sendMessage(Component.text(" [" + (i + 1) + "] ", c, TextDecoration.BOLD).append(Component.text(head, c, v.awakening ? TextDecoration.BOLD : TextDecoration.ITALIC)));
                        p.sendMessage(Component.text("      - " + v.sacrifice, NamedTextColor.RED));
                        p.sendMessage(Component.text("      + " + v.blessing, NamedTextColor.GREEN));
                        if (v.xpCost > 0) p.sendMessage(Component.text("      cost: " + v.xpCost + " XP levels", NamedTextColor.YELLOW));
                        if (v.minutes > 0) p.sendMessage(Component.text("      lasts " + v.minutes + " minutes", NamedTextColor.DARK_GRAY));
                    }
                    Component prompt = s.offers.size() == 1
                            ? Component.text(" type ", NamedTextColor.GRAY).append(Component.text("accept", NamedTextColor.GREEN)).append(Component.text(" \u2014 or ", NamedTextColor.GRAY))
                            : Component.text(" type a number or a vow's name \u2014 or ", NamedTextColor.GRAY);
                    p.sendMessage(prompt.append(Component.text("cancel", NamedTextColor.RED)).append(Component.text(" to refuse.", NamedTextColor.GRAY)));
                    p.sendMessage(Component.empty());
                }

                // ================= CHAT =================

                @EventHandler(priority = EventPriority.LOWEST)
                public void onChat(AsyncChatEvent e) {
                    Player p = e.getPlayer();
                    Session s = sessions.get(p.getUniqueId());
                    if (s == null) return;
                    String msg = PlainTextComponentSerializer.plainText().serialize(e.message()).trim();
                    boolean asking = s.state == State.ASK;
                    if (!asking && !CANCEL.contains(msg.toLowerCase(Locale.ROOT))) return;
                    e.setCancelled(true); // the wisp's answer is private
                    Bukkit.getScheduler().runTask(plugin, () -> reply(p, msg));
                }

                private void reply(Player p, String msg) {
                    Session s = sessions.get(p.getUniqueId());
                    if (s == null) return;
                    String m = msg.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9 ]", " ").trim().replaceAll("\\s+", " ");
                    if (CANCEL.contains(m)) { refuse(s); return; }
                    if (s.state != State.ASK) return;

                    Vow pick = null;
                    if (s.offers.size() == 1 && ACCEPT.contains(m)) {
                        pick = s.offers.get(0);
                    } else if (m.matches("\\d{1,2}")) {
                        int i = Integer.parseInt(m) - 1;
                        if (i >= 0 && i < s.offers.size()) pick = s.offers.get(i);
                    } else if (!m.isEmpty()) {
                        List<Vow> hits = new ArrayList<>();
                        for (Vow v : s.offers) if (matches(v, m)) hits.add(v);
                        if (hits.size() == 1) pick = hits.get(0);
                        else if (hits.size() > 1) { p.sendActionBar(Component.text("be more specific.", NamedTextColor.GRAY)); return; }
                    }
                    if (pick == null) {
                        String ask = s.offers.size() == 1 ? "accept, or cancel." : "choose 1-" + s.offers.size() + ", or cancel.";
                        p.sendActionBar(Component.text("the wisp waits. " + ask, s.type.color));
                        return;
                    }
                    choose(s, pick);
                }

                private static boolean matches(Vow v, String m) {
                    String n = v.name.toLowerCase(Locale.ROOT);
                    String bare = n.replace("vow of the ", "").replace("vow of ", "");
                    String id = v.id.replace('_', ' ');
                    if (m.equals(n) || m.equals(bare) || m.equals(id)) return true;
                    if (v.awakening && (m.startsWith("awaken") || m.equals(v.gem))) return true;
                    return m.length() >= 3 && (n.contains(m) || id.contains(m));
                }

                private void choose(Session s, Vow v) {
                    Player p = s.p;
                    if (v.awakening) {
                        if (!awaken.eligible(p, v)) { p.sendActionBar(Component.text("the gem is no longer with you.", NamedTextColor.RED)); return; }
                        sessions.remove(p.getUniqueId());
                        burst(s);
                        awaken.begin(p, v);
                        return;
                    }
                    VowManager.Result r = vows.grant(p, v, false);
                    switch (r) {
                        case OK -> {
                            p.showTitle(Title.title(
                                    Component.text("\u0299\u026A\u0274\u1D05\u026A\u0274\u0262 \u1D20\u1D0F\u1D21 ", NamedTextColor.WHITE, TextDecoration.BOLD)
                                            .append(Component.text("\u1D04\u0280\u1D07\u1D00\u1D1B\u1D07\u1D05", NamedTextColor.GREEN, TextDecoration.BOLD)),
                                    Component.text(v.name, s.type.color),
                                    Title.Times.times(Duration.ofMillis(300), Duration.ofMillis(2200), Duration.ofMillis(600))));
                            p.sendActionBar(Component.text(s.type.doneLine, s.type.color));
                            p.playSound(p.getLocation(), Sound.ENTITY_PLAYER_LEVELUP, 0.8f, pitch(s));
                            CameraFx.shake(p, 0.8, 8);
                            burst(s);
                            s.state = State.FADE_OUT; s.t = 0;
                        }
                        case HAVE -> p.sendActionBar(Component.text("you already carry that vow.", NamedTextColor.GRAY));
                        case MAX -> p.sendActionBar(Component.text("you can carry only " + VowManager.MAX_VOWS + " vows.", NamedTextColor.RED));
                        case XP -> p.sendActionBar(Component.text("you need " + v.xpCost + " XP levels.", NamedTextColor.RED));
                    }
                }

                private void refuse(Session s) {
                    if (s.state == State.FADE_OUT) return;
                    s.p.sendActionBar(Component.text(s.type.refuseLine, s.type.color));
                    s.p.playSound(s.p.getLocation(), Sound.BLOCK_AMETHYST_BLOCK_CHIME, 0.8f, pitch(s) - 0.3f);
                    s.state = State.FADE_OUT; s.t = 0;
                }

                private void burst(Session s) {
                    if (s.pos == null) return;
                    s.p.spawnParticle(Particle.END_ROD, s.pos, 120, 3.0, 3.0, 3.0, 0.15);
                }

                @EventHandler public void onQuit(PlayerQuitEvent e) { sessions.remove(e.getPlayer().getUniqueId()); hourglasses.remove(e.getPlayer().getUniqueId()); }
                @EventHandler public void onDeath(PlayerDeathEvent e) { sessions.remove(e.getEntity().getUniqueId()); }
            }
            EOF_JAVA

      - name: Create WispType.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/WispType.java)
            cat > src/main/java/me/lofi/wisps/WispType.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import net.kyori.adventure.text.format.TextColor;

            import java.util.List;

            public enum WispType {
                MANIFESTATION("The Manifestation", Vow.Giver.MANIFESTATION, "#E8E27A",
                        List.of("about time...", "your gem is broken, isn't it?", "i can make it whole. stronger.", "but nothing comes free. choose."),
                        List.of("you want more, don't you?", "i can give it to you.", "for a price. choose."),
                        "it is done.", "then stay as you are."),
                BALANCE("Balance", Vow.Giver.BALANCE, "#F2EFE6",
                        List.of("your gem has cracked.", "everything can be made whole.", "but every gift has a weight.", "choose evenly."),
                        List.of("power is never free.", "it is only moved from one hand to the other.", "choose evenly."),
                        "it is balanced.", "so be it. the scales will wait."),
                PROPHET("The Prophet", Vow.Giver.PROPHET, "#D6D0FF",
                        Speech.LINES, Speech.LINES,
                        "So it begins.", "Then I shall simply watch what you do instead.");

                /** The Prophet's speech before the Assessment. */
                private static final class Speech {
                    static final List<String> LINES = List.of(
                            "It has been a long silence...",
                            "Has it not?",
                            "Once again, we stand at the edge of yet another end.",
                            "So now...",
                            "I offer a second test.",
                            "This time, one among you has received something far greater.",
                            "THE HONORED ONE",
                            "walks among you already...",
                            "But this title they will not hold for long.",
                            "For what they possess is not strength,",
                            "But access.",
                            "Deep beneath the surface",
                            "Lies the power to shape all.",
                            "The world, the gems",
                            "Some may call it...",
                            "The Control Room",
                            "Even the server's final fate.",
                            "But such power is not given",
                            "It is claimed.",
                            "For the next 10 days, the title of Honored One will drift",
                            "Passed through Ambush, Betrayal, and Despair.",
                            "You will be seen as a threat",
                            "to others' vision of what this world should be",
                            "And they will try to manipulate you",
                            "Kill you",
                            "And destroy you.",
                            "But know this:",
                            "When my timer ends, the one who holds the title shall ascend",
                            "And all others will face the consequences of their decisions.",
                            "But, to ensure he who rises is worthy...",
                            "I've set my own measures in motion.",
                            "They are already watching.",
                            "If you believe divinity",
                            "could be held so easily...",
                            "Then you understand nothing at all.",
                            "The Assessment has begun.");
                }

                public final String displayName;
                public final Vow.Giver giver;
                public final TextColor color;
                public final List<String> brokenGemLines, offerLines;
                public final String doneLine, refuseLine;

                WispType(String displayName, Vow.Giver giver, String hex, List<String> brokenGemLines, List<String> offerLines,
                         String doneLine, String refuseLine) {
                    this.displayName = displayName; this.giver = giver; this.color = TextColor.fromHexString(hex);
                    this.brokenGemLines = brokenGemLines; this.offerLines = offerLines; this.doneLine = doneLine; this.refuseLine = refuseLine;
                }

                public static WispType parse(String s) {
                    if (s == null) return null;
                    s = s.toLowerCase();
                    if (s.startsWith("man")) return MANIFESTATION;
                    if (s.startsWith("bal")) return BALANCE;
                    if (s.startsWith("pro")) return PROPHET;
                    return null;
                }
            }
            EOF_JAVA

      - name: Create WispsPlugin.java
        run: |
            mkdir -p $(dirname src/main/java/me/lofi/wisps/WispsPlugin.java)
            cat > src/main/java/me/lofi/wisps/WispsPlugin.java <<'EOF_JAVA'
            package me.lofi.wisps;

            import org.bukkit.command.PluginCommand;
            import org.bukkit.plugin.java.JavaPlugin;

            public final class WispsPlugin extends JavaPlugin {

                private static WispsPlugin instance;
                private VowManager vows;
                private GemBridge bridge;
                private AwakeningManager awakenings;
                private WispManager wisps;
                private TrackingManager tracking;
                private PrismaticEdge edge;
                private ControlRoom room;

                @Override
                public void onEnable() {
                    instance = this;
                    saveDefaultConfig();
                    CameraFx.start(this);

                    bridge = new GemBridge(this);
                    vows = new VowManager(this);
                    awakenings = new AwakeningManager(this, vows, bridge);
                    vows.setHooks(awakenings);
                    vows.start();
                    awakenings.start();
                    new EchoAbilities(this, vows).start();
                    tracking = new TrackingManager(this, vows);
                    tracking.start();
                    wisps = new WispManager(this, vows, awakenings, bridge);
                    wisps.start();

                    // ---- the Control Room ----
                    ControlStore store = new ControlStore(this);
                    ControlRules rules = new ControlRules(this, store);
                    HonoredOneManager honored = new HonoredOneManager(this, store);
                    honored.setWisps(wisps);
                    honored.start();
                    tracking.setHonored(honored);
                    edge = new PrismaticEdge(this, rules);
                    edge.start();
                    new RuleEnforcer(this, rules, ControlRoom.WORLD).start();
                    room = new ControlRoom(this, store, rules, honored, edge);
                    room.start();
                    ControlCommands cc = new ControlCommands(room, rules, honored, edge);
                    for (String name : new String[]{"controlroom", "honored"}) {
                        PluginCommand pc = getCommand(name);
                        if (pc != null) { pc.setExecutor(cc); pc.setTabCompleter(cc); }
                    }

                    CooldownScaler scaler = new CooldownScaler(vows, bridge);
                    getServer().getScheduler().runTaskTimer(this, scaler::tick, 20L, 2L);

                    PluginCommand vow = getCommand("vow");
                    PluginCommand wisp = getCommand("wisp");
                    if (vow != null) { VowCommand c = new VowCommand(vows); vow.setExecutor(c); vow.setTabCompleter(c); }
                    PluginCommand track = getCommand("track");
                    if (track != null) track.setExecutor(tracking);
                    if (wisp != null) { WispCommand c = new WispCommand(this, wisps, awakenings, tracking); wisp.setExecutor(c); wisp.setTabCompleter(c); }
                    getLogger().info("Loaded " + Vow.all().size() + " binding vows (BlissGems bridge: " + (bridge.available() ? "on" : "waiting") + ").");
                }

                @Override
                public void onDisable() {
                    if (awakenings != null) awakenings.shutdown();
                    if (wisps != null) wisps.shutdown();
                    if (edge != null) edge.shutdown();
                }

                public static WispsPlugin get() { return instance; }
                /** API: read cooldownMultiplier(player) etc. */
                public VowManager vows() { return vows; }
                /** API: call when a gem breaks, e.g. wisps().offer(player, WispType.MANIFESTATION, true). */
                public WispManager wisps() { return wisps; }
                public AwakeningManager awakenings() { return awakenings; }
            }
            EOF_JAVA

      - name: Build
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Wisps
          path: target/Wisps-*.jar
          if-no-files-found: error

      - name: Publish jar to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wisps build ${{ github.run_number }}
          files: target/Wisps-*.jar
