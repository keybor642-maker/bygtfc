                            .restrict(Restriction.FAST_HUNGER).hearts(3).reg();
                    m("silence", "Vow of Silence").sac("You can't use chat").gain("Permanent Speed I + Night Vision")
                            .restrict(Restriction.NO_CHAT).effect(PotionEffectType.SPEED, 0).effect(PotionEffectType.NIGHT_VISION, 0).reg();
                    m("beacon", "Vow of the Beacon").sac("Permanently glowing (everyone sees you)").gain("+4 max hearts")
                            .restrict(Restriction.GLOWING).hearts(4).reg();
