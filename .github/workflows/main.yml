                            .restrict(Restriction.NO_NATURAL_REGEN).lifesteal(0.2).reg();
                    m("bare_head", "Vow of the Bare Head").sac("Can't wear helmets").gain("+15% damage dealt")
                            .restrict(Restriction.NO_HELMET).dealt(1.15).reg();
                    m("hollow_chest", "Vow of the Hollow Chest").sac("Can't wear chestplates").gain("+30% attack speed")
                            .restrict(Restriction.NO_CHESTPLATE).atkSpeed(0.3).reg();
                    m("light_feet", "Vow of Light Feet").sac("Can't wear boots").gain("+20% move speed, no fall damage")
                            .restrict(Restriction.NO_BOOTS).move(0.2).noFall().reg();
                    m("bare_legs", "Vow of Bare Legs").sac("Can't wear leggings").gain("+25% attack speed")
                            .restrict(Restriction.NO_LEGGINGS).atkSpeed(0.25).reg();
                    m("open_hand", "Vow of the Open Hand").sac("Can't use your offhand").gain("+1.5 reach, +10% damage dealt")
                            .restrict(Restriction.NO_OFFHAND).reach(1.5).dealt(1.1).reg();
                    m("clean_hands", "Vow of Clean Hands").sac("Can't eat golden apples").gain("-15% damage taken")
                            .restrict(Restriction.NO_GAPPLES).taken(0.85).reg();
                    m("blind_eye", "Vow of the Blind Eye").sac("Can't use bows, crossbows or tridents").gain("+20% damage dealt")
                            .restrict(Restriction.NO_RANGED).dealt(1.2).reg();
                    m("stillness", "Vow of Stillness").sac("Can't sprint").gain("Gem cooldowns x0.6")
