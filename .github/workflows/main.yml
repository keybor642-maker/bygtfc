            package me.lofi.wisps;

            import org.bukkit.potion.PotionEffectType;

            import java.util.*;

            /** One Binding Vow = a sacrifice + a blessing. All vows are defined in the static block at the bottom. */
            public final class Vow {

                public enum Giver { MANIFESTATION, BALANCE, PROPHET }

                public enum Restriction {
                    NO_HELMET, NO_CHESTPLATE, NO_LEGGINGS, NO_BOOTS, NO_OFFHAND, NO_SPRINT, NO_PEARLS,
                    NO_GAPPLES, NO_RANGED, NO_CHAT, NO_BLOCK_PLACE, NO_TOTEM, NO_SLEEP,
                    NO_NATURAL_REGEN, FAST_HUNGER, GLOWING
                }

                public record Eff(PotionEffectType type, int amp) {}

                public final String id, name;
                public final Giver giver;
                public String sacrifice = "", blessing = "";

                // attribute-style numbers (scalars are +0.20 = +20%)
                public double hearts, moveSpeed, attackSpeed, armor, stepHeight, reach, knockbackRes;
                // event-style multipliers
                public double cooldownMult = 1, dealtMult = 1, takenMult = 1, healingMult = 1;
                public double executeBonus, lifesteal, reflect;
                public boolean noFall, keepInventory, tide;
                public int xpCost, minutes; // minutes = 0 -> permanent
                public final Set<Restriction> restrictions = EnumSet.noneOf(Restriction.class);
                public final List<Eff> effects = new ArrayList<>();

                // awakenings: a mythic gem's "insane power for a drawback", offered by the Manifestation
                public boolean awakening, lastStand, tracked;
                public String gem = "";
                public int minTier = 1, burnoutSeconds;
                public final List<Eff> burnoutEffects = new ArrayList<>();

                private Vow(String id, String name, Giver g) { this.id = id; this.name = name; this.giver = g; }

                // ---- fluent builder ----
                public Vow sac(String s) { sacrifice = s; return this; }
                public Vow gain(String s) { blessing = s; return this; }
                public Vow hearts(double d) { hearts = d; return this; }
                public Vow move(double d) { moveSpeed = d; return this; }
                public Vow atkSpeed(double d) { attackSpeed = d; return this; }
                public Vow armor(double d) { armor = d; return this; }
                public Vow step(double d) { stepHeight = d; return this; }
                public Vow reach(double d) { reach = d; return this; }
                public Vow kbRes(double d) { knockbackRes = d; return this; }
                public Vow cd(double m) { cooldownMult = m; return this; }
                public Vow dealt(double m) { dealtMult = m; return this; }
                public Vow taken(double m) { takenMult = m; return this; }
                public Vow healing(double m) { healingMult = m; return this; }
                public Vow execute(double b) { executeBonus = b; return this; }
                public Vow lifesteal(double l) { lifesteal = l; return this; }
                public Vow reflect(double r) { reflect = r; return this; }
                public Vow noFall() { noFall = true; return this; }
                public Vow keepInv() { keepInventory = true; return this; }
                public Vow tide() { tide = true; return this; }
                public Vow xp(int levels) { xpCost = levels; return this; }
                public Vow forMinutes(int m) { minutes = m; return this; }
                public Vow restrict(Restriction... r) { restrictions.addAll(Arrays.asList(r)); return this; }
                public Vow effect(PotionEffectType t, int amp) { effects.add(new Eff(t, amp)); return this; }
                public Vow awaken(String gemId, int tier) { awakening = true; gem = gemId; minTier = tier; return this; }
                public Vow lastStand() { lastStand = true; return this; }
                public Vow tracked() { tracked = true; return this; }
                public Vow burnout(int seconds, Eff... e) { burnoutSeconds = seconds; burnoutEffects.addAll(Arrays.asList(e)); return this; }
                private void reg() { ALL.put(id, this); }

                // ---- registry ----
                private static final Map<String, Vow> ALL = new LinkedHashMap<>();
                public static Vow get(String id) { return id == null ? null : ALL.get(id.toLowerCase(Locale.ROOT)); }
                public static Collection<Vow> all() { return Collections.unmodifiableCollection(ALL.values()); }
                /** Regular vows a wisp of this type can offer (awakenings are handled separately). */
                public static List<Vow> pool(Giver g) {
                    List<Vow> out = new ArrayList<>();
                    for (Vow v : ALL.values()) if (!v.awakening && v.giver == g) out.add(v);
                    return out;
                }
                public static List<Vow> awakenings() {
                    List<Vow> out = new ArrayList<>();
                    for (Vow v : ALL.values()) if (v.awakening) out.add(v);
                    return out;
                }
                public static Vow awakeningFor(String gemId) {
                    if (gemId == null) return null;
                    for (Vow v : ALL.values()) if (v.awakening && v.gem.equalsIgnoreCase(gemId)) return v;
                    return null;
                }
                private static Vow m(String id, String name) { return new Vow(id, name, Giver.MANIFESTATION); }
                private static Vow b(String id, String name) { return new Vow(id, name, Giver.BALANCE); }

                static {
                    // ===================== THE MANIFESTATION (temptation: big power, real cost) =====================
                    m("blood", "Vow of Blood").sac("-2 max hearts").gain("Gem cooldowns x0.5").hearts(-2).cd(0.5).reg();
                    m("glass", "Vow of Glass").sac("-5 max hearts").gain("+40% damage dealt").hearts(-5).dealt(1.4).reg();
